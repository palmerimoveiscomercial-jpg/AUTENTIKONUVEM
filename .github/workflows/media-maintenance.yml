name: Manutenção da nuvem documental

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-maintenance-production
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    environment: production-media
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      AUTENTIKO_SPREADSHEET_ID: ${{ secrets.AUTENTIKO_SPREADSHEET_ID }}
      AUTENTIKO_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AUTENTIKO_DRIVE_ROOT_FOLDER_ID }}
      ADOBE_ENABLED: ${{ vars.ADOBE_ENABLED || 'false' }}
      ADOBE_CLIENT_ID: ${{ secrets.ADOBE_CLIENT_ID }}
      ADOBE_CLIENT_SECRET: ${{ secrets.ADOBE_CLIENT_SECRET }}
      ADOBE_MONTHLY_LIMIT: ${{ vars.ADOBE_MONTHLY_LIMIT || '500' }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      RECONCILE_LIMIT: "100"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - run: npm ci
      - name: Processar cópias, miniaturas e PDFs derivados
        run: npm run jobs -w scripts
      - name: Reconciliar hashes Drive e Supabase
        run: npm run reconcile -w scripts
