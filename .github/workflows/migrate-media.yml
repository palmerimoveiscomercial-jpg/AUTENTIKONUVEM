name: Migrar documentos para Supabase

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Somente inventariar, sem alterar dados"
        required: true
        type: boolean
        default: true
      limit:
        description: "Máximo de documentos neste lote"
        required: true
        default: "25"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - run: npm ci
      - name: Migrar lote retomável
        run: npm run migrate -w scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AUTENTIKO_SPREADSHEET_ID: ${{ secrets.AUTENTIKO_SPREADSHEET_ID }}
          AUTENTIKO_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AUTENTIKO_DRIVE_ROOT_FOLDER_ID }}
          MIGRATION_DRY_RUN: ${{ inputs.dry_run }}
          MIGRATION_LIMIT: ${{ inputs.limit }}
