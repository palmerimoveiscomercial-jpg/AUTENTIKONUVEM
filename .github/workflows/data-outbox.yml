name: Replicação Neon para Supabase

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autentiko-data-outbox-production
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    environment: production-media
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_OUTBOX_LIMIT: "100"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar eventos idempotentes no espelho Supabase
        run: npm run outbox -w scripts
