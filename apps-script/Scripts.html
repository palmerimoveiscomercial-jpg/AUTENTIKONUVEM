<script>
(() => {
  'use strict';

  const state = {
    token: localStorage.getItem('autentiko_token') || '',
    bootstrap: null,
    public: null,
    processes: [],
    currentProcess: null,
    contracts: [],
    contractQueue: 'TODOS',
    admin: null,
    adminLoadedAt: new Map(),
    forcePasswordChange: false,
    documentUploadProcessId: '',
    pendingDocumentFiles: new Map(),
    uploadQueue: [],
    uploadJobs: new Map(),
    uploadWorkers: 0,
    uploadConcurrency: 2,
    uploadRefreshTimer: 0,
    previewReturnModal: '',
    previewReturnFocus: null,
    previewObjectUrl: '',
    previewObjectUrlOwned: false,
    previewFallbackIsImage: false,
    previewDocumentId: '',
    pdfDocument: null,
    pdfRenderTask: null,
    pdfPage: 1,
    pdfScale: 1.15,
    pdfJs: null,
    pdfJsPromise: null,
    pdfWorkerObjectUrl: '',
    tusClientPromise: null,
    previewRotation: 0,
    previewLoadToken: 0,
    forwardData: null,
    processDetailTab: 'registration',
    processLoadedTabs: new Set(),
    processTabVersions: new Map(),
    processTabCache: new Map(),
    processTabFetches: new Map(),
    processShellCache: new Map(),
    processTabScroll: new Map(),
    processViewToken: 0,
    processSyncPromise: null,
    processListRefreshTimer: 0,
    visualObjectUrls: new Map(),
    visualLoadToken: 0,
    visualObserver: null,
    visualThumbnailQueue: [],
    visualThumbnailQueued: new Set(),
    visualThumbnailWorkers: 0,
    visualThumbnailConcurrency: 2,
    browserCacheDb: null,
    browserCacheReady: null,
    browserCacheMemory: new Map(),
    browserCacheNamespace: 'public',
    browserCacheCleanupScheduled: false,
    documentFetches: new Map(),
    thumbnailFetches: new Map(),
    thumbnailMisses: new Map(),
    cloudAccessCache: new Map(),
    cloudPreviewCircuitUntil: 0,
    cloudPreviewFailures: 0,
    imageEncoderSupport: new Map(),
    formSchemaFetches: new Map(),
    processDraftDirty: false,
    processDraftTimer: 0,
    processFormMode: 'create',
    processEditId: '',
    processEditExpectedVersion: 0,
    database: {
      tab: 'clients',
      clients: [],
      properties: [],
      clientPage: 1,
      propertyPage: 1,
      clientTotal: 0,
      propertyTotal: 0,
      canEditClients: false,
      canEditProperties: false
    },
    databaseMatch: null,
    databaseLookupTimer: 0,
    databaseLookupNonce: 0,
    databaseLookupCache: new Map(),
    databaseLookupPending: new Map(),
    propertyLookupTimer: 0,
    context: {
      device: {
        userAgent: navigator.userAgent,
        platform: navigator.platform || '',
        language: navigator.language || '',
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
        screen: `${screen.width}x${screen.height}`
      },
      location: {}
    }
  };

  const $ = (selector, root = document) => root?.querySelector ? root.querySelector(selector) : null;
  const $$ = (selector, root = document) => root?.querySelectorAll ? Array.from(root.querySelectorAll(selector)) : [];
  const formControl = (form, name) => form?.elements?.namedItem(name) || null;
  const apiInFlight = new Map();
  const requestId = () => {
    if (globalThis.crypto?.randomUUID) return crypto.randomUUID();
    if (globalThis.crypto?.getRandomValues) {
      const bytes = new Uint8Array(16);
      globalThis.crypto.getRandomValues(bytes);
      return Array.from(bytes, value => value.toString(16).padStart(2, '0')).join('');
    }
    return `${Date.now()}-${String(performance.now()).replace('.', '-')}`;
  };
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const dateText = value => {
    if (!value) return '—';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? esc(value) : date.toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});
  };
  const roleText = value => ({DESENVOLVEDOR:'Desenvolvedor',ADMINISTRADOR:'Administrador',GERENTE_GERAL:'Gerente geral',GERENTE_ADMINISTRATIVO:'Gerente administrativo',ASSISTENTE_ADMINISTRATIVO:'Administrativo',AUDITOR:'Auditor',CORRETOR:'Corretor'}[value] || value);
  const statusText = value => String(value || '').replace(/_/g, ' ').toLowerCase().replace(/(^|\s)\S/g, m => m.toUpperCase());
  const hasPermission = permission => state.bootstrap?.user?.permissions?.includes('*') || state.bootstrap?.user?.permissions?.includes(permission);
  const API_TIMEOUTS = {
    apiPublicBootstrap: 20000,
    apiBootstrap: 30000,
    apiBuscarCadastroPorDocumento: 15000,
    apiUploadDocumentoForm: 180000,
    apiUploadDocumento: 180000,
    apiAbrirProcesso: 30000,
    apiCarregarAbaProcesso: 45000,
    apiCarregarMaisAuditoriaProcesso: 45000,
    apiMiniaturaDocumento: 30000,
    apiPrepararDocumento: 90000,
    apiLerChunkDocumento: 90000,
    apiVisualizarDocumento: 90000,
    apiBaixarDocumento: 90000,
    apiReservarUploadNuvem: 30000,
    apiVerificarProntidaoUploadGrande: 30000,
    apiCriarTicketMidia: 30000,
    apiFinalizarUploadNuvem: 30000,
    apiConsultarEstadoMidia: 30000,
    apiReprocessarMidia: 30000
  };
  const BROWSER_CACHE = Object.freeze({
    schemaVersion: '2.5.5',
    database: 'AUTENTIKO_BROWSER_CACHE',
    store: 'entries',
    maxBytes: 96 * 1024 * 1024,
    maxEntryBytes: 8 * 1024 * 1024,
    documentTtlMs: 7 * 24 * 60 * 60 * 1000,
    thumbnailTtlMs: 7 * 24 * 60 * 60 * 1000,
    processTabTtlMs: 5 * 60 * 1000,
    processShellTtlMs: 60 * 1000,
    formSchemaTtlMs: 12 * 60 * 60 * 1000
  });
  const PROCESS_TAB_TTL_MS = Object.freeze({
    registration:10 * 60 * 1000,
    documents:2 * 60 * 1000,
    review:60 * 1000,
    audit:30 * 1000
  });
  const AUTO_THUMBNAIL_SOURCE_LIMIT = 4 * 1024 * 1024;
  const CLOUD_PREVIEW_TIMEOUT_MS = 8000;
  const CLOUD_DOCUMENT_TIMEOUT_MS = 15000;
  const CLOUD_PREVIEW_CIRCUIT_MS = 45 * 1000;
  const SHORT_PROCESS_DRAFT_TTL_MS = 10 * 60 * 1000;
  const CUSTOMER_LOOKUP_TTL_MS = 10 * 60 * 1000;
  const CUSTOMER_LOOKUP_MISS_TTL_MS = 60 * 1000;

  function readCookie(name) {
    const prefix = `${encodeURIComponent(name)}=`;
    return document.cookie.split(';').map(value => value.trim())
      .find(value => value.startsWith(prefix))?.slice(prefix.length) || '';
  }

  function writeCacheMetadataCookie() {
    try {
      document.cookie = `autentiko_cache_schema=${encodeURIComponent(BROWSER_CACHE.schemaVersion)}; Path=/; Max-Age=2592000; SameSite=Strict; Secure`;
    } catch (ignoreCookieRestriction) {}
    try { localStorage.setItem('autentiko_cache_schema', BROWSER_CACHE.schemaVersion); }
    catch (ignoreStorageRestriction) {}
  }

  function openBrowserCacheDatabase() {
    if (!globalThis.indexedDB) return Promise.reject(new Error('IndexedDB indisponível.'));
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(BROWSER_CACHE.database, 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(BROWSER_CACHE.store)) {
          const store = db.createObjectStore(BROWSER_CACHE.store, {keyPath:'key'});
          store.createIndex('lastAccess', 'lastAccess');
          store.createIndex('namespace', 'namespace');
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Não foi possível abrir o cache local.'));
      request.onblocked = () => reject(new Error('O cache local está bloqueado por outra aba.'));
    });
  }

  function cacheTransaction(mode, callback) {
    const db = state.browserCacheDb;
    if (!db) return Promise.reject(new Error('Cache persistente indisponível.'));
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(BROWSER_CACHE.store, mode);
      const store = transaction.objectStore(BROWSER_CACHE.store);
      let result;
      try { result = callback(store, transaction); }
      catch (error) { reject(error); return; }
      transaction.oncomplete = () => resolve(result);
      transaction.onerror = () => reject(transaction.error || new Error('Falha no cache local.'));
      transaction.onabort = () => reject(transaction.error || new Error('Operação de cache cancelada.'));
    });
  }

  async function clearPersistentBrowserCache() {
    state.browserCacheMemory.clear();
    if (!state.browserCacheDb) return;
    await cacheTransaction('readwrite', store => store.clear()).catch(() => {});
  }

  async function initializeBrowserCache() {
    if (state.browserCacheReady) return state.browserCacheReady;
    state.browserCacheReady = (async () => {
      try {
        state.browserCacheDb = await openBrowserCacheDatabase();
        const storedSchema = decodeURIComponent(readCookie('autentiko_cache_schema') || '') ||
          (() => { try { return localStorage.getItem('autentiko_cache_schema') || ''; } catch (ignore) { return ''; } })();
        if (storedSchema !== BROWSER_CACHE.schemaVersion) {
          await clearPersistentBrowserCache();
        }
        writeCacheMetadataCookie();
        await cleanupBrowserCache();
        return true;
      } catch (error) {
        state.browserCacheDb = null;
        return false;
      }
    })();
    return state.browserCacheReady;
  }

  function configureBrowserCacheForUser(user) {
    const next = String(user?.id || user?.email || 'authenticated').toLowerCase();
    if (state.browserCacheNamespace !== next) {
      clearCustomerLookupCache();
      state.browserCacheNamespace = next;
      state.browserCacheMemory.clear();
      state.processTabCache.clear();
      state.processShellCache.clear();
      state.processTabFetches.clear();
      state.formSchemaFetches.clear();
      state.processTabScroll.clear();
      state.cloudAccessCache.clear();
      state.cloudPreviewCircuitUntil = 0;
      state.cloudPreviewFailures = 0;
    }
  }

  function clearProcessSessionEntries(namespace = state.browserCacheNamespace) {
    try {
      const prefix = `autentiko:${BROWSER_CACHE.schemaVersion}:${namespace}:`;
      for (let index = sessionStorage.length - 1; index >= 0; index -= 1) {
        const key = sessionStorage.key(index);
        if (key?.startsWith(prefix)) sessionStorage.removeItem(key);
      }
    } catch (ignoreStorageRestriction) {}
  }

  function browserCacheKey(kind, identity) {
    return `${BROWSER_CACHE.schemaVersion}|${state.browserCacheNamespace}|${kind}|${identity}`;
  }

  function requestToPromise(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Falha ao consultar o cache local.'));
    });
  }

  async function browserCacheGet(kind, identity) {
    const key = browserCacheKey(kind, identity);
    const memory = state.browserCacheMemory.get(key);
    if (memory && memory.expiresAt > Date.now()) {
      memory.lastAccess = Date.now();
      return memory;
    }
    if (memory) state.browserCacheMemory.delete(key);
    await initializeBrowserCache();
    if (!state.browserCacheDb) return null;
    try {
      const transaction = state.browserCacheDb.transaction(BROWSER_CACHE.store, 'readonly');
      const entry = await requestToPromise(transaction.objectStore(BROWSER_CACHE.store).get(key));
      if (!entry || entry.expiresAt <= Date.now()) {
        if (entry) void browserCacheDelete(kind, identity);
        return null;
      }
      entry.lastAccess = Date.now();
      state.browserCacheMemory.set(key, entry);
      void cacheTransaction('readwrite', store => store.put(entry)).catch(() => {});
      return entry;
    } catch (error) { return null; }
  }

  async function browserCachePut(kind, identity, blob, metadata = {}) {
    if (!(blob instanceof Blob) || !blob.size || blob.size > BROWSER_CACHE.maxEntryBytes) return false;
    const now = Date.now();
    const ttl = kind === 'thumbnail' ? BROWSER_CACHE.thumbnailTtlMs : BROWSER_CACHE.documentTtlMs;
    const entry = {
      key:browserCacheKey(kind, identity),
      namespace:state.browserCacheNamespace,
      kind,
      blob,
      size:blob.size,
      mimeType:String(metadata.mimeType || blob.type || 'application/octet-stream'),
      fileName:String(metadata.fileName || ''),
      hash:String(metadata.hash || ''),
      createdAt:now,
      lastAccess:now,
      expiresAt:now + ttl
    };
    state.browserCacheMemory.set(entry.key, entry);
    await initializeBrowserCache();
    if (!state.browserCacheDb) return true;
    try {
      await cacheTransaction('readwrite', store => store.put(entry));
      scheduleBrowserCacheCleanup();
      return true;
    } catch (error) {
      state.browserCacheMemory.delete(entry.key);
      return false;
    }
  }

  async function browserCacheDelete(kind, identity) {
    const key = browserCacheKey(kind, identity);
    state.browserCacheMemory.delete(key);
    await initializeBrowserCache();
    if (!state.browserCacheDb) return;
    await cacheTransaction('readwrite', store => store.delete(key)).catch(() => {});
  }

  async function clearCurrentUserBrowserCache() {
    const namespace = state.browserCacheNamespace;
    clearProcessSessionEntries(namespace);
    [...state.browserCacheMemory.keys()].filter(key => key.includes(`|${namespace}|`))
      .forEach(key => state.browserCacheMemory.delete(key));
    state.processTabCache.clear();
    state.processShellCache.clear();
    state.processTabFetches.clear();
    state.formSchemaFetches.clear();
    state.processTabScroll.clear();
    state.documentFetches.clear();
    await initializeBrowserCache();
    if (!state.browserCacheDb) return;
    await new Promise(resolve => {
      const transaction = state.browserCacheDb.transaction(BROWSER_CACHE.store, 'readwrite');
      const request = transaction.objectStore(BROWSER_CACHE.store).openCursor();
      request.onsuccess = () => {
        const cursor = request.result;
        if (!cursor) return;
        if (cursor.value?.namespace === namespace) cursor.delete();
        cursor.continue();
      };
      transaction.oncomplete = resolve;
      transaction.onerror = resolve;
      transaction.onabort = resolve;
    });
  }

  async function cleanupBrowserCache() {
    if (!state.browserCacheDb) return;
    const entries = await new Promise(resolve => {
      const values = [];
      const transaction = state.browserCacheDb.transaction(BROWSER_CACHE.store, 'readonly');
      const request = transaction.objectStore(BROWSER_CACHE.store).openCursor();
      request.onsuccess = () => {
        const cursor = request.result;
        if (!cursor) return;
        values.push(cursor.value);
        cursor.continue();
      };
      transaction.oncomplete = () => resolve(values);
      transaction.onerror = () => resolve(values);
    });
    const now = Date.now();
    const valid = entries.filter(entry => entry.expiresAt > now)
      .sort((a, b) => Number(b.lastAccess || 0) - Number(a.lastAccess || 0));
    let retainedBytes = 0;
    const remove = new Set(entries.filter(entry => entry.expiresAt <= now).map(entry => entry.key));
    valid.forEach(entry => {
      if (retainedBytes + Number(entry.size || 0) > BROWSER_CACHE.maxBytes) remove.add(entry.key);
      else retainedBytes += Number(entry.size || 0);
    });
    if (!remove.size) return;
    await cacheTransaction('readwrite', store => remove.forEach(key => store.delete(key))).catch(() => {});
    remove.forEach(key => state.browserCacheMemory.delete(key));
  }

  function scheduleBrowserCacheCleanup() {
    if (state.browserCacheCleanupScheduled) return;
    state.browserCacheCleanupScheduled = true;
    const run = () => {
      state.browserCacheCleanupScheduled = false;
      void cleanupBrowserCache();
    };
    if ('requestIdleCallback' in window) requestIdleCallback(run, {timeout:4000});
    else setTimeout(run, 1200);
  }

  function hidePageLoader() {
    clearTimeout(window.__autentikoStartupTimer);
    const loader = $('#page-loader');
    if (loader) loader.classList.add('hidden');
  }

  function gas(name, ...args) {
    return new Promise((resolve, reject) => {
      let settled = false;
      const finish = callback => value => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        callback(value);
      };
      const timeoutMs = API_TIMEOUTS[name] || 60000;
      const timer = setTimeout(() => finish(reject)(new Error(
        name === 'apiPublicBootstrap' || name === 'apiBootstrap'
          ? 'O servidor demorou para responder. Atualize a página e tente novamente.'
          : 'A operação demorou mais que o esperado. Tente novamente.'
      )), timeoutMs);
      try {
        const runner = google.script.run
          .withSuccessHandler(finish(resolve))
          .withFailureHandler(error => finish(reject)(new Error(error?.message || String(error))));
        runner[name].apply(runner, args);
      } catch (error) { finish(reject)(error); }
    });
  }

  async function api(name, ...args) {
    const argumentKey = args.map(arg => arg instanceof HTMLFormElement
      ? `FORM:${arg.dataset.apiKey || arg.id || 'upload'}`
      : JSON.stringify(arg)).join('|');
    const originalKey = `${name}|${argumentKey}`;
    if (apiInFlight.has(originalKey)) return apiInFlight.get(originalKey);
    if (args.at(-1) === state.context) {
      args[args.length - 1] = {
        ...state.context,
        requestId: requestId(),
        expectedVersion: state.currentProcess?.process?.version || 0
      };
    }
    const operation = (async () => {
      const response = await gas(name, ...args);
      if (!response?.ok) {
        const error = new Error(response?.message || 'Não foi possível concluir a operação.');
        error.code = response?.code;
        if (['AUTH_REQUIRED','SESSION_EXPIRED','USER_INACTIVE'].includes(error.code)) endSession(false);
        throw error;
      }
      return response.data;
    })();
    apiInFlight.set(originalKey, operation);
    try {
      return await operation;
    } finally {
      if (apiInFlight.get(originalKey) === operation) apiInFlight.delete(originalKey);
    }
  }

  function setBusy(button, busy, label = 'Aguarde...') {
    if (!button) return;
    if (busy) {
      button.dataset.original = button.textContent;
      button.textContent = label;
      button.disabled = true;
    } else {
      button.textContent = button.dataset.original || button.textContent;
      button.disabled = false;
    }
  }

  function startCooldown(button, seconds = 45) {
    if (!button) return;
    const original = button.dataset.original || button.textContent;
    let remaining = seconds;
    button.disabled = true;
    button.textContent = `Reenviar em ${remaining}s`;
    const timer = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(timer);
        button.disabled = false;
        button.textContent = original;
        return;
      }
      button.textContent = `Reenviar em ${remaining}s`;
    }, 1000);
  }

  function resetForm(selector) {
    const form = $(selector);
    if (!(form instanceof HTMLFormElement)) {
      toast('A tela carregada está desatualizada. Atualize a página com Ctrl+F5.', 'error');
      return null;
    }
    form.reset();
    return form;
  }

  function shortProcessDraftOwner() {
    return String(state.bootstrap?.user?.id || 'anonymous');
  }

  function shortProcessDraftPointerKey() {
    return `autentiko_process_draft_active:${shortProcessDraftOwner()}`;
  }

  function shortProcessDraftKey(type, processId = state.processEditId) {
    const scope = state.processFormMode === 'edit' && processId ? `edit:${processId}` : 'create';
    return `autentiko_process_draft:${shortProcessDraftOwner()}:${scope}:${String(type || '')}`;
  }

  function updateShortProcessDraftStatus(message = '', saved = false) {
    const status = $('#process-draft-status');
    if (!status) return;
    status.textContent = message;
    status.classList.toggle('hidden', !message);
    status.classList.toggle('saved', saved);
  }

  function readShortProcessDraft(type = '', processId = state.processEditId) {
    try {
      const editing = state.processFormMode === 'edit' && Boolean(processId);
      const selectedType = type || (editing ? state.currentProcess?.process?.type : sessionStorage.getItem(shortProcessDraftPointerKey())) || '';
      if (!selectedType) return null;
      const key = shortProcessDraftKey(selectedType, processId);
      const draft = JSON.parse(sessionStorage.getItem(key) || 'null');
      if (!draft || draft.owner !== shortProcessDraftOwner() || String(draft.processId || '') !== String(editing ? processId : '') || Date.now() - Number(draft.savedAt || 0) > SHORT_PROCESS_DRAFT_TTL_MS) {
        sessionStorage.removeItem(key);
        if (!editing && !type) sessionStorage.removeItem(shortProcessDraftPointerKey());
        return null;
      }
      return draft;
    } catch (ignoreDraftRead) { return null; }
  }

  function saveShortProcessDraft() {
    const type = $('#new-process-type')?.value || '';
    if (!type || activeModalId() !== 'process-modal') return null;
    const draft = {
      owner: shortProcessDraftOwner(),
      type,
      processId: state.processFormMode === 'edit' ? state.processEditId : '',
      expectedVersion: state.processFormMode === 'edit' ? state.processEditExpectedVersion : 0,
      data: formObject($('#dynamic-process-form')),
      incomeAccepted: Boolean($('#income-acceptance-check')?.checked),
      savedAt: Date.now()
    };
    try {
      sessionStorage.setItem(shortProcessDraftKey(type, draft.processId), JSON.stringify(draft));
      if (state.processFormMode !== 'edit') sessionStorage.setItem(shortProcessDraftPointerKey(), type);
      state.processDraftDirty = true;
      updateShortProcessDraftStatus(`Rascunho temporário salvo às ${new Date(draft.savedAt).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}. Válido por 10 minutos nesta aba.`, true);
      return draft;
    } catch (ignoreDraftWrite) {
      updateShortProcessDraftStatus('O navegador bloqueou a memória temporária. Mantenha esta janela aberta até salvar.', false);
      return null;
    }
  }

  function scheduleShortProcessDraftSave() {
    if (activeModalId() !== 'process-modal') return;
    state.processDraftDirty = true;
    updateShortProcessDraftStatus('Alterações ainda não enviadas — salvando rascunho temporário...', false);
    clearTimeout(state.processDraftTimer);
    state.processDraftTimer = setTimeout(saveShortProcessDraft, 300);
  }

  function clearShortProcessDraft(type = '', processId = state.processEditId) {
    const editing = state.processFormMode === 'edit' && Boolean(processId);
    const selectedType = type || $('#new-process-type')?.value || (editing ? state.currentProcess?.process?.type : sessionStorage.getItem(shortProcessDraftPointerKey())) || '';
    try {
      if (selectedType) sessionStorage.removeItem(shortProcessDraftKey(selectedType, processId));
      if (!editing) sessionStorage.removeItem(shortProcessDraftPointerKey());
    } catch (ignoreDraftClear) {}
    clearTimeout(state.processDraftTimer);
    state.processDraftTimer = 0;
    state.processDraftDirty = false;
    updateShortProcessDraftStatus('', false);
  }

  function discardCreateProcessDrafts() {
    const prefix = `autentiko_process_draft:${shortProcessDraftOwner()}:create:`;
    try {
      for (let index = sessionStorage.length - 1; index >= 0; index -= 1) {
        const key = sessionStorage.key(index);
        if (key && key.startsWith(prefix)) sessionStorage.removeItem(key);
      }
      sessionStorage.removeItem(shortProcessDraftPointerKey());
    } catch (ignoreDraftDiscard) {}
  }

  function cancelProcessForm() {
    const editing = state.processFormMode === 'edit' && Boolean(state.processEditId);
    const hasDraft = state.processDraftDirty || Boolean(readShortProcessDraft($('#new-process-type')?.value || '', state.processEditId));
    if (hasDraft && !confirm('Cancelar e descartar definitivamente os dados ainda não enviados? Esta ação não poderá ser desfeita.')) return false;
    const processId = state.processEditId;
    const type = $('#new-process-type')?.value || state.currentProcess?.process?.type || '';
    clearTimeout(state.processDraftTimer);
    state.processDraftTimer = 0;
    if (editing) clearShortProcessDraft(type, processId);
    else {
      discardCreateProcessDrafts();
      state.processDraftDirty = false;
      updateShortProcessDraftStatus('', false);
    }
    clearTimeout(state.databaseLookupTimer);
    clearTimeout(state.propertyLookupTimer);
    state.databaseLookupNonce += 1;
    state.databaseMatch = null;
    state.processFormMode = 'create';
    state.processEditId = '';
    state.processEditExpectedVersion = 0;
    if ($('#new-process-type')) $('#new-process-type').disabled = false;
    if (editing && state.currentProcess) {
      openModal('detail-modal');
      return true;
    }
    closeModal(true);
    return true;
  }

  let toastTimer;
  function toast(message, type = '') {
    const el = $('#toast');
    el.textContent = message;
    el.className = `toast ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 4800);
  }

  function authMessage(message, success = false) {
    const el = $('#auth-message');
    el.textContent = message || '';
    el.className = `form-message${success ? ' success' : ''}`;
  }

  function requestLocation() {
    if (!navigator.geolocation || !navigator.permissions?.query) return;
    navigator.permissions.query({name:'geolocation'}).then(permission => {
      if (permission.state !== 'granted') return;
      navigator.geolocation.getCurrentPosition(position => {
        state.context.location = {
          latitude: Number(position.coords.latitude.toFixed(6)),
          longitude: Number(position.coords.longitude.toFixed(6)),
          accuracyMeters: Math.round(position.coords.accuracy),
          capturedAt: new Date().toISOString()
        };
      }, () => {}, {enableHighAccuracy:false, timeout:7000, maximumAge:300000});
    }).catch(() => {});
  }

  function requestAuditIp() {
    const endpoint = ['https:', '', 'api64.ipify.org', '?format=json'].join('/');
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 2500);
    fetch(endpoint, {signal:controller.signal, cache:'no-store', credentials:'omit'})
      .then(response => response.ok ? response.json() : null)
      .then(data => {
        if (data?.ip && String(data.ip).length <= 64) state.context.ipPublico = String(data.ip);
      })
      .catch(() => {})
      .finally(() => clearTimeout(timer));
  }

  async function init() {
    try {
      void initializeBrowserCache();
      wireEvents();
      requestLocation();
      requestAuditIp();
      if (state.token) {
        try { await loadApp(); }
        catch (error) { endSession(false); showPublic(); }
      } else {
        showPublic();
        hidePageLoader();
        try {
          state.public = await api('apiPublicBootstrap');
          applyPublicConfig(state.public.config || {});
        } catch (error) {
          authMessage(error?.message || 'Não foi possível consultar a configuração pública. Você ainda pode tentar entrar.');
        }
      }
    } catch (error) {
      showPublic();
      authMessage(error?.message || 'Não foi possível iniciar o sistema. Atualize a página e tente novamente.');
    } finally { hidePageLoader(); }
  }

  function applyPublicConfig(config) {
    $('#public-title').textContent = config.NOME_SISTEMA || 'AUTENTIKO OK NUVEM';
    $('#public-subtitle').textContent = config.SUBTITULO || 'Sistema de gestão administrativa de processos internos.';
    document.documentElement.style.setProperty('--primary', config.COR_PRIMARIA || '#155eef');
  }

  function showPublic() {
    $('#app-shell').classList.add('hidden');
    $('#public-shell').classList.remove('hidden');
  }

  async function loadApp() {
    state.bootstrap = await api('apiBootstrap', state.token);
    configureBrowserCacheForUser(state.bootstrap.user);
    $('#public-shell').classList.add('hidden');
    $('#app-shell').classList.remove('hidden');
    const user = state.bootstrap.user;
    $('#user-name').textContent = user.name;
    $('#user-role').textContent = roleText(user.role);
    $('#user-avatar').textContent = (user.name || 'A').charAt(0).toUpperCase();
    $('#company-name').textContent = state.bootstrap.config.EMPRESA_NOME || 'PALMER IMÓVEIS';
    $('#maintenance-badge').classList.toggle('hidden', !state.bootstrap.config.MODO_MANUTENCAO);
    const admin = ['USUARIO_GERIR','FORMULARIO_GERIR','CONFIGURACAO_GERIR'].some(hasPermission);
    $('#admin-nav').classList.toggle('hidden', !admin);
    const databaseAccess = hasPermission('BASE_CLIENTES_VER') || hasPermission('BASE_IMOVEIS_VER');
    $('#database-nav').classList.toggle('hidden', !databaseAccess);
    fillGlobalSelects();
    await loadProcesses('dashboard');
    const warmPdf = () => { void loadPdfJs().catch(() => {}); };
    if ('requestIdleCallback' in window) requestIdleCallback(warmPdf, {timeout:5000});
    else setTimeout(warmPdf, 1800);
    if (user.mustChangePassword) openPasswordModal(true);
  }

  function saveSession(session) {
    state.token = session.token;
    localStorage.setItem('autentiko_token', state.token);
  }

  function endSession(showMessage = true) {
    void clearCurrentUserBrowserCache();
    clearCustomerLookupCache();
    state.token = '';
    state.bootstrap = null;
    state.admin = null;
    state.forcePasswordChange = false;
    localStorage.removeItem('autentiko_token');
    showPublic();
    if (showMessage) authMessage('Sessão encerrada.', true);
  }

    const form = resetForm('#customer-record-form');

    const address = item.address || {};

      id:item.id, expectedVersion:item.version, personType:item.personType, document:item.document, name:item.name,
      tradeName:item.tradeName, rgIe:item.rgIe, issuer:item.issuer, birthOpening:item.birthOpening,
      nationality:item.nationality, legalRepresentative:item.legalRepresentative, maritalStatus:item.maritalStatus,
      propertyRegime:item.propertyRegime, profession:item.profession, income:item.income ? formatBRL(item.income) : '',
      incomeOrigin:item.incomeOrigin, employer:item.employer, job:item.job, email:item.email, phone:item.phone,
      messagePhone:item.messagePhone, messageContactName:item.messageContactName, zip:address.zip, street:address.street,
      number:address.number, district:address.district, complement:address.complement, city:address.city, state:address.state
    };
    Object.entries(values).forEach(([name, value]) => { const control = formControl(form, name); if (control) control.value = value ?? ''; });

    const conflictArea = $('#customer-record-conflicts');

    conflictArea.innerHTML = conflicts.length ? `<h3>Divergências preservadas para conferência</h3><p>Nenhuma informação foi descartada ou escolhida silenciosamente. Compare a origem antes de corrigir o cadastro.</p><div class="master-conflict-list">${conflicts.map(conflict=>`<article class="master-conflict-item"><strong>${esc(statusText(conflict.field))}</strong><small>Atual: ${esc(String(conflict.currentValue||'—').slice(0,500))}</small><small>Informação recebida: ${esc(String(conflict.proposedValue||'—').slice(0,500))}</small><small>${esc(conflict.source||'Processo')} · ${esc(conflict.processId||'sem processo')} · ${esc(dateText(conflict.createdAt))}</small></article>`).join('')}</div>` : '';

    $('#view-title').textContent = ({dashboard:'Painel administrativo',processes:'Processos',database:'Data Base — Carta de Clientes',contracts:'Contratos',admin:'Administração'}[view]);
    if (view === 'processes') loadProcesses('processes');
    if (view === 'database') loadDatabase();
    if (view === 'contracts') loadContracts();
    if (view === 'admin') loadAdmin();
  }

  function openModal(id) {
    const selected = $('#' + id);
    if (!selected) {
      toast('Não foi possível abrir esta janela. Atualize a página com Ctrl+F5.', 'error');
      return false;
    }
    $('#modal-backdrop').classList.remove('hidden');
    $('#modal-backdrop').setAttribute('aria-hidden','false');
    $$('.modal').forEach(modal => modal.classList.toggle('hidden', modal.id !== id));
    document.body.style.overflow = 'hidden';
    return true;
  }

  function activeModalId() {
    return $$('.modal').find(modal => !modal.classList.contains('hidden'))?.id || '';
  }

  function revokeObjectUrl(url) {
    if (url) try { URL.revokeObjectURL(url); } catch (ignore) {}
  }

  function clearPendingDocumentFiles() {
    state.pendingDocumentFiles.forEach(items => (Array.isArray(items) ? items : [items]).forEach(item => revokeObjectUrl(item?.url)));
    state.pendingDocumentFiles.clear();
  }

  function clearVisualObjectUrls() {
    state.visualLoadToken += 1;
    if (state.visualObserver) {
      try { state.visualObserver.disconnect(); } catch (ignore) {}
      state.visualObserver = null;
    }
    state.visualThumbnailQueue.length = 0;
    state.visualThumbnailQueued.clear();
    // Uma chamada antiga pode continuar aguardando a rede, mas não deve manter
    // a nova galeria bloqueada como se todos os workers ainda estivessem ocupados.
    state.visualThumbnailWorkers = 0;
    state.visualObjectUrls.forEach(url => revokeObjectUrl(url));
    state.visualObjectUrls.clear();
  }

  function resetPreviewState() {
    state.previewLoadToken += 1;
    if (state.pdfRenderTask) {
      try { state.pdfRenderTask.cancel(); } catch (ignore) {}
      state.pdfRenderTask = null;
    }
    if (state.pdfDocument) {
      try { void state.pdfDocument.destroy(); } catch (ignore) {}
      state.pdfDocument = null;
    }
    if (state.previewObjectUrlOwned) revokeObjectUrl(state.previewObjectUrl);
    state.previewObjectUrl = '';
    state.previewObjectUrlOwned = false;
    state.previewFallbackIsImage = false;
    state.previewDocumentId = '';
    state.pdfPage = 1;
    state.pdfScale = 1.15;
    state.previewRotation = 0;
    const rotationLabel = $('#preview-rotation-label');
    if (rotationLabel) rotationLabel.textContent = '0°';
    $('#pdf-preview-controls')?.classList.add('hidden');
    $('#preview-modal')?.classList.remove('expanded');
    const toggle = $('[data-toggle-preview]');
    if (toggle) toggle.textContent = 'Ampliar';
    $('#preview-open-tab-btn')?.classList.add('hidden');
  }

  function closeModal(force = false) {
    const currentModal = activeModalId();
    const passwordModalOpen = !$('#password-modal')?.classList.contains('hidden');
    if (state.forcePasswordChange && passwordModalOpen && !force) {
      toast('Troque a senha temporária para continuar.', 'error');
      return false;
    }
    if (!force && currentModal === 'database-match-modal') {
      closeDatabaseMatch();
      return true;
    }
    if (!force && currentModal === 'process-modal' && state.processDraftDirty) {
      saveShortProcessDraft();
      if (!confirm('Existem dados ainda não enviados. O rascunho ficará disponível nesta aba por 10 minutos. Deseja fechar a ficha?')) return false;
    }
    if (!force && currentModal === 'process-modal' && state.processFormMode === 'edit' && state.currentProcess) {
      state.processFormMode = 'create';
      state.processEditId = '';
      state.processEditExpectedVersion = 0;
      state.processDraftDirty = false;
      $('#new-process-type').disabled = false;
      openModal('detail-modal');
      return true;
    }
    if (!force && state.currentProcess && ['workflow-modal','participant-modal','proposal-modal','proposal-accept-modal'].includes(currentModal)) {
      openModal('detail-modal');
      return true;
    }
    resetPreviewState();
    clearPendingDocumentFiles();
    clearVisualObjectUrls();
    state.previewReturnModal = '';
    state.previewReturnFocus = null;
    $('#modal-backdrop').classList.add('hidden');
    $('#modal-backdrop').setAttribute('aria-hidden','true');
    $$('.modal').forEach(modal => modal.classList.add('hidden'));
    document.body.style.overflow = '';
    return true;
  }

  async function openNewProcess() {
    state.processFormMode = 'create';
    state.processEditId = '';
    state.processEditExpectedVersion = 0;
    $('#new-process-type').disabled = false;
    $('#process-modal-eyebrow').textContent = 'NOVO PROCESSO';
    $('#process-modal-title').textContent = 'Criar processo';
    $('#process-submit-btn').textContent = 'Próxima etapa: documentos →';
    if (!resetForm('#process-form')) return;
    $('#dynamic-process-form').innerHTML = '<div class="empty-state">Selecione o tipo de processo para carregar o formulário.</div>';
    $('#income-acceptance-panel').classList.add('hidden');
    $('#income-acceptance-check').checked = false;
    openModal('process-modal');
    const draft = readShortProcessDraft();
    if (draft) {
      $('#new-process-type').value = draft.type;
      await loadDynamicForm(draft.type, draft.data || {});
      $('#income-acceptance-check').checked = Boolean(draft.incomeAccepted);
      state.processDraftDirty = true;
      updateShortProcessDraftStatus(`Rascunho recuperado, salvo às ${new Date(draft.savedAt).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}.`, true);
      updateIncomeAffordability();
    } else {
      state.processDraftDirty = false;
      updateShortProcessDraftStatus('', false);
    }
  }

  async function openEditProcess() {
    if (!state.currentProcess?.process?.id || !state.currentProcess?.capabilities?.edit) {
      return toast('Você não possui permissão para editar esta ficha.', 'error');
    }
    if (!state.processLoadedTabs.has('registration')) await ensureProcessTab('registration');
    const detail = state.currentProcess;
    const form = resetForm('#process-form');
    if (!form) return;
    state.processFormMode = 'edit';
    state.processEditId = detail.process.id;
    state.processEditExpectedVersion = Number(detail.process.version || detail.processTabVersion || 0);
    $('#process-modal-eyebrow').textContent = `EDIÇÃO CONTROLADA · ${detail.process.protocol}`;
    $('#process-modal-title').textContent = 'Editar ficha cadastral';
    $('#process-submit-btn').textContent = 'Salvar alterações';
    $('#new-process-type').value = detail.process.type;
    $('#new-process-type').disabled = true;
    openModal('process-modal');
    const draft = readShortProcessDraft(detail.process.type, detail.process.id);
    await loadDynamicForm(detail.process.type, draft?.data || detail.data || {});
    $('#income-acceptance-check').checked = Boolean(draft?.incomeAccepted || String((draft?.data || detail.data || {}).aceite_renda_insuficiente || '').toUpperCase() === 'SIM');
    state.processDraftDirty = Boolean(draft);
    updateShortProcessDraftStatus(draft
      ? `Rascunho de edição recuperado, salvo às ${new Date(draft.savedAt).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}.`
      : 'A ficha original permanece preservada até a confirmação desta edição.', Boolean(draft));
    updateIncomeAffordability();
  }

  async function loadDynamicForm(type, values = {}) {
    const target = $('#dynamic-process-form');
    if (!type) {
      target.innerHTML = '<div class="empty-state">Selecione o tipo de processo para carregar o formulário.</div>';
      return;
    }
    try {
      if (!state.bootstrap.formSchemas[type]) {
        const cached = readProcessSessionEntry('form-schema', String(type));
        if (cached?.fields) state.bootstrap.formSchemas[type] = cached.fields;
      }
      if (!state.bootstrap.formSchemas[type]) {
        target.innerHTML = '<div class="empty-state">Carregando formulário...</div>';
        if (!state.formSchemaFetches.has(type)) {
          state.formSchemaFetches.set(type, api('apiObterFormularioProcesso', state.token, type)
            .finally(() => state.formSchemaFetches.delete(type)));
        }
        const result = await state.formSchemaFetches.get(type);
        state.bootstrap.formSchemas[type] = result.fields || [];
        writeProcessSessionEntry('form-schema', String(type), {
          fields:state.bootstrap.formSchemas[type],
          expiresAt:Date.now() + BROWSER_CACHE.formSchemaTtlMs
        });
      }
      renderDynamicForm(type, values);
    } catch (error) {
      target.innerHTML = `<div class="empty-state">${esc(error.message)}</div>`;
      toast(error.message, 'error');
    }
  }

  function renderDynamicForm(type, values = {}) {
    const fields = state.bootstrap.formSchemas[type] || [];
    const groups = fields.reduce((map, field) => {
      const key = semanticSectionForField(field);
      (map[key] ||= []).push(field);
      return map;
    }, {});
    const blueprint = formSectionBlueprint(type);
    $('#dynamic-process-form').innerHTML = blueprint.filter(section => groups[section.key]?.length).map(section => {
      const sectionFields = groups[section.key].sort((a,b) => Number(a.order || 0) - Number(b.order || 0));
      return `<section class="form-section semantic-form-section section-${esc(section.key)}">
        <header><span class="form-section-icon">${esc(section.icon)}</span><div><p>${esc(section.party)}</p><h3>${esc(section.title)}</h3><small>${esc(section.description)}</small></div></header>
        <div class="field-grid">${sectionFields.map(field => renderField(field, values[field.name])).join('')}</div>
      </section>`;
    }).join('');
    $$('[data-mask]', $('#dynamic-process-form')).forEach(input => {
      if (input.dataset.mask === 'currency' && input.value) input.value = formatBRL(parseCurrencyText(input.value));
      if (input.dataset.mask === 'cpf') validateCpfField(input);
    });
    updateConditionalFields();
    updateIncomeAffordability();
  }

  function formSectionBlueprint(type) {
    const rental = ['ALUGUEL_ANUAL','ALUGUEL_SEMESTRAL','ALUGUEL_TRIMESTRAL','ALUGUEL_MENSAL','ALUGUEL_TEMPORADA'].includes(type);
    const client = rental ? 'Cliente ou locatário' : String(type || '').startsWith('COMPRA_') ? 'Cliente ou comprador' : 'Cliente';
    return [
      {key:'process_control', icon:'01', party:'Processo', title:'Controle do cadastro', description:'Responsabilidade e identificação interna.'},
      {key:'client_personal', icon:'1A', party:`1. ${client}`, title:'Dados pessoais', description:'Identificação civil e documentos pessoais.'},
      {key:'client_contact', icon:'1B', party:`1. ${client}`, title:'Dados de contato', description:'Telefones e e-mail para comunicação.'},
      {key:'client_address', icon:'1C', party:`1. ${client}`, title:'Dados de endereço', description:'Residência atual do cliente.'},
      {key:'client_income', icon:'1D', party:`1. ${client}`, title:'Renda e emprego', description:'Renda mensal, origem e vínculo profissional.'},
      {key:'owner_personal', icon:'2A', party:'2. Proprietário ou vendedor', title:'Dados pessoais', description:'Identificação civil do titular do imóvel.'},
      {key:'owner_contact', icon:'2B', party:'2. Proprietário ou vendedor', title:'Dados de contato', description:'Telefones e e-mail do proprietário.'},
      {key:'owner_address', icon:'2C', party:'2. Proprietário ou vendedor', title:'Dados de endereço', description:'Endereço residencial do proprietário.'},
      {key:'owner_property', icon:'2D', party:'2. Proprietário ou vendedor', title:'Dados do imóvel', description:'Imóvel, negociação, valores e regularidade.'},
      {key:'process_other', icon:'03', party:'Processo', title:'Informações complementares', description:'Financiamento, negociação e observações.'}
    ];
  }

  function semanticSectionForField(field) {
    const name = String(field?.name || '').toLowerCase();
    if (name === 'responsavel_processo') return 'process_control';
    if (name.startsWith('cliente_')) {
      if (/(contato|telefone|email)/.test(name)) return 'client_contact';
      if (/(rua|numero|bairro|complemento|cidade|cep|endereco)/.test(name)) return 'client_address';
      if (/(renda|profissao|empresa|cargo|funcao|emprego|trabalho|atividade)/.test(name)) return 'client_income';
      return 'client_personal';
    }
    if (name.startsWith('titular_') || name.startsWith('proprietario_') || name.startsWith('vendedor_')) {
      if (/(contato|telefone|email)/.test(name)) return 'owner_contact';
      if (/(rua|numero|bairro|complemento|cidade|cep|endereco)/.test(name)) return 'owner_address';
      return 'owner_personal';
    }
    if (/^(imovel_|tipo_imovel|tem_|iptu_|matricula_|registro_|unidade_consumidora|conta_contrato|valor_aluguel)/.test(name)) return 'owner_property';
    return 'process_other';
  }

  function renderField(field, value = '') {
    const wide = ['textarea'].includes(field.input) ? 'full' : '';
    const required = field.required ? 'required' : '';
    const marker = field.required ? ' *' : '';
    const condition = field.condition ? `data-condition='${esc(JSON.stringify(field.condition))}'` : '';
    let control;
    if (field.input === 'textarea') control = `<textarea name="${esc(field.name)}" maxlength="5000" ${required}>${esc(value)}</textarea>`;
    else if (field.input === 'select') control = `<select name="${esc(field.name)}" ${required}><option value="">Selecione...</option>${(field.options || []).map(option => `<option value="${esc(option)}" ${String(option)===String(value)?'selected':''}>${esc(option)}</option>`).join('')}</select>`;
    else {
      const type = ({date:'date',email:'email',number:'number'}[field.input] || 'text');
      const inputMode = ['currency','cpf','cep','tel'].includes(field.input) ? 'inputmode="numeric"' : '';
      const mask = ['cpf','cep','tel','currency'].includes(field.input) ? `data-mask="${field.input}"` : '';
      const validity = field.input === 'cpf'
        ? `<span class="field-validation-light" aria-hidden="true"></span>`
        : '';
      control = `<span class="${field.input === 'cpf' ? 'validated-control' : 'plain-control'}"><input name="${esc(field.name)}" type="${type}" value="${esc(value)}" maxlength="500" ${inputMode} ${mask} ${required}>${validity}</span>${field.input === 'cpf' ? '<small class="field-validation-message">Digite um CPF válido para prosseguir.</small>' : ''}`;
    }
    return `<label class="${wide} field-label field-${esc(field.input)}" ${condition}>${esc(field.label)}${marker}${control}</label>`;
  }

  function updateConditionalFields() {
    $$('[data-condition]', $('#dynamic-process-form')).forEach(label => {
      let condition;
      try { condition = JSON.parse(label.dataset.condition); } catch { return; }
      const source = $(`[name="${CSS.escape(condition.field)}"]`, $('#dynamic-process-form'));
      const visible = !source || source.value === String(condition.equals ?? '');
      label.classList.toggle('hidden', !visible);
      const input = $('input,select,textarea', label);
      if (input) input.disabled = !visible;
    });
  }

  function formObject(form) {
    const out = {};
    if (form instanceof HTMLFormElement) {
      new FormData(form).forEach((value, key) => { out[key] = value; });
    } else {
      $$('[name]:not(:disabled)', form).forEach(field => {
        if ((field.type === 'checkbox' || field.type === 'radio') && !field.checked) return;
        out[field.name] = field.value;
      });
    }
    return out;
  }

  function maskValue(input) {
    const digits = input.value.replace(/\D/g,'');
    if (input.dataset.mask === 'cpf') input.value = digits.slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
    if (input.dataset.mask === 'cep') input.value = digits.slice(0,8).replace(/(\d{5})(\d)/,'$1-$2');
    if (input.dataset.mask === 'tel') {
      const phone = digits.slice(0,11);
      input.value = phone.length <= 10
        ? phone.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{4})(\d{1,4})$/,'$1-$2')
        : phone.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d{1,4})$/,'$1-$2');
    }
    if (input.dataset.mask === 'currency') {
      const cents = Number(digits || 0) / 100;
      input.value = digits ? formatBRL(cents) : '';
    }
    if (input.dataset.mask === 'cpf') validateCpfField(input);
    if (input.dataset.mask === 'currency') updateIncomeAffordability();
  }

  function cpfIsValid(value) {
    const cpf = String(value || '').replace(/\D/g,'');
    if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
    const digit = length => {
      let sum = 0;
      for (let index = 0; index < length; index += 1) sum += Number(cpf[index]) * (length + 1 - index);
      const result = (sum * 10) % 11;
      return result === 10 ? 0 : result;
    };
    return digit(9) === Number(cpf[9]) && digit(10) === Number(cpf[10]);
  }

  function cnpjIsValid(value) {
    const cnpj=String(value||'').replace(/\D/g,'');
    if(cnpj.length!==14||/^(\d)\1{13}$/.test(cnpj))return false;
    const calculate=(base,weights)=>{
      const sum=weights.reduce((total,weight,index)=>total+Number(base[index])*weight,0);
      const remainder=sum%11;return remainder<2?0:11-remainder;
    };
    const first=calculate(cnpj.slice(0,12),[5,4,3,2,9,8,7,6,5,4,3,2]);
    const second=calculate(cnpj.slice(0,12)+first,[6,5,4,3,2,9,8,7,6,5,4,3,2]);
    return first===Number(cnpj[12])&&second===Number(cnpj[13]);
  }

  function maskParticipantDocument(input) {
    const form=input.closest('#participant-form');
    const type=formControl(form,'personType')?.value||'PF';
    const digits=input.value.replace(/\D/g,'');
    if(type==='PJ'){
      input.value=digits.slice(0,14).replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2');
      input.setCustomValidity(digits.length&& !cnpjIsValid(digits)?'CNPJ inválido.':'');
    }else{
      input.value=digits.slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
      input.setCustomValidity(digits.length&& !cpfIsValid(digits)?'CPF inválido.':'');
    }
  }

  function maskMasterDocument(input) {
    const form=input.closest('#customer-record-form');
    const type=formControl(form,'personType')?.value||'PF';
    const digits=input.value.replace(/\D/g,'');
    input.value=type==='PJ'
      ? digits.slice(0,14).replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2')
      : digits.slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
    input.setCustomValidity(type==='PJ'?(digits.length&&!cnpjIsValid(digits)?'CNPJ inválido.':''):(digits.length&&!cpfIsValid(digits)?'CPF inválido.':''));
  }

  function customerLookupStorageKey(digits) {
    return `autentiko_customer_lookup:${state.browserCacheNamespace}:${digits}`;
  }

  function clearCustomerLookupCache(digits = '') {
    const canonical = String(digits || '').replace(/\D/g, '');
    if (canonical) {
      state.databaseLookupCache.delete(canonical);
      try { sessionStorage.removeItem(customerLookupStorageKey(canonical)); } catch (ignoreLookupStorage) {}
      return;
    }
    state.databaseLookupCache.clear();
    state.databaseLookupPending.clear();
    try {
      const prefix = `autentiko_customer_lookup:${state.browserCacheNamespace}:`;
      for (let index = sessionStorage.length - 1; index >= 0; index -= 1) {
        const key = sessionStorage.key(index);
        if (key && key.startsWith(prefix)) sessionStorage.removeItem(key);
      }
    } catch (ignoreLookupStorage) {}
  }

  function readCustomerLookupCache(digits) {
    const canonical = String(digits || '').replace(/\D/g, '');
    const memory = state.databaseLookupCache.get(canonical);
    if (memory && memory.expiresAt > Date.now()) return memory.result;
    if (memory) state.databaseLookupCache.delete(canonical);
    try {
      const stored = JSON.parse(sessionStorage.getItem(customerLookupStorageKey(canonical)) || 'null');
      if (!stored || stored.owner !== state.browserCacheNamespace || stored.expiresAt <= Date.now()) {
        sessionStorage.removeItem(customerLookupStorageKey(canonical));
        return null;
      }
      state.databaseLookupCache.set(canonical, stored);
      return stored.result;
    } catch (ignoreLookupStorage) { return null; }
  }

  function writeCustomerLookupCache(digits, result) {
    const canonical = String(digits || '').replace(/\D/g, '');
    if (!canonical || !result) return result;
    const ttl = result.found ? CUSTOMER_LOOKUP_TTL_MS : CUSTOMER_LOOKUP_MISS_TTL_MS;
    const entry = {owner:state.browserCacheNamespace, result, expiresAt:Date.now() + ttl};
    state.databaseLookupCache.set(canonical, entry);
    try { sessionStorage.setItem(customerLookupStorageKey(canonical), JSON.stringify(entry)); }
    catch (ignoreLookupStorage) {}
    return result;
  }

  function lookupCustomerByDocument(digits) {
    const canonical = String(digits || '').replace(/\D/g, '');
    const cached = readCustomerLookupCache(canonical);
    if (cached) return Promise.resolve({...cached, cacheHit:true});
    if (state.databaseLookupPending.has(canonical)) return state.databaseLookupPending.get(canonical);
    const pending = api('apiBuscarCadastroPorDocumento', state.token, canonical, state.context)
      .then(result => writeCustomerLookupCache(canonical, result))
      .finally(() => state.databaseLookupPending.delete(canonical));
    state.databaseLookupPending.set(canonical, pending);
    return pending;
  }

  function scheduleParticipantDatabaseLookup(input) {
    const form=input?.closest('#participant-form');
    if(!form)return;
    const type=formControl(form,'personType')?.value||'PF';
    const digits=input.value.replace(/\D/g,'');
    const valid=type==='PJ'?cnpjIsValid(digits):cpfIsValid(digits);
    if(!valid){input.dataset.databaseChecked='';return;}
    if(input.dataset.databaseChecked===digits)return;
    clearTimeout(state.databaseLookupTimer);
    state.databaseLookupTimer=setTimeout(async()=>{
      if(input.value.replace(/\D/g,'')!==digits||input.dataset.databaseChecked===digits)return;
      try{
        const result=await lookupCustomerByDocument(digits);
        input.dataset.databaseChecked=digits;
        if(!result.found||activeModalId()!=='participant-modal')return;
        if(!confirm(`Encontramos ${result.item.name} na Carta de Clientes. Deseja preencher os campos vazios deste participante?`))return;
        const item=result.item,address=item.address||{};
        const values={personType:item.personType,document:item.document,name:item.name,tradeName:item.tradeName,rgIe:item.rgIe,
          birthOpening:item.birthOpening,legalRepresentative:item.legalRepresentative,nationality:item.nationality,
          maritalStatus:item.maritalStatus,propertyRegime:item.propertyRegime,profession:item.profession,
          income:item.income?formatBRL(item.income):'',employer:item.employer,job:item.job,email:item.email,phone:item.phone,
          zip:address.zip,street:address.street,number:address.number,district:address.district,complement:address.complement,
          city:address.city,state:address.state};
        let changed=0;
        Object.entries(values).forEach(([name,value])=>{const control=formControl(form,name);if(control&&value&&!String(control.value||'').trim()){control.value=value;if(control.dataset.mask)maskValue(control);changed+=1;}});
        maskParticipantDocument(input);
        toast(`${changed} campo(s) do participante preenchido(s). Revise antes de salvar.`,'success');
      }catch(error){input.dataset.databaseChecked='';toast(error.message,'error');}
    },60);
  }

  function validateCpfField(input) {
    if (!input) return false;
    const digits = input.value.replace(/\D/g,'');
    const valid = cpfIsValid(input.value);
    const wrapper = input.closest('.validated-control');
    wrapper?.classList.toggle('valid', valid);
    wrapper?.classList.toggle('invalid', Boolean(digits.length) && !valid);
    input.setCustomValidity(!digits.length ? '' : valid ? '' : 'CPF inválido. Confira os onze dígitos.');
    const message = input.closest('.field-label')?.querySelector('.field-validation-message');
    if (message) message.textContent = valid ? 'CPF válido.' : digits.length ? 'CPF inválido. Confira os onze dígitos.' : 'Digite um CPF válido para prosseguir.';
    return valid || (!input.required && !digits.length);
  }

  function validateAllCpfFields() {
    const fields = $$('[data-mask="cpf"]', $('#dynamic-process-form'));
    const invalid = fields.find(input => !validateCpfField(input));
    if (!invalid) return true;
    invalid.focus();
    invalid.reportValidity();
    return false;
  }

  function processPartyTargets() {
    const labels = {cliente:'Cliente / comprador / locatário', titular:'Proprietário / vendedor', proprietario:'Proprietário', vendedor:'Vendedor'};
    const found = new Map();
    $$('[name$="_cpf"]', $('#dynamic-process-form')).forEach(input => {
      const prefix = input.name.replace(/_cpf$/, '');
      found.set(prefix, labels[prefix] || input.closest('.semantic-form-section')?.querySelector('header p')?.textContent || statusText(prefix));
    });
    return Array.from(found, ([value, label]) => ({value, label}));
  }

  function scheduleCustomerDatabaseLookup(input) {
    if (!input?.matches('[data-mask="cpf"]')) return;
    const digits = input.value.replace(/\D/g, '');
    if (!cpfIsValid(digits)) {
      input.dataset.databaseChecked = '';
      clearTimeout(state.databaseLookupTimer);
      return;
    }
    if (input.dataset.databaseChecked === digits) return;
    clearTimeout(state.databaseLookupTimer);
    const nonce = ++state.databaseLookupNonce;
    const validationMessage = input.closest('.field-label')?.querySelector('.field-validation-message');
    if (validationMessage) validationMessage.textContent = 'CPF válido — consultando a Carta de Clientes...';
    state.databaseLookupTimer = setTimeout(async () => {
      if (input.value.replace(/\D/g, '') !== digits || input.dataset.databaseChecked === digits) return;
      try {
        const result = await lookupCustomerByDocument(digits);
        input.dataset.databaseChecked = digits;
        if (validationMessage) validationMessage.textContent = result.found ? 'CPF válido — cadastro localizado.' : 'CPF válido.';
        if (nonce !== state.databaseLookupNonce || !result.found || activeModalId() !== 'process-modal') return;
        const targets = processPartyTargets();
        const inferred = input.name.replace(/_cpf$/, '');
        state.databaseMatch = {item:result.item, returnModal:'process-modal', sourceInput:input, inferredTarget:inferred};
        $('#database-match-message').textContent = 'Notamos que o CPF informado possui registro em nossa base de dados. Deseja usar as informações nele contidas para preencher este processo?';
        $('#database-match-summary').innerHTML = `<strong>${esc(result.item.name || 'Cadastro localizado')}</strong><span>${esc(result.item.document || '')}</span><span>${esc((result.item.roles || []).map(statusText).join(' · ') || 'Cadastro geral')}</span>`;
        $('#database-match-target').innerHTML = targets.map(target => `<option value="${esc(target.value)}" ${target.value === inferred ? 'selected' : ''}>${esc(target.label)}</option>`).join('');
        $('#database-match-overwrite').checked = false;
        openModal('database-match-modal');
      } catch (error) {
        input.dataset.databaseChecked = '';
        if (validationMessage) validationMessage.textContent = 'CPF válido — não foi possível consultar agora.';
        if (!['INVALID_DOCUMENT','NOT_FOUND'].includes(error.code)) toast(error.message, 'error');
      }
    }, 60);
  }

  function closeDatabaseMatch() {
    const returnModal = state.databaseMatch?.returnModal || 'process-modal';
    state.databaseMatch = null;
    openModal(returnModal);
  }

  function applyDatabaseMatch() {
    const match = state.databaseMatch;
    if (!match?.item) return closeDatabaseMatch();
    const prefix = $('#database-match-target').value || match.inferredTarget;
    const overwrite = $('#database-match-overwrite').checked;
    const item = match.item;
    const address = item.address || {};
    const values = {
      nome:item.name, cpf:item.document, nascimento:item.birthOpening, documento:item.rgIe,
      orgao_expedidor:item.issuer, nacionalidade:item.nationality, estado_civil:item.maritalStatus,
      regime_bens:item.propertyRegime, profissao:item.profession, renda:item.income ? formatBRL(item.income) : '',
      renda_origem:item.incomeOrigin, empresa:item.employer, cargo:item.job, funcao:item.job,
      email:item.email, contato:item.phone, contato_recado:item.messagePhone,
      contato_recado_nome:item.messageContactName, rua:address.street, numero:address.number,
      bairro:address.district, complemento:address.complement, cidade:address.city,
      estado:address.state, cep:address.zip
    };
    let changed = 0;
    Object.entries(values).forEach(([suffix, value]) => {
      if (value == null || value === '') return;
      const control = $(`[name="${CSS.escape(`${prefix}_${suffix}`)}"]`, $('#dynamic-process-form'));
      if (!control || (!overwrite && String(control.value || '').trim())) return;
      control.value = value;
      if (control.dataset.mask) maskValue(control);
      changed += 1;
    });
    const cpfControl = $(`[name="${CSS.escape(`${prefix}_cpf`)}"]`, $('#dynamic-process-form'));
    if (cpfControl) cpfControl.dataset.databaseChecked = String(item.document || '').replace(/\D/g, '');
    updateConditionalFields();
    updateIncomeAffordability();
    scheduleShortProcessDraftSave();
    closeDatabaseMatch();
    toast(`${changed} campo(s) preenchido(s). Você pode revisar e editar qualquer informação antes de salvar.`, 'success');
  }

  function schedulePropertyDatabaseLookup(input) {
    if (!input || input.name !== 'imovel_codigo') return;
    const identifier = String(input.value || '').trim();
    if (identifier.length < 2) { input.dataset.propertyChecked = ''; return; }
    if (input.dataset.propertyChecked === identifier) return;
    clearTimeout(state.propertyLookupTimer);
    state.propertyLookupTimer = setTimeout(async () => {
      if (input.value.trim() !== identifier || input.dataset.propertyChecked === identifier) return;
      input.dataset.propertyChecked = identifier;
      try {
        const result = await api('apiBuscarImovelPorIdentificador', state.token, identifier, state.context);
        if (!result.found || activeModalId() !== 'process-modal') return;
        if (!confirm(`O imóvel ${result.item.code || result.item.registration || result.item.id} já existe na base. Deseja usar seus dados para preencher esta ficha?`)) return;
        const item = result.item;
        const address = item.addressData || {};
        const values = {imovel_codigo:item.code, imovel_matricula:item.registration, imovel_iptu:item.iptu, tipo_imovel:item.type,
          imovel_endereco:item.address, imovel_rua:address.street, imovel_numero:address.number, imovel_bairro:address.district,
          imovel_complemento:address.complement, imovel_cidade:address.city, imovel_estado:address.state, imovel_cep:address.zip};
        let changed = 0;
        Object.entries(values).forEach(([name, value]) => {
          const control = $(`[name="${CSS.escape(name)}"]`, $('#dynamic-process-form'));
          if (!control || !value || String(control.value || '').trim()) return;
          control.value = value;
          if (control.dataset.mask) maskValue(control);
          changed += 1;
        });
        scheduleShortProcessDraftSave();
        toast(`${changed} dado(s) do imóvel reutilizado(s). Todos permanecem editáveis.`, 'success');
      } catch (error) { if (error.code !== 'NOT_FOUND') toast(error.message, 'error'); }
    }, 600);
  }

  function parseCurrencyText(value) {
    if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
    let text = String(value || '').trim().replace(/[R$\s]/g,'');
    if (!text) return 0;
    if (text.includes(',')) text = text.replace(/\./g,'').replace(',','.');
    else if ((text.match(/\./g)||[]).length > 1 || /^-?\d{1,3}\.\d{3}$/.test(text)) text = text.replace(/\./g,'');
    const number = Number(text.replace(/[^0-9.\-]/g,''));
    return Number.isFinite(number) ? number : 0;
  }

  const formatBRL = value => Number(value || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});

  function incomeEvaluationFromForm() {
    const type = $('#new-process-type').value;
    const applicable = ['ALUGUEL_ANUAL','ALUGUEL_SEMESTRAL','ALUGUEL_TRIMESTRAL','ALUGUEL_MENSAL'].includes(type);
    const income = parseCurrencyText($('[name="cliente_renda"]', $('#dynamic-process-form'))?.value);
    const rent = parseCurrencyText($('[name="valor_aluguel_mensal"]', $('#dynamic-process-form'))?.value || $('[name="valor_aluguel"]', $('#dynamic-process-form'))?.value || $('[name="valor_negociado"]', $('#dynamic-process-form'))?.value);
    return {applicable, income, rent, requiredIncome:rent * 3, adequate:!applicable || (income > 0 && rent > 0 && income >= rent * 3)};
  }

  function updateIncomeAffordability() {
    const evaluation = incomeEvaluationFromForm();
    const panel = $('#income-acceptance-panel');
    const shouldShow = evaluation.applicable && evaluation.income > 0 && evaluation.rent > 0 && !evaluation.adequate;
    panel.classList.toggle('hidden', !shouldShow);
    if (!shouldShow) {
      $('#income-acceptance-check').checked = false;
      return evaluation;
    }
    $('#income-acceptance-message').textContent = `Renda informada: ${formatBRL(evaluation.income)}. Aluguel: ${formatBRL(evaluation.rent)}. Critério mínimo: ${formatBRL(evaluation.requiredIncome)}.`;
    return evaluation;
  }

  async function submitProcess(event) {
    event.preventDefault();
    const button = $('button[type=submit]', event.currentTarget);
    const type = $('#new-process-type').value;
    if (!type) return toast('Selecione o tipo de processo.', 'error');
    if (!validateAllCpfFields()) return toast('Corrija o CPF indicado em vermelho para continuar.', 'error');
    const data = formObject($('#dynamic-process-form'));
    const incomeEvaluation = updateIncomeAffordability();
    if (incomeEvaluation.applicable && !incomeEvaluation.adequate) {
      if (!$('#income-acceptance-check').checked) {
        $('#income-acceptance-panel').classList.remove('hidden');
        $('#income-acceptance-panel').scrollIntoView({behavior:'smooth', block:'center'});
        return toast('Confirme o aceite eletrônico sobre a renda antes de prosseguir.', 'error');
      }
      data.aceite_renda_insuficiente = 'SIM';
    }
    if (state.processFormMode === 'edit') {
      const processId = state.processEditId;
      const expectedVersion = state.processEditExpectedVersion;
      setBusy(button, true, 'Salvando alterações...');
      try {
        const mutationId = requestId();
        const result = await api('apiAtualizarProcesso', state.token, processId, data, {
          ...state.context,
          expectedVersion,
          requestId: mutationId
        });
        clearShortProcessDraft(type, processId);
        state.processFormMode = 'create';
        state.processEditId = '';
        state.processEditExpectedVersion = 0;
        $('#new-process-type').disabled = false;
        closeModal(true);
        toast(`Ficha atualizada com segurança para a versão ${result.version}.`, 'success');
        await Promise.all([loadProcesses('dashboard'), openProcess(processId, 'registration')]);
      } catch (error) {
        toast(error.message, 'error');
      } finally { setBusy(button, false); }
      return;
    }
    const temp = {
      id:`temp-${Date.now()}`,protocol:'SALVANDO',clientName:data.cliente_nome,typeLabel:state.bootstrap.processTypes.find(item=>item.value===type)?.label,
      status:'PENDENTE',responsible:data.responsavel_processo || state.bootstrap.user.name,updatedAt:new Date().toISOString(),clientCpf:data.cliente_cpf,propertyAddress:data.imovel_endereco
    };
    const target = $('#dashboard-processes');
    const original = state.processes.slice();
    renderProcesses(target, [temp, ...original]);
    target.firstElementChild?.classList.add('optimistic');
    setBusy(button, true, 'Salvando...');
    try {
      const result = await api('apiCriarProcesso', state.token, {type,data}, state.context);
      clearShortProcessDraft(type);
      closeModal(true);
      toast(`Processo ${result.process.protocol} criado. Agora envie os documentos.`, 'success');
      await Promise.all([
        loadProcesses('dashboard'),
        openDocumentUploadStep(result.process.id, result.process.protocol)
      ]);
    } catch (error) {
      renderProcesses(target, original);
      toast(error.message, 'error');
    } finally { setBusy(button, false); }
  }

  function normalizeProcessTab(tab) {
    const aliases = {
      details:'registration', registration:'registration',
      visual:'documents', documents:'documents',
      flow:'review', review:'review',
      audit:'audit'
    };
    return aliases[String(tab || '')] || 'registration';
  }

  function processTabCacheKey(processId, tab) {
    return `${state.browserCacheNamespace}|${String(processId)}|${normalizeProcessTab(tab)}`;
  }

  function processSessionKey(kind, identity) {
    return `autentiko:${BROWSER_CACHE.schemaVersion}:${state.browserCacheNamespace}:${kind}:${identity}`;
  }

  function readProcessSessionEntry(kind, identity) {
    try {
      const key = processSessionKey(kind, identity);
      const entry = JSON.parse(sessionStorage.getItem(key) || 'null');
      if (!entry || Number(entry.expiresAt || 0) <= Date.now()) {
        sessionStorage.removeItem(key);
        return null;
      }
      return entry;
    } catch (ignoreStorageRestriction) { return null; }
  }

  function writeProcessSessionEntry(kind, identity, entry) {
    try {
      const text = JSON.stringify(entry);
      if (text.length <= 900000) sessionStorage.setItem(processSessionKey(kind, identity), text);
    } catch (ignoreStorageRestriction) {}
  }

  function removeProcessSessionEntry(kind, identity) {
    try { sessionStorage.removeItem(processSessionKey(kind, identity)); }
    catch (ignoreStorageRestriction) {}
  }

  function getProcessTabCache(processId, tab, processVersion) {
    const key = processTabCacheKey(processId, tab);
    const identity = `${String(processId)}:${normalizeProcessTab(tab)}`;
    const entry = state.processTabCache.get(key) || readProcessSessionEntry('process-tab', identity);
    if (!entry || entry.expiresAt <= Date.now()) {
      state.processTabCache.delete(key);
      removeProcessSessionEntry('process-tab', identity);
      return null;
    }
    if (processVersion !== undefined && processVersion !== null &&
        Number(entry.processVersion || 0) !== Number(processVersion || 0)) return null;
    entry.lastAccess = Date.now();
    state.processTabCache.set(key, entry);
    return entry;
  }

  function setProcessTabCache(processId, tab, payload) {
    const normalized = normalizeProcessTab(tab);
    const entry = {
      payload,
      processVersion:Number(payload?.processVersion || state.currentProcess?.process?.version || 0),
      expiresAt:Date.now() + (PROCESS_TAB_TTL_MS[normalized] || BROWSER_CACHE.processTabTtlMs),
      lastAccess:Date.now()
    };
    state.processTabCache.set(processTabCacheKey(processId, normalized), entry);
    writeProcessSessionEntry('process-tab', `${String(processId)}:${normalized}`, entry);
  }

  function invalidateProcessTabCache(processId, tabs) {
    (tabs || ['registration','documents','review','audit']).map(normalizeProcessTab).forEach(tab => {
      state.processTabCache.delete(processTabCacheKey(processId, tab));
      removeProcessSessionEntry('process-tab', `${String(processId)}:${tab}`);
      state.processTabVersions.delete(tab);
      const pane = $(`[data-process-detail-pane="${tab}"]`, $('#detail-content'));
      if (pane) delete pane.dataset.rendered;
    });
  }

  function getProcessShellCache(processId) {
    const key = `${state.browserCacheNamespace}|${String(processId)}`;
    const entry = state.processShellCache.get(key) || readProcessSessionEntry('process-shell', String(processId));
    if (!entry || Number(entry.expiresAt || 0) <= Date.now()) {
      state.processShellCache.delete(key);
      removeProcessSessionEntry('process-shell', String(processId));
      return null;
    }
    state.processShellCache.set(key, entry);
    return entry;
  }

  function setProcessShellCache(processId, detail) {
    const entry = {payload:detail, expiresAt:Date.now() + BROWSER_CACHE.processShellTtlMs};
    state.processShellCache.set(`${state.browserCacheNamespace}|${String(processId)}`, entry);
    writeProcessSessionEntry('process-shell', String(processId), entry);
  }

  function invalidateProcessShellCache(processId) {
    state.processShellCache.delete(`${state.browserCacheNamespace}|${String(processId)}`);
    removeProcessSessionEntry('process-shell', String(processId));
  }

  function processTabApiKey(tab) {
    return {
      registration:'CADASTRO',
      documents:'DOCUMENTOS',
      review:'REVISAO',
      audit:'AUDITORIA'
    }[normalizeProcessTab(tab)];
  }

  function processTabLabel(tab) {
    return {
      registration:'Dados cadastrais',
      documents:'Upload de documentos',
      review:'Revisão do processo',
      audit:'Auditoria'
    }[normalizeProcessTab(tab)];
  }

  function processPaneLoading(tab) {
    return `<div class="process-pane-loading"><span class="mini-spinner"></span><div><strong>Carregando ${esc(processTabLabel(tab).toLowerCase())}</strong><small>Somente esta parte do processo está sendo consultada.</small></div></div>`;
  }

  function renderProcessShell(detail) {
    const p = detail.process;
    $('#detail-protocol').textContent = `PROTOCOLO ${p.protocol}`;
    $('#detail-title').textContent = p.clientName || 'Detalhes do processo';
    $('#detail-action-header').innerHTML = renderProcessActionHeader(detail);
    $('#detail-content').innerHTML = `
      <nav class="process-detail-tabs" aria-label="Abas do processo">
        <button type="button" class="process-detail-tab ${state.processDetailTab==='registration'?'active':''}" data-process-detail-tab="registration"><span>01</span> Dados cadastrais</button>
        <button type="button" class="process-detail-tab ${state.processDetailTab==='documents'?'active':''}" data-process-detail-tab="documents"><span>02</span> Documentos</button>
        <button type="button" class="process-detail-tab ${state.processDetailTab==='review'?'active':''}" data-process-detail-tab="review"><span>03</span> Revisão e OKs</button>
        <button type="button" class="process-detail-tab ${state.processDetailTab==='audit'?'active':''}" data-process-detail-tab="audit"><span>04</span> Auditoria</button>
      </nav>
      ${['registration','documents','review','audit'].map(tab => `<div class="process-detail-pane ${state.processDetailTab===tab?'active':''}" data-process-detail-pane="${tab}">${processPaneLoading(tab)}</div>`).join('')}`;
  }

  function mergeProcessTab(detail, tab, payload) {
    const next = detail || {};
    if (payload.data) next.data = payload.data;
    if (payload.formFields) next.formFields = payload.formFields;
    if (payload.requiredDocuments) next.requiredDocuments = payload.requiredDocuments;
    if (payload.documentGroups) next.documentGroups = payload.documentGroups;
    if (payload.documents) next.documents = payload.documents;
    if (payload.pending) next.pending = payload.pending;
    if (payload.activities) next.activities = payload.activities;
    if (payload.audit) next.audit = payload.audit;
    if (payload.auditTotal !== undefined) next.auditTotal = Number(payload.auditTotal || 0);
    if (payload.auditHasMore !== undefined) next.auditHasMore = Boolean(payload.auditHasMore);
    if (payload.movements) next.movements = payload.movements;
    if (payload.workflow) next.workflow = payload.workflow;
    if (payload.reviewReadiness) next.reviewReadiness = payload.reviewReadiness;
    if (payload.commercial) next.commercial = {...(next.commercial || {}), ...payload.commercial};
    next.processTabVersion = payload.processVersion || next.process?.version;
    const normalized = normalizeProcessTab(tab);
    state.processLoadedTabs.add(normalized);
    state.processTabVersions.set(normalized, Number(payload.processVersion || next.process?.version || 0));
    return next;
  }

  function renderProcessPane(tab, detail) {
    const normalized = normalizeProcessTab(tab);
    const target = $(`[data-process-detail-pane="${normalized}"]`, $('#detail-content'));
    if (!target) return;
    const modal = $('#detail-modal');
    const scrollTop = modal?.scrollTop || 0;
    const p = detail.process;
    if (normalized === 'registration') {
      target.innerHTML = `<section class="detail-summary">
        <div class="detail-grid">
          ${detailItem('Tipo',p.typeLabel)}${detailItem('Status',statusText(p.status))}${detailItem('Fase',statusText(p.phase))}${detailItem('Setor atual',statusText(p.sector))}
          ${detailItem('Responsável',p.responsible)}${detailItem('Encaminhado em',dateText(p.forwardedAt))}${detailItem('Encaminhado por',p.forwardedBy)}${detailItem('Criado em',dateText(p.createdAt))}
          ${detailItem('CPF',formatCpfDisplay(detail.data?.cliente_cpf || p.clientCpf))}${detailItem('E-mail',p.clientEmail)}${detailItem('Contato',p.clientContact)}
        </div>
      </section>
      <section class="detail-section registration-data-section" data-detail-section="registration"><div class="registration-data-heading"><div><p class="eyebrow">FICHA CADASTRAL ORGANIZADA</p><h3>Dados das partes e do imóvel</h3><p>Esta aba carrega somente os dados cadastrais e participantes.</p></div><button type="button" class="btn secondary compact" data-download-registration-sheet>Baixar ficha cadastral</button></div>${renderOrganizedRegistration(detail)}</section>
      ${renderParticipants(detail)}`;
    } else if (normalized === 'documents') {
      clearVisualObjectUrls();
