      <section class="detail-section document-workspace" data-detail-section="documents"><div class="document-section-head"><div><p class="eyebrow">UPLOAD E CONFERÊNCIA</p><h3>Documentos do processo</h3><p class="muted">Envie, visualize e registre o OK individual sem recarregar o modal.</p></div>${renderDocumentTypePicker(detail.requiredDocuments || [])}</div>${renderDocumentGroups(detail.documentGroups || [])}<div class="document-requirements">${(detail.requiredDocuments || []).map(doc => renderDocumentRequirement(doc, 'detail')).join('')}</div>${renderUploadedDocuments(detail.documents || [])}</section>`;
      if (state.processDetailTab === 'documents') scheduleVisualThumbnails();
    } else if (normalized === 'review') {
      target.innerHTML = `${renderProcessOkPanel(detail)}
      <section class="detail-section" data-detail-section="workflow"><h3>Tramitação hierárquica</h3>${renderWorkflowActions(detail)}</section>
      ${renderProcessFlow(detail)}
      ${renderProposals(detail)}
      ${renderManagerChecklist(detail)}
      ${renderContractsForProcess(detail)}
      <section class="detail-section" data-detail-section="pending"><div class="review-section-heading"><div><p class="eyebrow">PENDÊNCIAS</p><h3>Correções e confirmações</h3></div>${detail.capabilities.pending?'<span class="status-badge status-PENDENTE">Exige OK individual</span>':''}</div>${detail.capabilities.pending ? renderPendingForm() : ''}${renderPendingList(detail.pending || [])}</section>
      <section class="detail-section" data-detail-section="activities"><h3>Atuações</h3>${renderActivityForm(detail)}<div class="activity-list">${(detail.activities || []).map(renderActivity).join('') || '<p class="muted">Nenhuma atuação registrada.</p>'}</div></section>`;
    } else {
      target.innerHTML = `<section class="detail-section audit-workspace" data-detail-section="audit"><div class="review-section-heading"><div><p class="eyebrow">TRILHA IMUTÁVEL</p><h3>Auditoria do processo</h3></div><span class="status-badge status-APROVADO">${esc(detail.auditTotal ?? (detail.audit || []).length)} registros</span></div>${renderAudit(detail.audit || [], detail)}</section>`;
    }
    target.dataset.rendered = String(state.processTabVersions.get(normalized) || detail.process?.version || 1);
    if (modal) requestAnimationFrame(() => { modal.scrollTop = scrollTop; });
  }

  async function ensureProcessTab(tab, force = false, viewToken = state.processViewToken) {
    const normalized = normalizeProcessTab(tab);
    const processId = state.currentProcess?.process?.id;
    if (!processId || viewToken !== state.processViewToken) return;
    if (!force && state.processLoadedTabs.has(normalized)) {
      const rendered = $(`[data-process-detail-pane="${normalized}"]`, $('#detail-content'))?.dataset.rendered;
      if (!rendered) renderProcessPane(normalized, state.currentProcess);
      return;
    }
    const target = $(`[data-process-detail-pane="${normalized}"]`, $('#detail-content'));
    if (!force) {
      const cached = getProcessTabCache(processId, normalized, state.currentProcess?.process?.version);
      if (cached) {
        state.currentProcess = mergeProcessTab(state.currentProcess, normalized, cached.payload);
        renderProcessPane(normalized, state.currentProcess);
        return;
      }
    }
    if (target) target.innerHTML = processPaneLoading(normalized);
    try {
      const fetchKey = `${processId}|${normalized}`;
      if (!state.processTabFetches.has(fetchKey)) {
        state.processTabFetches.set(fetchKey,
          api('apiCarregarAbaProcesso', state.token, processId, processTabApiKey(normalized))
            .finally(() => state.processTabFetches.delete(fetchKey)));
      }
      const payload = await state.processTabFetches.get(fetchKey);
      if (viewToken !== state.processViewToken || state.currentProcess?.process?.id !== processId) return;
      setProcessTabCache(processId, normalized, payload);
      state.currentProcess = mergeProcessTab(state.currentProcess, normalized, payload);
      if (payload.workflow) $('#detail-action-header').innerHTML = renderProcessActionHeader(state.currentProcess);
      renderProcessPane(normalized, state.currentProcess);
    } catch (error) {
      if (target && viewToken === state.processViewToken) target.innerHTML = `<div class="empty-state"><strong>Não foi possível carregar esta aba.</strong><p>${esc(error.message)}</p><button class="btn secondary compact" data-retry-process-tab="${esc(normalized)}">Tentar novamente</button></div>`;
    }
  }

  async function openProcess(id, initialTab = 'registration') {
    const viewToken = ++state.processViewToken;
    clearVisualObjectUrls();
    state.processDetailTab = normalizeProcessTab(initialTab);
    state.processLoadedTabs = new Set();
    state.processTabVersions = new Map();
    state.currentProcess = null;
    openModal('detail-modal');
    const shellCached = getProcessShellCache(id);
    const tabCached = getProcessTabCache(id, state.processDetailTab, shellCached?.payload?.process?.version);
    let renderedFromCache = false;
    if (shellCached?.payload && tabCached?.payload) {
      state.currentProcess = mergeProcessTab(shellCached.payload, state.processDetailTab, tabCached.payload);
      renderProcessShell(state.currentProcess);
      renderProcessPane(state.processDetailTab, state.currentProcess);
      renderedFromCache = true;
    } else if (shellCached?.payload) {
      state.currentProcess = shellCached.payload;
      renderProcessShell(state.currentProcess);
    } else {
      $('#detail-action-header').innerHTML = '<div class="process-action-loading"><span class="mini-spinner"></span> Preparando ações...</div>';
      $('#detail-content').innerHTML = processPaneLoading(state.processDetailTab);
    }
    try {
      const detailPromise = api('apiAbrirProcesso', state.token, id);
      const coldTabPromise = tabCached?.payload ? null :
        api('apiCarregarAbaProcesso', state.token, id, processTabApiKey(state.processDetailTab));
      let detail;
      let coldTabPayload = null;
      if (coldTabPromise) [detail, coldTabPayload] = await Promise.all([detailPromise, coldTabPromise]);
      else detail = await detailPromise;
      if (viewToken !== state.processViewToken) return;
      setProcessShellCache(id, detail);
      const validCached = getProcessTabCache(id, state.processDetailTab, detail.process?.version);
      let tabPayload = validCached?.payload;
      if (!tabPayload) {
        invalidateProcessTabCache(id, [state.processDetailTab]);
        tabPayload = coldTabPayload || await api('apiCarregarAbaProcesso', state.token, id, processTabApiKey(state.processDetailTab));
      }
      if (viewToken !== state.processViewToken) return;
      setProcessTabCache(id, state.processDetailTab, tabPayload);
      state.currentProcess = mergeProcessTab(detail, state.processDetailTab, tabPayload);
      if (!renderedFromCache || !validCached) {
        renderProcessShell(state.currentProcess);
        renderProcessPane(state.processDetailTab, state.currentProcess);
      } else {
        $('#detail-protocol').textContent = `PROTOCOLO ${state.currentProcess.process.protocol}`;
        $('#detail-title').textContent = state.currentProcess.process.clientName || 'Detalhes do processo';
        $('#detail-action-header').innerHTML = renderProcessActionHeader(state.currentProcess);
      }
    } catch (error) {
      if (viewToken !== state.processViewToken) return;
      $('#detail-action-header').innerHTML = '';
      $('#detail-content').innerHTML = `<div class="empty-state">${esc(error.message)}</div>`;
    }
  }

  function renderProcessFlow(detail) {
    const p = detail.process;
    const phases = [
      {key:'CADASTRO', label:'Corretor — cadastro', description:'Ficha, participantes e dados do imóvel'},
      {key:'DOCUMENTACAO', label:'Corretor — documentos', description:'Uploads obrigatórios e proposta'},
      {key:'ADMINISTRATIVO', label:'Administrativo', description:'Conferência e tratamento de pendências'},
      {key:'GERENCIAL', label:'Gerente administrativo', description:'Sete OKs, negociação e aprovação'},
      {key:'GERENTE_GERAL', label:'Gerente geral', description:'Validação hierárquica final da gerência'},
      {key:'CONTRATO', label:'Contratos', description:'Emissão, assinatura e conferência'},
      {key:'AUDITORIA', label:'Auditoria', description:'Revisão final e manifesto de integridade'},
      {key:'FINALIZACAO', label:'Finalizado', description:'Processo bloqueado e imutável'}

    const rawIndex = phases.findIndex(phase => phase.key === p.phase);

  async function createThumbnailFromStoredDocument(documentId, sourceMimeType) {
    const stored = await fetchStoredDocument(documentId, null, 'PREVIEW');
    const mimeType = String(stored.mimeType || sourceMimeType || '').toLowerCase();
    const maxWidth = 360;
    const maxHeight = 270;
    let canvas = document.createElement('canvas');
    let sourceWidth = 0;
    let sourceHeight = 0;
    let dispose = () => {};

    if (mimeType === 'application/pdf') {
      const pdfjs = await loadPdfJs();
      const assetBase = ['https:', '', 'cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284'].join('/');
      const pdf = await pdfjs.getDocument({
        data:stored.bytes.slice(),
        cMapUrl:assetBase + '/cmaps/',
        cMapPacked:true,
        standardFontDataUrl:assetBase + '/standard_fonts/',
        wasmUrl:assetBase + '/wasm/'
      }).promise;
      dispose = () => { try { void pdf.destroy(); } catch (ignore) {} };
      const page = await pdf.getPage(1);
      const original = page.getViewport({scale:1});
      const scale = Math.min(maxWidth / original.width, maxHeight / original.height, 1.5);
      const viewport = page.getViewport({scale});
      sourceWidth = Math.max(1, Math.floor(viewport.width));
      sourceHeight = Math.max(1, Math.floor(viewport.height));
      canvas.width = sourceWidth;
      canvas.height = sourceHeight;
      await page.render({canvasContext:canvas.getContext('2d', {alpha:false}), viewport}).promise;
    } else if (mimeType.startsWith('image/')) {
      const bitmap = await createImageBitmap(new Blob([stored.bytes], {type:mimeType}));
      const scale = Math.min(maxWidth / bitmap.width, maxHeight / bitmap.height, 1);
      sourceWidth = Math.max(1, Math.round(bitmap.width * scale));
      sourceHeight = Math.max(1, Math.round(bitmap.height * scale));
      canvas.width = sourceWidth;
      canvas.height = sourceHeight;
      canvas.getContext('2d', {alpha:false}).drawImage(bitmap, 0, 0, sourceWidth, sourceHeight);
      dispose = () => { try { bitmap.close(); } catch (ignore) {} };
    } else {
      throw new Error('Este formato não permite gerar miniatura no navegador.');
    }

    try {
      const preferredType = canvas.toDataURL('image/webp').startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg';
      const blob = await canvasToBoundedThumbnailBlob(canvas, preferredType, 80 * 1024);
      const identity = documentCacheIdentity(documentId);
      const metadata = {
        available:true,
        fileName:stored.fileName,
        sourceMimeType:mimeType,
        mimeType:blob.type || preferredType,
        size:blob.size,
        generatedInBrowser:true
      };
      await browserCachePut('thumbnail', identity, blob, metadata);
      return {...metadata, blob, fromCache:false};
    } finally {
      dispose();
      canvas.width = 1;
      canvas.height = 1;
      canvas = null;
    }
  }

  function canvasToBlobAsync(canvas, mimeType, quality) {
    return new Promise((resolve, reject) => canvas.toBlob(
      value => value ? resolve(value) : reject(new Error('Não foi possível gerar a miniatura.')),
      mimeType,
      quality
    ));
  }

  async function canvasToBoundedThumbnailBlob(sourceCanvas, preferredType, maxBytes) {
    const types = preferredType === 'image/webp'
      ? ['image/webp', 'image/jpeg']
      : ['image/jpeg'];
    const qualities = [.82, .76, .70, .64, .58, .52, .46];
    let working = sourceCanvas;
    let best = null;
    for (let resize = 0; resize < 7; resize += 1) {
      for (const type of types) {
        for (const quality of qualities) {
          const candidate = await canvasToBlobAsync(working, type, quality);
          if (!best || candidate.size < best.size) best = candidate;
          if (candidate.size <= maxBytes) {
            if (working !== sourceCanvas) {
              working.width = 1;
              working.height = 1;
            }
            return candidate;
          }
        }
      }
      const nextWidth = Math.max(120, Math.floor(working.width * .82));
      const nextHeight = Math.max(90, Math.floor(working.height * .82));
      if (nextWidth === working.width && nextHeight === working.height) break;
      const smaller = document.createElement('canvas');
      smaller.width = nextWidth;
      smaller.height = nextHeight;
      smaller.getContext('2d', {alpha:false}).drawImage(working, 0, 0, nextWidth, nextHeight);
      if (working !== sourceCanvas) {
        working.width = 1;
        working.height = 1;
      }
      working = smaller;
    }
    if (working !== sourceCanvas) {
      working.width = 1;
      working.height = 1;
    }
    if (best && best.size <= maxBytes) return best;
    throw new Error('A miniatura não pôde ser reduzida ao limite seguro de 80 KB.');
  }

  async function loadVisualThumbnail(documentId, options = {}) {
    const card = $$('[data-visual-document]', $('#detail-content')).find(item => item.dataset.visualDocument === documentId);
    if (!card || card.dataset.thumbnailState === 'loading' || (card.dataset.thumbnailState === 'loaded' && !options.force)) return;
    if (!previewSupported(card.dataset.documentMime)) return;
    const target = $('[data-visual-thumbnail]', card);
    if (!target) return;
    const loadToken = state.visualLoadToken;
    const identity = documentCacheIdentity(documentId);
    if (options.force) state.thumbnailMisses.delete(identity);
    card.dataset.thumbnailState = 'loading';
    card.classList.remove('thumbnail-unavailable','thumbnail-missing');
    target.removeAttribute('title');
    target.classList.add('loading');
    try {
      const file = await getVisualThumbnail(documentId, {
        force:Boolean(options.force),
        allowSourceFallback:Boolean(options.allowSourceFallback)
      });
      if (loadToken !== state.visualLoadToken || !card.isConnected) return;
      if (file.available && file.blob && String(file.mimeType || '').startsWith('image/')) {
        const url = URL.createObjectURL(file.blob);
        const previous = state.visualObjectUrls.get(documentId);
        if (previous) revokeObjectUrl(previous);
        state.visualObjectUrls.set(documentId, url);
        target.innerHTML = `<img src="${esc(url)}" alt="Miniatura de ${esc(file.fileName)}" data-thumbnail-image="${esc(documentId)}" loading="lazy" decoding="async">`;
        target.classList.remove('loading');
        card.dataset.thumbnailState = 'loaded';
        $('[data-load-visual-thumb]', card)?.classList.add('hidden');
      } else {
        const isPdf = String(file.sourceMimeType || '').toLowerCase() === 'application/pdf';
        const status = visualThumbnailMessage(file, isPdf);
        card.dataset.thumbnailState = status.state;
        card.classList.add(`thumbnail-${status.state}`);
        target.title = status.title;
        target.innerHTML = `<span class="${isPdf?'visual-pdf-badge':''}">${isPdf?'PDF':'IMG'}</span><small>${esc(status.label)}</small>`;
        const retry = $('[data-load-visual-thumb]', card);
        if (retry) {
          retry.classList.remove('hidden');
          retry.textContent = status.state === 'unavailable' ? 'Testar acesso' : 'Gerar miniatura';
          retry.title = status.title;
        }
        if (options.manual) toast(status.title, status.state === 'unavailable' ? 'error' : 'info');
      }
      target.classList.remove('loading');
    } catch (error) {
      if (loadToken !== state.visualLoadToken || !card.isConnected) return;
      card.dataset.thumbnailState = 'error';
      card.classList.add('thumbnail-unavailable');
      target.classList.remove('loading');
      target.title = error.message || 'Não foi possível carregar a miniatura.';
      target.innerHTML = `<span>${card.classList.contains('is-pdf')?'PDF':'IMG'}</span><small>Falha ao carregar</small>`;
      const retry = $('[data-load-visual-thumb]', card);
      if (retry) {
        retry.classList.remove('hidden');
        retry.textContent = 'Tentar novamente';
        retry.title = target.title;
      }
      if (options.manual) toast(error.message || 'Não foi possível carregar a miniatura.', 'error');
    }
  }

  async function getVisualThumbnail(documentId, options = {}) {
    const identity = documentCacheIdentity(documentId);
    if (!options.force && state.thumbnailFetches.has(identity)) {
      return state.thumbnailFetches.get(identity);
    }
    const operation = resolveVisualThumbnail(documentId, options);
    state.thumbnailFetches.set(identity, operation);
    try { return await operation; }
    finally {
      if (state.thumbnailFetches.get(identity) === operation) state.thumbnailFetches.delete(identity);
    }
  }

  async function resolveVisualThumbnail(documentId, options = {}) {
    const identity = documentCacheIdentity(documentId);
    const miss = state.thumbnailMisses.get(identity);
    const missUntil = Number(miss?.until || miss || 0);
    if (!options.force && missUntil > Date.now()) return miss?.result || {available:false};
    const cached = await browserCacheGet('thumbnail', identity);
    if (cached?.blob) {
      return {
        available:true,
        blob:cached.blob,
        mimeType:cached.mimeType,
        fileName:cached.fileName,
        fromCache:true
      };
    }
    const fullDocument = await browserCacheGet('document', identity);
    if (fullDocument?.blob && String(fullDocument.mimeType || '').startsWith('image/')) {
      return {
        available:true,
        blob:fullDocument.blob,
        mimeType:fullDocument.mimeType,
        fileName:fullDocument.fileName,
        fromCache:true
      };
    }
    const cloudMetadata = cloudThumbnailMetadata(documentId);
    if (cloudMetadata && !cloudPreviewCircuitOpen()) {
      try {
        const access = await requestCloudAccess(documentId, 'VIEW', 'thumbnail', CLOUD_PREVIEW_TIMEOUT_MS);
        const response = await fetch(access.accessUrl, {cache:'force-cache', credentials:'omit'});
        if (!response.ok) throw new Error('Miniatura da nuvem indisponível.');
        const blob = await response.blob();
        if (!blob.size || blob.size > 80 * 1024 || !String(blob.type || access.mimeType || '').startsWith('image/')) {
          throw new Error('A miniatura da nuvem não atende ao limite seguro.');
        }
        if (access.sha256 && globalThis.crypto?.subtle) {
          const actual = await sha256Hex(new Uint8Array(await blob.arrayBuffer()));
          if (actual && actual !== String(access.sha256).toLowerCase()) throw new Error('A miniatura da nuvem falhou na verificação.');
        }
        const result = {
          available:true,
          blob,
          mimeType:blob.type || access.mimeType,
          fileName:cloudMetadata.fileName,
          sourceMimeType:cloudMetadata.mimeType,
          fromCloud:true
        };
        await browserCachePut('thumbnail', identity, blob, result);
        cloudPreviewSucceeded();
        return result;
      } catch (cloudThumbnailError) {
        cloudPreviewFailed(cloudThumbnailError);
        // A falta de uma miniatura derivada nunca bloqueia o original.
      }
    }
    let file;
    const documentMetadata = (state.currentProcess?.documents || []).find(item => String(item.id) === String(documentId));
    const sourceSize = Number(documentMetadata?.size || cloudMetadata?.size || 0);
    const automaticLocalFallbackAllowed = sourceSize > 0 && sourceSize <= AUTO_THUMBNAIL_SOURCE_LIMIT;
    try {
      file = await api('apiMiniaturaDocumento', state.token, documentId, state.context);
    } catch (error) {
      if (['PREVIEW_TOO_LARGE','THUMBNAIL_TOO_LARGE'].includes(String(error?.code || ''))) {
        if (options.allowSourceFallback || automaticLocalFallbackAllowed) return createThumbnailFromStoredDocument(documentId, '');
        return {available:false, sourceMimeType:documentMetadata?.mimeType || '', errorCode:'THUMBNAIL_SOURCE_TOO_LARGE', fallbackAllowed:true, message:'PDF grande: a miniatura será gerada somente quando você solicitar.'};
      }
      throw error;
    }
    if (!file.available || !file.base64) {
      const canGenerateLocally = options.allowSourceFallback ||
        (automaticLocalFallbackAllowed && (file.fallbackAllowed ||
          ['PREVIEW_TOO_LARGE','THUMBNAIL_TOO_LARGE'].includes(String(file.errorCode || ''))));
      if (canGenerateLocally && file.errorCode !== 'DOCUMENT_FILE_UNAVAILABLE') {
        try { return await createThumbnailFromStoredDocument(documentId, file.sourceMimeType); }
        catch (fallbackError) {
          file.message = fallbackError.message || file.message;
          file.errorCode = fallbackError.code || file.errorCode || 'THUMBNAIL_GENERATION_FAILED';
        }
      }
      const missMs = file.errorCode === 'DOCUMENT_FILE_UNAVAILABLE' ? 60 * 1000 : 5 * 60 * 1000;
      state.thumbnailMisses.set(identity, {until:Date.now() + missMs, result:file});
      return file;
    }
    const blob = new Blob([base64ToBytes(file.base64)], {type:file.mimeType || 'image/jpeg'});
    await browserCachePut('thumbnail', identity, blob, file);
    return {...file, blob, base64:undefined, fromCache:false};
  }

  function enqueueVisualThumbnail(documentId) {
    if (!documentId || state.visualThumbnailQueued.has(documentId)) return;
    state.visualThumbnailQueued.add(documentId);
    state.visualThumbnailQueue.push({documentId, loadToken:state.visualLoadToken});
    drainVisualThumbnailQueue();
  }

  function drainVisualThumbnailQueue() {
    while (state.visualThumbnailWorkers < state.visualThumbnailConcurrency && state.visualThumbnailQueue.length) {
      const item = state.visualThumbnailQueue.shift();
      state.visualThumbnailWorkers += 1;
      void loadVisualThumbnail(item.documentId).finally(() => {
        if (item.loadToken === state.visualLoadToken) {
          state.visualThumbnailWorkers = Math.max(0, state.visualThumbnailWorkers - 1);
          state.visualThumbnailQueued.delete(item.documentId);
          drainVisualThumbnailQueue();
        }
      });
    }
  }

  function scheduleVisualThumbnails() {
    const cards = $$('[data-visual-document]', $('[data-process-detail-pane="documents"]'))
      .filter(card => !card.dataset.thumbnailState && previewSupported(card.dataset.documentMime));
    if (!cards.length || !state.currentProcess?.capabilities?.download) return;
    const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    state.visualThumbnailConcurrency = connection?.saveData || ['slow-2g','2g'].includes(String(connection?.effectiveType || '')) ? 1 : 2;
    const eagerCards = cards.slice(0, state.visualThumbnailConcurrency);
    eagerCards.forEach(card => enqueueVisualThumbnail(card.dataset.visualDocument));
    const deferredCards = cards.slice(eagerCards.length);
    if (!deferredCards.length) return;
    if ('IntersectionObserver' in window) {
      state.visualObserver = new IntersectionObserver(entries => {
        entries.filter(entry => entry.isIntersecting).forEach(entry => {
          state.visualObserver?.unobserve(entry.target);
          enqueueVisualThumbnail(entry.target.dataset.visualDocument);
        });
      }, {root:$('#detail-modal'), rootMargin:'120px 0px'});
      deferredCards.forEach(card => state.visualObserver.observe(card));
      return;
    }
    deferredCards.slice(0, 6).forEach(card => enqueueVisualThumbnail(card.dataset.visualDocument));
  }

  function formatCpfDisplay(value) {
    let digits = String(value || '').replace(/\D/g,'');
    if (digits.length === 10) digits = `0${digits}`;
    return digits.length === 11 ? digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4') : String(value || '');
  }

  function formatDetailValue(key, value) {
    if (Array.isArray(value)) return value.join(', ');
    const text = String(value == null ? '' : value);
    if (/cpf/.test(key) && text) return formatCpfDisplay(text);
    if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
      const [year,month,day] = text.split('-');
      return `${day}/${month}/${year}`;
    }
    if (/(^|_)(renda|valor|credito|honorarios|comissao|aluguel)(_|$)/.test(key) && text) {
      const number = parseCurrencyText(text);
      if (number || /^0(?:[,.]0+)?$/.test(text)) return formatBRL(number);
    }
    return text;
  }

  function organizedRegistrationGroups(detail) {
    const data = detail.data || {};
    const internal = new Set(['aceite_renda_insuficiente','aceite_renda_token','aceite_renda_em','aceite_renda_por']);
    const grouped = {};
    const schema = Array.isArray(detail.formFields) ? detail.formFields : [];
    const represented = new Set();
    schema.forEach((field, index) => {
      const key = String(field.name || '');
      if (!key || internal.has(key)) return;
      represented.add(key);
      const section = semanticSectionForField(field);
      (grouped[section] ||= []).push({
        key,
        label:field.label || detailLabel(key),
        value:formatDetailValue(key, data[key]),
        order:Number(field.order || index)
      });
    });
    Object.entries(data).forEach(([key,value], index) => {
      if (internal.has(key) || represented.has(key)) return;
      const section = semanticSectionForField({name:key});
      (grouped[section] ||= []).push({
        key,
        label:detailLabel(key),
        value:formatDetailValue(key,value),
        order:10000 + index
      });
    });
    const blueprint = formSectionBlueprint(detail.process.type);
    return blueprint.map(section => ({
      ...section,
      items:(grouped[section.key] || []).sort((a,b) => a.order - b.order)
    })).filter(section => section.items.length);
  }

    const routing = workflow.routing || {};
    return `<div class="workflow-state-card ${workflow.locked?'locked':''}">
      <div><p class="eyebrow">FLUXO CONTROLADO</p><h4>${esc(statusText(workflow.stage || detail.process.currentStage))}</h4><p>${esc(statusText(workflow.state || detail.process.workflowStatus))} · versão ${esc(workflow.version || detail.process.version)}</p><div class="workflow-routing-notice"><span class="process-routing-symbol ${esc(routing.tone || '')}">${esc(routing.symbol || '●')}</span><strong>${esc(routing.message || `Responsável: ${detail.process.responsible || '—'}`)}</strong></div>${workflow.locked?`<small>Bloqueado em ${dateText(workflow.lockedAt)} por ${esc(workflow.lockedBy || '—')} · manifesto ${esc(String(workflow.manifestHash || '').slice(0,16))}…</small>`:''}</div>
      <div class="workflow-action-buttons">${buttons.join('') || '<span class="muted">Nenhuma ação disponível para seu perfil nesta etapa.</span>'}</div>
    </div>`;
  }

  function renderParticipants(detail) {
    const items = detail.commercial?.participants || [];
    const canEdit = detail.capabilities?.edit && !detail.workflow?.locked;
    return `<section class="detail-section" data-detail-section="participants"><div class="document-section-head"><div><h3>Participantes</h3><p class="muted">Uma pessoa pode acumular vários papéis sem duplicação de dados.</p></div>${canEdit?'<button class="btn primary compact" data-add-participant>👤+ Adicionar participante</button>':''}</div>
      ${detail.commercial?.participantCompleteness?.ready?'':`<div class="notice warning">${esc((detail.commercial?.participantCompleteness?.errors || []).join(' · '))}</div>`}
      <div class="participant-grid">${items.map(item => `<article class="participant-card"><header><span>${esc(item.personType)}</span><strong>${esc(item.roles.map(statusText).join(' · '))}</strong></header><h4>${esc(item.name)}</h4><p>${esc(item.document)} · ${esc(item.email || item.phone || 'sem contato')}</p><small>${esc(item.profession || item.legalRepresentative || '')}</small>${canEdit?`<footer><button class="link-btn" data-edit-participant="${esc(item.id)}">Editar</button><button class="link-btn danger" data-disable-participant="${esc(item.id)}">Remover</button></footer>`:''}</article>`).join('') || '<div class="empty-state compact">Nenhum participante cadastrado.</div>'}</div>
    </section>`;
  }

  function renderProposals(detail) {
    const proposals = detail.commercial?.proposals || [];
    const canManage = detail.capabilities?.manageProposal && !detail.workflow?.locked;
    const canAccept = detail.capabilities?.acceptProposal && !detail.workflow?.locked;
    return `<section class="detail-section" data-detail-section="proposals"><div class="document-section-head"><div><h3>Proposta comercial</h3><p class="muted">Revisões imutáveis e condições transformadas em cláusulas numeradas.</p></div>${canManage?'<button class="btn primary compact" data-add-proposal>+ Nova revisão</button>':''}</div>
      <div class="proposal-list">${proposals.map(item => `<article class="proposal-card"><header><div><span>${esc(item.number)}</span><h4>${esc(item.typeLabel)}</h4></div><span class="status-badge status-${esc(item.status)}">${esc(statusText(item.status))}</span></header><div class="proposal-values"><span>Inicial<strong>${esc(formatBRL(item.initialValue))}</strong></span><span>Proposto<strong>${esc(formatBRL(item.proposedValue))}</strong></span><span>Negociado<strong>${esc(formatBRL(item.negotiatedValue))}</strong></span><span>Aceito<strong>${esc(formatBRL(item.acceptedValue))}</strong></span></div>${item.conditions?.length?`<ol>${item.conditions.map(condition=>`<li><strong>${esc(condition.type)}:</strong> ${esc(condition.details)}</li>`).join('')}</ol>`:''}<footer>${canManage&&item.status==='RASCUNHO'?`<button class="link-btn" data-proposal-action="send" data-proposal-id="${esc(item.id)}">Enviar</button>`:''}${canManage&&['ENVIADA','EM_NEGOCIACAO'].includes(item.status)?`<button class="link-btn" data-proposal-action="negotiate" data-proposal-id="${esc(item.id)}">Em negociação</button>`:''}${canAccept&&['ENVIADA','EM_NEGOCIACAO'].includes(item.status)?`<button class="btn success compact" data-proposal-action="accept" data-proposal-id="${esc(item.id)}">✓ OK da proposta</button>`:''}${item.status==='ACEITA'?`<span class="inline-ok-proof">✓ Proposta analisada e aceita</span><button class="link-btn" data-preview-contract data-proposal-id="${esc(item.id)}">Prévia do contrato</button>`:''}</footer></article>`).join('') || '<div class="empty-state compact">Nenhuma proposta criada.</div>'}</div>
    </section>`;
  }

  function renderManagerChecklist(detail) {
    const workflow = detail.workflow || {};
    if (!workflow.categories?.length) return '';
    const canDecide = workflow.actions?.decideCategories;
    return `<section class="detail-section" data-detail-section="checklist"><div class="document-section-head"><div><h3>Checklist do Gerente Administrativo</h3><p class="muted">Cada decisão gera aceite eletrônico individual e encadeado.</p></div>${canDecide?'<button class="btn success compact" data-approve-all-categories>Dar OK em todos</button>':''}</div>
      <div class="manager-checklist">${workflow.categories.map(item => `<article class="checklist-card ${item.decision?'decided':item.readyForOk?'ready':'blocked'}"><header><span class="checklist-light"></span><div><strong>${esc(item.label)}</strong><small>${item.applicable?`${esc(item.items)} item(ns) aplicável(is)`:'Sem itens aplicáveis'}</small></div>${item.decision?`<span class="status-badge status-APROVADO">${esc(statusText(item.decision.value))}</span>`:''}</header>${item.blockers?.length?`<ul>${item.blockers.map(blocker=>`<li>${esc(blocker)}</li>`).join('')}</ul>`:''}${item.decision?`<p>${esc(item.decision.justification || 'Aceite registrado')} · ${esc(item.decision.by)} · ${dateText(item.decision.at)}</p>`:canDecide?`<footer><button class="btn success compact" data-category-decision="OK" data-category="${esc(item.category)}" ${item.readyForOk?'':'disabled'}>OK</button><button class="btn secondary compact" data-category-decision="NAO_SE_APLICA" data-category="${esc(item.category)}" ${item.applicable?'disabled':''}>Não se aplica</button></footer>`:''}</article>`).join('')}</div>
    </section>`;
  }

  function renderContractsForProcess(detail) {
    const contracts = detail.commercial?.contracts || [];
    const accepted = detail.commercial?.proposals?.find(item => item.status === 'ACEITA');
    const canIssue = detail.capabilities?.issueContract && !detail.workflow?.locked && accepted;
    return `<section class="detail-section" data-detail-section="contracts"><div class="document-section-head"><div><h3>Contratos</h3><p class="muted">HTML e PDF versionados no Drive, com hash e prévia segura.</p></div>${canIssue?`<div class="table-actions"><button class="btn secondary compact" data-preview-contract data-proposal-id="${esc(accepted.id)}">Prévia HTML</button><button class="btn primary compact" data-issue-contract data-proposal-id="${esc(accepted.id)}">Emitir</button></div>`:''}</div>
      ${contracts.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Número</th><th>Título</th><th>Status</th><th>Emissão</th><th>Ações</th></tr></thead><tbody>${contracts.map(item=>`<tr><td><strong>${esc(item.number)}</strong></td><td>${esc(item.title)}</td><td>${esc(statusText(item.status))}</td><td>${dateText(item.createdAt)}</td><td><div class="table-actions"><button class="link-btn" data-view-contract="${esc(item.id)}">Ver PDF</button>${item.signedFileId?`<button class="link-btn" data-view-signed-contract="${esc(item.id)}">Ver assinado</button>`:detail.capabilities?.issueContract&&!detail.workflow?.locked?`<button class="link-btn" data-upload-signed-contract="${esc(item.id)}">Anexar assinado</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state compact">Nenhum contrato emitido.</div>'}
    </section>`;
  }

  const fileSizeText = bytes => {
    const value = Number(bytes || 0);
    if (value < 1024) return `${value} B`;
    if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
    return `${(value / 1024 / 1024).toFixed(1)} MB`;
  };

  const pdfPreviewEnabled = () => {
    const configured = state.bootstrap?.config?.PDF_PREVIEW_ENABLED;
    return configured === true || ['SIM','TRUE'].includes(String(configured || '').toUpperCase());
  };
  const previewSupported = mimeType => {
    const normalized = String(mimeType || '').toLowerCase();
    if (normalized === 'application/pdf' && !pdfPreviewEnabled()) return false;
    return ['application/pdf','image/jpeg','image/png','image/webp','image/avif'].includes(normalized);
  };

  function acceptedDocumentMimeTypes(value) {
    const types = String(value || '').split(',').map(item => item.trim().toLowerCase()).filter(Boolean);
    if (types.some(type => type.startsWith('image/'))) {
      ['image/jpeg','image/png','image/webp','image/avif'].forEach(type => {
        if (!types.includes(type)) types.push(type);
      });
    }
    return types.join(',');
  }

  function renderDocumentTypePicker(documents) {
    const items = documents || [];
    if (!items.length) return '';
    return `<label class="document-type-picker">Adicionar documento<select data-document-type-jump><option value="">Escolha o tipo...</option>${items.map(doc => `<option value="${esc(doc.id)}">${doc.required?'★ ':''}${esc(doc.name)}${doc.uploaded?` (${esc(doc.files)} enviado(s))`:''}</option>`).join('')}</select></label>`;
  }

  function renderDocumentRequirement(doc, surface = 'detail') {
    const key = `${surface}:${doc.id}`;
    const canUpload = Boolean(state.currentProcess?.capabilities?.upload);
    const status = doc.uploaded ? `${doc.files} enviado(s)` : doc.required ? 'Pendente' : 'Opcional';
    const statusClass = doc.uploaded ? 'status-APROVADO' : doc.required ? 'status-PENDENTE' : 'document-status-optional';
    const groupText = doc.requirementGroup === 'COMPROVACAO_RENDA' ? ' · uma das opções de comprovação de renda' : '';
    const acceptedTypes = acceptedDocumentMimeTypes(doc.mimeTypes);
    const hasPdf = acceptedTypes.includes('application/pdf');
    const hasImage = acceptedTypes.includes('image/');
    const cloudPdfLimit = hasPdf ? effectiveUploadLimitMb('application/pdf', doc.maxMb) : 0;
    const cloudImageLimit = hasImage ? effectiveUploadLimitMb('image/jpeg', doc.maxMb) : 0;
    const limitText = cloudPdfLimit && cloudImageLimit
      ? `até ${esc(cloudImageLimit)} MB para imagens e ${esc(cloudPdfLimit)} MB para PDFs`
      : cloudPdfLimit
        ? `até ${esc(cloudPdfLimit)} MB por PDF`
        : cloudImageLimit
          ? `até ${esc(cloudImageLimit)} MB por imagem`
          : `até ${esc(doc.maxMb)} MB cada`;
    const largeUploadNotice = mediaCloudEnabled() && !mediaLargeUploadConfigured()
      ? ' · acima de 6 MB bloqueado até a cópia automática no Drive ser validada'
      : '';
    return `<form class="document-card" data-document-upload="${esc(doc.id)}" data-document-key="${esc(key)}" data-max-mb="${esc(doc.maxMb)}" data-mime-types="${esc(acceptedTypes)}">
      <div class="document-card-head"><div><strong>${esc(doc.name)}</strong><small class="muted">${doc.required?'Obrigatório neste processo':'Opcional neste processo'}${groupText} · vários arquivos permitidos · ${limitText}${largeUploadNotice}</small></div><span class="status-badge ${statusClass}">${esc(status)}</span></div>
      ${canUpload ? `<div class="document-dropzone" data-document-dropzone tabindex="0" role="button" aria-label="Selecionar ou arrastar ${esc(doc.name)}"><input class="document-file-input" type="file" name="file" accept="${esc(acceptedTypes)}" tabindex="-1" multiple><span class="dropzone-icon">↑</span><span><strong>Arraste quantos arquivos precisar</strong><small>ou clique para selecionar vários de uma vez · imagens são otimizadas sem reduzir a resolução</small></span></div>
      <div class="document-file-selection hidden" data-file-selection><div class="selected-files-list" data-selected-files-list></div><div class="document-selected-actions"><button type="button" class="link-btn danger" data-clear-document-file>Remover todos</button></div></div>
      <div class="document-card-actions"><span class="muted">Confira as prévias e coloque os arquivos na fila segura.</span><button type="button" class="btn primary compact" data-upload-type="${esc(doc.id)}" disabled>Enviar em segundo plano</button></div>` : '<p class="notice warning">Seu perfil pode consultar este processo, mas não possui permissão para enviar documentos.</p>'}
    </form>`;
  }

  function renderDocumentGroups(groups = []) {
    if (!groups.length) return '';
    return `<div class="document-group-requirements">${groups.map(group => `<article class="document-group-requirement ${group.uploaded?'complete':'pending'}"><span class="group-requirement-light"></span><div><strong>${esc(group.name)} — ${group.uploaded?'concluída':'obrigatória'}</strong><p>${esc(group.description)}</p><small>${group.files ? `${group.files} arquivo(s) enviado(s).` : 'Ainda não há comprovante deste grupo.'}</small></div></article>`).join('')}</div>`;
  }

  function canRemoveUploadedDocument(doc) {
    if (!state.currentProcess?.capabilities?.upload || state.currentProcess?.workflow?.locked) return false;
    const sameUploader = String(doc.uploadedBy || '').localeCompare(
      String(state.bootstrap?.user?.name || ''), undefined, {sensitivity:'base'}
    ) === 0;
    return sameUploader || hasPermission('DOCUMENTO_EXCLUIR');
  }

  function renderUploadedDocuments(documents) {
    const ordered = [...(documents || [])].sort((a,b) => {
      const time = new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
      return time || Number(b.version || 0) - Number(a.version || 0) || String(a.fileName || '').localeCompare(String(b.fileName || ''));
    });
    if (!ordered.length) return '<div class="documents-empty"><strong>Nenhum documento enviado.</strong><span>Os arquivos enviados aparecerão aqui com nome, data, hora e usuário.</span></div>';
    const canDownload = Boolean(state.currentProcess?.capabilities?.download);
    const canCheck = Boolean(state.currentProcess?.capabilities?.checkDocument && state.currentProcess?.workflow?.actions?.reviewDocuments);
    return `<div class="uploaded-documents"><div class="uploaded-documents-title"><strong>Histórico de arquivos</strong><span>Mais recentes primeiro</span></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Documento</th><th>Arquivo</th><th>Conferência</th><th>Versão</th><th>Enviado por</th><th>Data e hora</th><th>Ações</th></tr></thead><tbody>${ordered.map(doc => { const pending=String(doc.mediaStatus||'').toUpperCase()==='UPLOAD_PENDING'; return `<tr data-document-row="${esc(doc.id)}"><td>${esc(doc.name)}</td><td><strong>${esc(doc.fileName)}</strong><br><small>${esc(fileSizeText(doc.size))}${pending?' · envio pendente':''}</small></td><td>${pending?'<span class="status-badge status-PENDENTE">ENVIO PENDENTE</span>':`<span class="status-badge status-${esc(doc.reviewStatus)}">${esc(statusText(doc.reviewStatus))}</span>${doc.reviewStatus==='CONFERIDO'?`<br><small class="inline-ok-proof">✓ OK por ${esc(doc.reviewedBy || 'responsável')}</small>`:''}${doc.pendingReason?`<br><small>${esc(doc.pendingReason)}</small>`:''}`}</td><td>v${esc(doc.version)}</td><td>${esc(doc.uploadedBy)}</td><td>${dateText(doc.createdAt)}</td><td><div class="table-actions">${canDownload&&!pending&&previewSupported(doc.mimeType)?`<button class="link-btn" data-preview-doc="${esc(doc.id)}">Prévia</button>`:''}${canDownload&&!pending?`<button class="link-btn" data-download-doc="${esc(doc.id)}">Baixar</button>`:''}${canRemoveUploadedDocument(doc)?`<button class="link-btn danger" data-delete-doc="${esc(doc.id)}">Remover</button>`:''}${canCheck&&!pending&&doc.reviewStatus!=='CONFERIDO'&&doc.reviewStatus!=='SUBSTITUIDO'?`<button class="btn success compact" data-check-document="${esc(doc.id)}">✓ OK documento</button><button class="link-btn danger" data-pend-document="${esc(doc.id)}">Pendenciar</button>`:''}</div></td></tr>`; }).join('')}</tbody></table></div>${canCheck?'<div class="uploaded-documents-footer"><button class="btn success compact" data-check-all-documents>✓ Dar OK nos documentos válidos</button></div>':''}</div>`;
  }

  function renderDocumentUploadStep(detail) {
    const required = detail.requiredDocuments.filter(doc => doc.required);
    const groups = (detail.documentGroups || []).filter(group => group.required);
    const requiredUnits = [...required, ...groups];
    const sent = requiredUnits.filter(item => item.uploaded).length;
    const readyForAnalysis = requiredUnits.length === sent;
    const missingNames = requiredUnits.filter(item => !item.uploaded).map(item => item.name);
    $('#document-upload-protocol').textContent = `PROTOCOLO ${detail.process.protocol}`;
    $('#document-upload-title').textContent = detail.process.clientName ? `Documentos de ${detail.process.clientName}` : 'Agora envie os documentos';
    $('#document-upload-content').innerHTML = `
      <div class="upload-progress"><div><strong>${sent} de ${requiredUnits.length} requisitos obrigatórios concluídos</strong><span>${readyForAnalysis ? 'Documentação obrigatória completa.' : 'Você pode concluir depois e continuar pelo processo.'}</span></div><progress value="${sent}" max="${Math.max(requiredUnits.length,1)}"></progress></div>
      ${renderDocumentGroups(detail.documentGroups)}
      <div class="document-upload-picker">${renderDocumentTypePicker(detail.requiredDocuments)}</div>
      <div class="document-requirements">${detail.requiredDocuments.map(doc => renderDocumentRequirement(doc, 'step')).join('')}</div>
      ${renderUploadedDocuments(detail.documents)}
      <section class="registration-finish-panel">
        <div><p class="eyebrow">ETAPA 3</p><h3>Como deseja finalizar este cadastro?</h3><p>Escolha se o processo deve seguir para análise agora ou permanecer na documentação para continuar depois.</p></div>
        <div class="registration-finish-options">
          <label><input type="radio" name="registrationFinishAction" value="later" checked><span><strong>Salvar e continuar depois</strong><small>O processo permanece pendente na fase de documentação.</small></span></label>
          <label class="${readyForAnalysis?'':'disabled'}"><input type="radio" name="registrationFinishAction" value="analysis" ${readyForAnalysis?'':'disabled'}><span><strong>Enviar para análise agora</strong><small>${readyForAnalysis?'Todos os documentos obrigatórios foram enviados.':`Ainda faltam: ${esc(missingNames.join(', '))}`}</small></span></label>
        </div>
        <div class="registration-finish-action"><button type="button" class="btn primary" data-finish-registration>Finalizar cadastro</button></div>
      </section>`;
  }

  async function openDocumentUploadStep(processId, protocol = '') {
    state.documentUploadProcessId = processId;
    $('#document-upload-protocol').textContent = protocol ? `PROTOCOLO ${protocol}` : 'PROCESSO CADASTRADO';
    $('#document-upload-title').textContent = 'Agora envie os documentos';
    $('#document-upload-content').innerHTML = '<div class="empty-state">Carregando documentos...</div>';
    openModal('document-upload-modal');
    try {
      const [base, documents] = await Promise.all([
        api('apiAbrirProcesso', state.token, processId),
        api('apiCarregarAbaProcesso', state.token, processId, 'DOCUMENTOS')
      ]);
      const detail = {...base, ...documents};
      state.currentProcess = detail;
      renderDocumentUploadStep(detail);
    } catch (error) {
      $('#document-upload-content').innerHTML = `<div class="empty-state">${esc(error.message)}</div>`;
      toast(error.message, 'error');
    }
  }

  async function finishDocumentRegistration(button, forcedAction = '') {
    const processId = state.documentUploadProcessId || state.currentProcess?.process?.id;
    if (!processId) return toast('Processo não localizado.', 'error');
    if (hasPendingUploads(processId)) return toast('Aguarde a fila terminar os envios antes de finalizar o cadastro.', 'error');
    const selected = forcedAction || $('input[name="registrationFinishAction"]:checked', $('#document-upload-modal'))?.value || 'later';
    setBusy(button, true, selected === 'analysis' ? 'Encaminhando...' : 'Finalizando...');
    try {
      if (selected === 'analysis') {
        openWorkflowAction('sendAdministrative');
        return;
      }
      closeModal();
      toast('Cadastro salvo. A documentação poderá ser concluída depois.', 'success');
      await loadProcesses('dashboard');
    } catch (error) {
      toast(error.message, 'error');
    } finally {
      if (button?.isConnected) setBusy(button, false);
    }
  }

  function renderActivityForm(detail = state.currentProcess) {
    if (!detail?.capabilities?.activity) return '';
    return `<div class="detail-actions" style="margin-bottom:14px"><label>Tipo<select id="activity-type"><option>Observação</option><option>Contato com cliente</option><option>Análise documental</option><option>Solicitação de documento</option><option>Decisão</option></select></label><label style="flex:1">Descrição<input id="activity-description" maxlength="5000" placeholder="Registre a atuação"></label><button class="btn secondary compact" data-add-activity>Registrar</button></div>`;
  }

  const renderActivity = activity => `<div class="activity"><strong>${esc(activity.type)}</strong><span>${esc(activity.description)}</span><small>${esc(activity.user)} · ${dateText(activity.createdAt)}</small></div>`;

  function renderPendingForm() {
    return `<div class="detail-actions" style="margin-bottom:14px"><label>Título<input id="pending-title" maxlength="200" placeholder="Pendência"></label><label style="flex:1">Descrição<input id="pending-description" maxlength="5000" placeholder="Detalhes"></label><label>Prazo<input id="pending-date" type="date"></label><button class="btn secondary compact" data-add-pending>Criar</button></div>`;
  }

  function renderPendingList(items) {
    if (!items.length) return '<p class="muted">Nenhuma pendência.</p>';
    return `<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Título</th><th>Responsável</th><th>Prazo</th><th>Status</th><th>Confirmação</th></tr></thead><tbody>${items.map(item => `<tr data-pending-row="${esc(item.id)}"><td><strong>${esc(item.title)}</strong><br><small>${esc(item.description)}</small></td><td>${esc(item.responsible)}</td><td>${esc(item.dueDate||'—')}</td><td>${esc(statusText(item.status))}</td><td>${item.status!=='CONCLUIDA'&&hasPermission('PENDENCIA_GERIR')?`<button class="btn success compact" data-complete-pending="${esc(item.id)}">✓ OK da pendência</button>`:`<span class="inline-ok-proof">✓ Resolvida${item.completedBy?` por ${esc(item.completedBy)}`:''}</span>`}</td></tr>`).join('')}</tbody></table></div>`;
  }

  function renderAudit(items, detail = state.currentProcess) {
    if (!items.length) return '<p class="muted">Auditoria não disponível para este perfil.</p>';
    return `<div class="audit-table data-table-wrap"><table class="data-table"><thead><tr><th>Data/hora</th><th>Usuário e perfil</th><th>Ação</th><th>Contexto técnico</th><th>Detalhes</th><th>Hash</th></tr></thead><tbody>${items.map(item => `<tr><td>${dateText(item.at)}<br><small>${esc(item.timezone||'—')}</small></td><td>${esc(item.user)}<br><small>${esc(roleText(item.role)||'—')} · sessão ${esc(String(item.sessionId||'').slice(0,10)||'—')}</small></td><td>${esc(statusText(item.action))}</td><td><small>IP: ${esc(item.ipPublic||'indisponível')}<br>${esc(item.device?.platform||'')} · ${esc(String(item.device?.userAgent||'').slice(0,90))}${item.location?.latitude?`<br>Localização autorizada: ${esc(item.location.latitude)}, ${esc(item.location.longitude)}`:''}</small></td><td>${esc(JSON.stringify(item.details))}</td><td title="${esc(item.hash)}">${esc(String(item.hash).slice(0,12))}…</td></tr>`).join('')}</tbody></table></div>${detail?.auditHasMore?`<div class="audit-load-more"><button type="button" class="btn secondary compact" data-load-more-audit>Carregar mais registros</button><small>${esc(items.length)} de ${esc(detail.auditTotal || items.length)} exibidos</small></div>`:''}`;
  }

  async function loadMoreProcessAudit(button) {
    const processId = state.currentProcess?.process?.id;
    if (!processId) return;
    setBusy(button, true, 'Carregando...');
    try {
      const payload = await api('apiCarregarMaisAuditoriaProcesso', state.token, processId, (state.currentProcess.audit || []).length, 60);
      if (state.currentProcess?.process?.id !== processId) return;
      state.currentProcess.audit = [...(state.currentProcess.audit || []), ...(payload.audit || [])];
      state.currentProcess.auditTotal = Number(payload.auditTotal || state.currentProcess.audit.length);
      state.currentProcess.auditHasMore = Boolean(payload.auditHasMore);
      renderProcessPane('audit', state.currentProcess);

  async function syncProcessAfterMutation(tabs = [state.processDetailTab]) {
    const processId = state.currentProcess?.process?.id;
    if (!processId) return;
    const invalidated = [...new Set((Array.isArray(tabs) ? tabs : [tabs]).map(normalizeProcessTab))];
    const run = async () => {
      const activeTab = state.processDetailTab;
      const reloadActiveTab = invalidated.includes(activeTab);
      const [base, tabPayload] = await Promise.all([
        api('apiAbrirProcesso', state.token, processId),
        reloadActiveTab
          ? api('apiCarregarAbaProcesso', state.token, processId, processTabApiKey(activeTab))
          : Promise.resolve(null)
      ]);
      if (state.currentProcess?.process?.id !== processId) return;
      const previous = state.currentProcess;
      const previousCategories = previous.workflow?.categories || [];
      setProcessShellCache(processId, base);
      state.currentProcess = {
        ...previous,
        ...base,
        workflow: {
          ...(previous.workflow || {}),
          ...(base.workflow || {}),
          categories: previousCategories
        },
        commercial: previous.commercial || {}
      };
      invalidateProcessTabCache(processId, invalidated);
      invalidated.forEach(tab => state.processLoadedTabs.delete(tab));
      if (tabPayload) {
        setProcessTabCache(processId, activeTab, tabPayload);
        state.currentProcess = mergeProcessTab(state.currentProcess, activeTab, tabPayload);
      }
      $('#detail-protocol').textContent = `PROTOCOLO ${state.currentProcess.process.protocol}`;
      $('#detail-title').textContent = state.currentProcess.process.clientName || 'Detalhes do processo';
      $('#detail-action-header').innerHTML = renderProcessActionHeader(state.currentProcess);
      if (tabPayload) renderProcessPane(activeTab, state.currentProcess);
      scheduleProcessListRefresh();
    };
    const queued = state.processSyncPromise ? state.processSyncPromise.then(run, run) : run();
    const finalPromise = queued.finally(() => {
      if (state.processSyncPromise === finalPromise) state.processSyncPromise = null;
    });
    state.processSyncPromise = finalPromise;
    return finalPromise;
  }

  async function refreshDetail(tabs = [state.processDetailTab]) {

  }
