  async function decodeImageForOptimization(file) {
    if (globalThis.createImageBitmap) {
      const bitmap = await createImageBitmap(file, {imageOrientation:'from-image'});
      return {
        width:bitmap.width,
        height:bitmap.height,
        draw(context) { context.drawImage(bitmap, 0, 0); },
        close() { try { bitmap.close(); } catch (ignore) {} }
      };
    }
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.decoding = 'async';
    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(new Error('A imagem não pôde ser decodificada.'));
      image.src = url;
    });
    return {
      width:image.naturalWidth,
      height:image.naturalHeight,
      draw(context) { context.drawImage(image, 0, 0); },
      close() { revokeObjectUrl(url); }
    };
  }

  async function optimizeDocumentImage(file) {
    const originalType = String(file.type || '').toLowerCase();
    const result = {
      file,
      originalName:file.name,
      originalSize:file.size,
      optimized:false,
      savedPercent:0
    };
    if (!['image/jpeg','image/png'].includes(originalType) || file.size < 256 * 1024 || file.size > 30 * 1024 * 1024) {
      return result;
    }
    let decoded;
    try {
      decoded = await decodeImageForOptimization(file);
      if (!decoded.width || !decoded.height || decoded.width * decoded.height > 50_000_000) return result;
      const canvas = document.createElement('canvas');
      canvas.width = decoded.width;
      canvas.height = decoded.height;
      const context = canvas.getContext('2d', {alpha:originalType === 'image/png'});
      if (!context) return result;
      decoded.draw(context);
      const formats = originalType === 'image/png'
        ? [{type:'image/webp', quality:1, minimumSaving:0.15}]
        : [
            {type:'image/avif', quality:0.94, minimumSaving:0.12},
            {type:'image/webp', quality:0.95, minimumSaving:0.12}
          ];
      const candidates = [];
      for (const format of formats) {
        let supported = state.imageEncoderSupport.get(format.type);
        if (supported === false) continue;
        const blob = await canvasToBlob(canvas, format.type, format.quality);
        supported = Boolean(blob && blob.type === format.type && blob.size);
        state.imageEncoderSupport.set(format.type, supported);
        if (supported && blob.size <= file.size * (1 - format.minimumSaving)) {
          candidates.push({blob, type:format.type});
        }
      }
      const best = candidates.sort((a, b) => a.blob.size - b.blob.size)[0];
      if (!best || typeof File !== 'function') return result;
      const optimized = new File([best.blob], optimizedImageName(file.name, best.type), {
        type:best.type,
        lastModified:file.lastModified || Date.now()
      });
      return {
        file:optimized,
        originalName:file.name,
        originalSize:file.size,
        optimized:true,
        savedPercent:Math.max(1, Math.round((1 - optimized.size / file.size) * 100)),
        width:decoded.width,
        height:decoded.height
      };
    } catch (error) {
      return result;
    } finally {
      decoded?.close();
    }
  }

  async function prepareDocumentFiles(files) {
    const source = Array.from(files).slice(0, 50);
    if (mediaCloudEnabled()) {
      return source.map(file => ({
        file,
        originalName:file.name,
        originalSize:file.size,
        optimized:false,
        savedPercent:0
      }));
    }
    const output = new Array(source.length);
    let cursor = 0;
    const worker = async () => {
      while (cursor < source.length) {
        const index = cursor++;
        output[index] = await optimizeDocumentImage(source[index]);
      }
    };
    await Promise.all(Array.from({length:Math.min(2, source.length)}, () => worker()));
    return output;
  }

  async function hasPdfSignature(file) {
    try {
      const head = new Uint8Array(await file.slice(0, 1024).arrayBuffer());
      let signature = '';
      for (let index = 0; index < head.length; index += 1) signature += String.fromCharCode(head[index]);
      return signature.includes('%PDF-');
    } catch (error) {
      return false;
    }
  }

  async function selectDocumentFiles(form, files, fromDrop = false) {
    if (!form || !files?.length) return;
    const maxMb = Number(form.dataset.maxMb || 0);
    const maxBytes = maxMb * 1024 * 1024;
    const allowed = String(form.dataset.mimeTypes || '').split(',').map(item => item.trim().toLowerCase()).filter(Boolean);
    const key = documentFileKey(form);
    const selected = state.pendingDocumentFiles.get(key) || [];
    const known = new Set(selected.map(item => `${item.originalName || item.file.name}|${item.originalSize || item.file.size}|${item.file.lastModified}`));
    let rejected = 0;
    let safetyHeld = 0;
    form.classList.add('optimizing-images');
    const prepared = await prepareDocumentFiles(files);
    form.classList.remove('optimizing-images');
    for (const preparedFile of prepared) {
      const file = preparedFile.file;
      const mimeType = String(file.type || '').toLowerCase();
      const signature = `${preparedFile.originalName}|${preparedFile.originalSize}|${file.lastModified}`;
      const isPdf = mimeType === 'application/pdf';
      const configuredLimitMb = mediaLargeUploadConfigured()
        ? cloudUploadLimitMb(mimeType, maxMb)
        : isPdf
          ? Math.min(maxMb || 6, Number(state.bootstrap?.config?.MAX_PDF_SIZE_MB || 6), 6)
          : Math.min(maxMb || 6, 6);
      const effectiveMaxBytes = configuredLimitMb ? configuredLimitMb * 1024 * 1024 : maxBytes;
      const invalidPdf = isPdf && (
        !/\.pdf$/i.test(String(file.name || '')) ||
        String(file.name || '').length > 200 ||
        !(await hasPdfSignature(file))
      );
      if (file.size > 6 * 1024 * 1024 && mediaCloudEnabled() && !mediaLargeUploadConfigured()) {
        rejected += 1;
        safetyHeld += 1;
        continue;
      }
      if (!file.size || invalidPdf || (allowed.length && !allowed.includes(mimeType)) ||
          (effectiveMaxBytes && file.size > effectiveMaxBytes) || known.has(signature)) {
        rejected += 1;
        continue;
      }
      known.add(signature);
      selected.push({
        id:requestId(),
        file,
        url:URL.createObjectURL(file),
        mimeType,
        documentName:$('.document-card-head strong', form)?.textContent || '',
        originalName:preparedFile.originalName,
        originalSize:preparedFile.originalSize,
        optimized:preparedFile.optimized,
        savedPercent:preparedFile.savedPercent,
        width:preparedFile.width,
        height:preparedFile.height,
        requiresOptimization:isPdf && mediaLargeUploadConfigured() && file.size > 25 * 1024 * 1024
      });
    }
    if (!selected.length) return toast(safetyHeld
      ? 'Uploads acima de 6 MB estão temporariamente bloqueados até a cópia automática no Google Drive ser validada. Nenhum arquivo foi alterado.'
      : 'Nenhum arquivo válido foi selecionado. O PDF precisa ter extensão .pdf, MIME correto, assinatura válida e respeitar o limite.', 'error');
    state.pendingDocumentFiles.set(key, selected);
    const input = formControl(form, 'file');
    if (input) input.value = '';
    renderSelectedDocumentFiles(form);
    if (safetyHeld) toast(`${safetyHeld} arquivo(s) acima de 6 MB não foram enviados: a cópia automática no Google Drive ainda não está validada.`, 'error');
    else if (rejected) toast(`${rejected} arquivo(s) ignorado(s) por formato, tamanho ou duplicidade.`, 'error');
    else if (fromDrop || files.length > 1) toast(`${prepared.length} arquivo(s) adicionados para conferência.`, 'success');
  }

  function renderSelectedDocumentFiles(form) {
    const key = documentFileKey(form);
    const items = state.pendingDocumentFiles.get(key) || [];
    const selection = $('[data-file-selection]', form);
    const list = $('[data-selected-files-list]', form);
    if (!items.length) return clearDocumentFile(form);
    list.innerHTML = items.map(item => `<article class="selected-file-row">
      <div class="document-local-thumb">${item.mimeType.startsWith('image/') ? `<img src="${esc(item.url)}" alt="Prévia de ${esc(item.file.name)}">` : '<span class="pdf-thumb">PDF</span>'}</div>
      <div class="document-selected-info"><strong>${esc(item.file.name)}</strong><small>${esc(fileSizeText(item.file.size))} · ${item.mimeType === 'application/pdf' ? 'PDF' : 'Imagem'}${item.optimized?` · otimizada ${esc(item.savedPercent)}% sem reduzir ${esc(item.width)}×${esc(item.height)}`:''}${item.requiresOptimization?' · original preservado; cópia leve será gerada em segundo plano':''} · aguardando envio</small></div>
      <div class="document-selected-actions">${previewSupported(item.mimeType)?`<button type="button" class="link-btn" data-preview-local="${esc(key)}" data-preview-file-id="${esc(item.id)}">Ver prévia</button>`:'<span class="muted">Prévia desativada</span>'}<button type="button" class="link-btn danger" data-remove-selected-file="${esc(item.id)}">Remover</button></div>
    </article>`).join('');
    selection.classList.remove('hidden');
    const upload = $('[data-upload-type]', form);
    if (upload) {
      upload.disabled = false;
      upload.textContent = `Enviar ${items.length} arquivo(s) em segundo plano`;
    }
  }

  function removeSelectedDocumentFile(form, fileId) {
    const key = documentFileKey(form);
    const items = state.pendingDocumentFiles.get(key) || [];
    const removed = items.find(item => item.id === fileId);
    if (removed) revokeObjectUrl(removed.url);
    const next = items.filter(item => item.id !== fileId);
    if (next.length) {
      state.pendingDocumentFiles.set(key, next);
      renderSelectedDocumentFiles(form);
    } else clearDocumentFile(form);
  }

  function blobUrlFromBase64(base64, mimeType) {
    return URL.createObjectURL(new Blob([base64ToBytes(base64)], {type:mimeType}));
  }

  function base64ToBytes(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function documentCacheIdentity(id, override = {}) {
    const metadata = state.currentProcess?.documents?.find(doc => doc.id === id) || {};
    return [
      String(id),
      String(override.hash || metadata.hash || 'sem-hash'),
      Number(override.version || metadata.version || 1),
      Number(override.recordVersion || metadata.recordVersion || 1)
    ].join('|');
  }

  async function sha256Hex(bytes) {
    if (!globalThis.crypto?.subtle) return '';
    const source = bytes instanceof ArrayBuffer
      ? bytes
      : bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
    const digest = await crypto.subtle.digest('SHA-256', source);
    return Array.from(new Uint8Array(digest), value => value.toString(16).padStart(2, '0')).join('');
  }

  async function sha256FileInWorker(file) {
    if (!globalThis.Worker || !globalThis.Blob || !globalThis.URL?.createObjectURL) {
      return sha256Hex(new Uint8Array(await file.arrayBuffer()));
    }
    const workerSource = `self.onmessage=async(e)=>{try{const b=await e.data.arrayBuffer();const d=await crypto.subtle.digest('SHA-256',b);const h=Array.from(new Uint8Array(d),v=>v.toString(16).padStart(2,'0')).join('');self.postMessage({ok:true,hash:h});}catch(error){self.postMessage({ok:false,message:error&&error.message||'HASH_FAILED'});}};`;
    const workerUrl = URL.createObjectURL(new Blob([workerSource], {type:'text/javascript'}));
    try {
      return await new Promise((resolve,reject)=>{
        const worker = new Worker(workerUrl);
        const timer = setTimeout(()=>{worker.terminate();reject(new Error('O cálculo de integridade demorou além do limite seguro.'));},120000);
        worker.onmessage=event=>{clearTimeout(timer);worker.terminate();event.data?.ok?resolve(event.data.hash):reject(new Error(event.data?.message||'Falha no cálculo de integridade.'));};
        worker.onerror=event=>{clearTimeout(timer);worker.terminate();reject(new Error(event.message||'Falha no cálculo de integridade.'));};
        worker.postMessage(file);
      });
    } catch (error) {
      if (Number(file.size || 0) > 25 * 1024 * 1024) throw new Error('Este navegador não conseguiu validar o arquivo pesado em segundo plano. Atualize o navegador e tente novamente.');
      return sha256Hex(new Uint8Array(await file.arrayBuffer()));
    } finally {
      URL.revokeObjectURL(workerUrl);
    }
  }

  async function documentFromCache(id, identity) {
    const cached = await browserCacheGet('document', identity);
    if (!cached?.blob) return null;
    try {
      const buffer = await cached.blob.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      if (cached.hash && globalThis.crypto?.subtle) {
        const actual = await sha256Hex(bytes);
        if (actual && actual !== String(cached.hash).toLowerCase()) {
          await browserCacheDelete('document', identity);
          return null;
        }
      }
      return {
        fileName:cached.fileName,
        mimeType:cached.mimeType,
        size:cached.size,
        hash:cached.hash,
        bytes,
        fromCache:true
      };
    } catch (error) {
      await browserCacheDelete('document', identity);
      return null;
    }
  }

  function auditCachedDocumentAccess(id, usage) {
    void api('apiRegistrarAcessoDocumentoCache', state.token, id, usage || 'PREVIEW', state.context).catch(() => {});
  }

  function cloudDocumentMetadata(id) {
    const metadata = state.currentProcess?.documents?.find(doc => doc.id === id) || null;
    return mediaCloudEnabled() && metadata?.mediaStatus === 'READY' ? metadata : null;
  }

  function cloudThumbnailMetadata(id) {
    const metadata = cloudDocumentMetadata(id);
    return metadata && String(metadata.thumbnailStatus || '').toUpperCase() === 'READY' ? metadata : null;
  }

  function cloudPreviewCircuitOpen() {
    return Number(state.cloudPreviewCircuitUntil || 0) > Date.now();
  }

  function cloudPreviewSucceeded() {
    state.cloudPreviewFailures = 0;
    state.cloudPreviewCircuitUntil = 0;
  }

  function cloudPreviewFailed(error) {
    const code = String(error?.code || '').toUpperCase();
    // Ausência de uma derivação é um estado do documento, não uma queda do
    // serviço. Falhas de rede/servidor abrem um circuito curto para que os
    // próximos cartões usem o Drive sem repetir timeouts em cascata.
    if (['MEDIA_NOT_READY','NOT_FOUND'].includes(code)) return;
    state.cloudPreviewFailures = Number(state.cloudPreviewFailures || 0) + 1;
    if (state.cloudPreviewFailures >= 1) {
      state.cloudPreviewCircuitUntil = Date.now() + CLOUD_PREVIEW_CIRCUIT_MS;
    }
  }

  async function fetchCloudStoredDocument(id, onProgress, usage = 'PREVIEW') {
    const metadata = cloudDocumentMetadata(id);
    if (!metadata || cloudPreviewCircuitOpen()) return null;
    const access = await requestCloudAccess(id, usage, 'document', CLOUD_DOCUMENT_TIMEOUT_MS);
    const response = await fetch(access.accessUrl, {cache:'no-store', credentials:'omit'});
    if (!response.ok || !response.body) throw new Error('A nuvem documental não liberou o arquivo.');
    const expectedSize = Number(access.size || metadata.size || response.headers.get('content-length') || 0);
    const cloudSourceLimit = String(access.mimeType || metadata.mimeType || '').toLowerCase() === 'application/pdf'
      ? Number(state.bootstrap?.config?.MEDIA_MAX_PDF_SOURCE_MB || 100) * 1024 * 1024
      : Number(state.bootstrap?.config?.MEDIA_MAX_UPLOAD_MB || 25) * 1024 * 1024;
    if (!expectedSize || expectedSize > cloudSourceLimit) throw new Error('O tamanho do documento na nuvem é inválido.');
    const chunks = [];
    const reader = response.body.getReader();
    let completed = 0;
    while (true) {
      const part = await reader.read();
      if (part.done) break;
      completed += part.value.byteLength;
      if (completed > cloudSourceLimit) {
        await reader.cancel();
        throw new Error('O documento ultrapassa o limite seguro configurado.');
      }
      chunks.push(part.value);
      if (onProgress) onProgress(completed, expectedSize, false);
    }
    if (completed !== expectedSize) throw new Error('O tamanho recebido da nuvem não confere.');
    const bytes = new Uint8Array(completed);
    let offset = 0;
    chunks.forEach(chunk => {
      bytes.set(chunk, offset);
      offset += chunk.byteLength;
    });
    if (access.sha256 && globalThis.crypto?.subtle) {
      const actual = await sha256Hex(bytes);
      if (actual && actual !== String(access.sha256).toLowerCase()) {
        throw new Error('A integridade do documento recebido da nuvem não confere.');
      }
    }
    const file = {
      fileName:metadata.fileName || 'documento',
      mimeType:access.mimeType || metadata.mimeType,
      size:completed,
      hash:access.sha256 || metadata.hash || '',
      version:metadata.mediaVersion || metadata.version || 1,
      bytes,
      fromCloud:true
    };
    await browserCachePut('document', documentCacheIdentity(id), new Blob([bytes], {type:file.mimeType}), file);
    cloudPreviewSucceeded();
    if (onProgress) onProgress(expectedSize, expectedSize, false);
    return file;
  }

  async function fetchStoredDocument(id, onProgress, usage = 'PREVIEW', options = {}) {
    const identity = documentCacheIdentity(id);
    const cached = await documentFromCache(id, identity);
    if (cached) {
      if (onProgress) onProgress(1, 1, true);
      auditCachedDocumentAccess(id, usage);
      return cached;
    }
    if (state.documentFetches.has(identity)) {
      const shared = await state.documentFetches.get(identity);
      if (String(usage).toUpperCase() === 'DOWNLOAD') auditCachedDocumentAccess(id, 'DOWNLOAD');
      return {...shared, bytes:shared.bytes.slice()};
    }
    const operation = (async () => {
      let cloudError = null;
      if (!options.skipCloud) {
        try {
          const cloud = await fetchCloudStoredDocument(id, onProgress, usage);
          if (cloud) return cloud;
        } catch (error) {
          cloudError = error;
          cloudPreviewFailed(error);
        }
      }
      let manifest;
      try {
        manifest = await api('apiPrepararDocumento', state.token, id, state.context);
      } catch (driveError) {
        if (cloudError) {
          const fallbackError = new Error(`A nuvem rápida oscilou e a cópia do Drive também não pôde ser lida. ${driveError.message || ''}`.trim());
          fallbackError.code = driveError.code || cloudError.code || 'DOCUMENT_FILE_UNAVAILABLE';
          throw fallbackError;
        }
        throw driveError;
      }
      const manifestIdentity = documentCacheIdentity(id, manifest);
      if (manifestIdentity !== identity) {
        const manifestCached = await documentFromCache(id, manifestIdentity);
        if (manifestCached) {
          if (onProgress) onProgress(1, 1, true);
          return manifestCached;
        }
      }
      const total = Number(manifest.totalChunks || 0);
      const expectedSize = Number(manifest.size || 0);
      if (!total || !expectedSize) throw new Error('O arquivo está vazio ou não pôde ser preparado.');
      const chunks = new Array(total);
      let cursor = 0;
      let completed = 0;
      const worker = async () => {
        while (cursor < total) {
          const index = cursor++;
          const part = await api('apiLerChunkDocumento', state.token, id, index, state.context);
          if (Number(part.index) !== index || Number(part.totalChunks) !== total || Number(part.size) !== expectedSize) {
            throw new Error('A transferência do documento ficou inconsistente. Tente novamente.');
          }
          chunks[index] = base64ToBytes(part.base64);
          completed += 1;
          if (onProgress) onProgress(completed, total, false);
        }
      };
      await Promise.all(Array.from({length:Math.min(2, total)}, () => worker()));
      const bytes = new Uint8Array(expectedSize);
      let offset = 0;
      chunks.forEach(chunk => {
        if (!chunk) throw new Error('Um bloco do documento não foi recebido.');
        bytes.set(chunk, offset);
        offset += chunk.length;
      });
      if (offset !== expectedSize) throw new Error('O tamanho recebido não confere com o arquivo armazenado.');
      if (manifest.hash && globalThis.crypto?.subtle) {
        const actual = await sha256Hex(bytes);
        if (actual && actual !== String(manifest.hash).toLowerCase()) {
          throw new Error('A integridade do documento recebido não confere com o arquivo original.');
        }
      }
      const blob = new Blob([bytes], {type:manifest.mimeType});
      await browserCachePut('document', manifestIdentity, blob, manifest);
      return {...manifest, bytes, fromCache:false};
    })();
    state.documentFetches.set(identity, operation);
    try {
      const result = await operation;
      if (String(usage).toUpperCase() === 'DOWNLOAD') auditCachedDocumentAccess(id, 'DOWNLOAD');
      return result;
    }
    finally {
      if (state.documentFetches.get(identity) === operation) state.documentFetches.delete(identity);
    }
  }

  async function loadPdfJs() {
    if (state.pdfJs) return state.pdfJs;
    if (state.pdfJsPromise) return state.pdfJsPromise;
    const moduleUrl = ['https:', '', 'cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.min.mjs'].join('/');
    const workerUrl = moduleUrl.replace('/pdf.min.mjs', '/pdf.worker.min.mjs');
    state.pdfJsPromise = import(moduleUrl).then(async library => {
      // Workers ES module não podem ser iniciados diretamente de outra origem
      // em todos os navegadores/sandboxes do Apps Script. Um Blob local mantém o
      // worker na mesma origem do iframe e elimina a falha silenciosa do PDF.js.
      if (!state.pdfWorkerObjectUrl) {
        try {
          const response = await fetch(workerUrl, {cache:'force-cache'});
          if (!response.ok) throw new Error(`Worker PDF indisponível (${response.status}).`);
          const source = await response.text();
          state.pdfWorkerObjectUrl = URL.createObjectURL(new Blob([source], {type:'text/javascript'}));
        } catch (ignoreWorkerFetch) {
          state.pdfWorkerObjectUrl = workerUrl;
        }
      }
      library.GlobalWorkerOptions.workerSrc = state.pdfWorkerObjectUrl;
      state.pdfJs = library;
      return library;
    }).finally(() => { state.pdfJsPromise = null; });
    return state.pdfJsPromise;
  }

  async function renderPdfPage() {
    if (!state.pdfDocument) return;
    const stage = $('#preview-content');
    const pageNumber = Math.min(Math.max(state.pdfPage, 1), state.pdfDocument.numPages);
    state.pdfPage = pageNumber;
    $('#pdf-current-page').textContent = String(pageNumber);
    $('#pdf-total-pages').textContent = String(state.pdfDocument.numPages);
    $('#pdf-zoom-label').textContent = `${Math.round(state.pdfScale * 100)}%`;
    $('[data-pdf-previous]').disabled = pageNumber <= 1;
    $('[data-pdf-next]').disabled = pageNumber >= state.pdfDocument.numPages;
    const page = await state.pdfDocument.getPage(pageNumber);
    const viewport = page.getViewport({scale:state.pdfScale, rotation:(Number(page.rotate || 0) + state.previewRotation + 360) % 360});
    const outputScale = Math.min(window.devicePixelRatio || 1, 2);
    const canvas = document.createElement('canvas');
    canvas.className = 'pdf-page-canvas';
    canvas.width = Math.floor(viewport.width * outputScale);
    canvas.height = Math.floor(viewport.height * outputScale);
    canvas.style.width = `${Math.floor(viewport.width)}px`;
    canvas.style.height = `${Math.floor(viewport.height)}px`;
    stage.replaceChildren(canvas);
    const context = canvas.getContext('2d', {alpha:false});
    state.pdfRenderTask = page.render({
      canvasContext: context,
      viewport,
      transform: outputScale === 1 ? null : [outputScale, 0, 0, outputScale, 0, 0]
    });
    try { await state.pdfRenderTask.promise; }
    catch (error) { if (error?.name !== 'RenderingCancelledException') throw error; }
    finally { state.pdfRenderTask = null; }
  }

  function renderPdfFailure(error) {
    $('#pdf-preview-controls').classList.add('hidden');
    if (state.previewFallbackIsImage && state.previewObjectUrl) {
      $('#preview-content').innerHTML = `<div class="pdf-fallback-preview"><img src="${esc(state.previewObjectUrl)}" alt="Primeira página do PDF"><div class="pdf-preview-fallback-note"><strong>Prévia simplificada disponível</strong><span>O visualizador completo não respondeu. A primeira página foi carregada pelo Drive; use “Baixar” para consultar todas as páginas.</span></div></div>`;
      return;
    }
    $('#preview-content').innerHTML = `<div class="pdf-preview-error"><strong>Não foi possível desenhar este PDF.</strong><p>${esc(error?.message || 'O arquivo pode estar corrompido ou protegido.')}</p><span>Você ainda pode usar o botão “Baixar” para abrir o documento fora do sistema.</span></div>`;
  }

  function setPreviewObjectUrl(url, owned = false, fallbackIsImage = false) {
    if (state.previewObjectUrlOwned && state.previewObjectUrl && state.previewObjectUrl !== url) revokeObjectUrl(state.previewObjectUrl);
    state.previewObjectUrl = url || '';
    state.previewObjectUrlOwned = Boolean(owned && url);
    state.previewFallbackIsImage = Boolean(fallbackIsImage && url);
    $('#preview-open-tab-btn')?.classList.toggle('hidden', !state.previewObjectUrl || state.previewFallbackIsImage);
  }

  function previewMetadataHtml(options) {
    return `<span><strong>Documento</strong>${esc(options.documentName || options.fileName || '—')}</span><span><strong>Arquivo</strong>${esc(options.fileName || '—')}</span><span><strong>Data e hora</strong>${esc(options.createdAt ? dateText(options.createdAt) : 'Antes do envio')}</span><span><strong>Usuário</strong>${esc(options.uploadedBy || state.bootstrap?.user?.name || 'Usuário atual')}</span>`;
  }

  function preparePreviewShell(options) {
    resetPreviewState();
    const loadToken = state.previewLoadToken;
    state.previewReturnModal = options.returnModal || activeModalId();
    state.previewReturnFocus = options.returnFocus || document.activeElement;
    setPreviewObjectUrl(options.url || '', options.owned, options.fallbackIsImage);
    state.previewDocumentId = options.documentId || '';
    $('#preview-title').textContent = options.fileName || 'Documento';
    $('#preview-metadata').innerHTML = previewMetadataHtml(options);
    const download = $('#preview-download-btn');
    download.classList.toggle('hidden', !state.previewDocumentId);
    openModal('preview-modal');
    $('#pdf-preview-controls').classList.add('hidden');
    if (state.previewFallbackIsImage && state.previewObjectUrl) {
      $('#preview-content').innerHTML = `<div class="pdf-fallback-preview loading"><img src="${esc(state.previewObjectUrl)}" alt="Prévia rápida de ${esc(options.fileName)}"><div class="pdf-preview-fallback-note"><span>Carregando visualização completa…</span></div></div>`;
    } else {
      $('#preview-content').innerHTML = '<div class="pdf-preview-loading"><span class="spinner"></span><strong>Preparando prévia segura...</strong></div>';
    }
    return loadToken;
  }

  async function loadPdfBytes(bytes, loadToken) {
    if (loadToken !== state.previewLoadToken) return;
    $('#pdf-preview-controls').classList.remove('hidden');
    if (!(state.previewFallbackIsImage && state.previewObjectUrl)) {
      $('#preview-content').innerHTML = '<div class="pdf-preview-loading"><span class="spinner"></span><strong>Preparando páginas do PDF...</strong></div>';
    }
    const pdfjs = await loadPdfJs();
    if (loadToken !== state.previewLoadToken) return;
    const pdfAssetBase = ['https:', '', 'cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284'].join('/');
    state.pdfDocument = await pdfjs.getDocument({
      data: bytes,
      cMapUrl: pdfAssetBase + '/cmaps/',
      cMapPacked: true,
      standardFontDataUrl: pdfAssetBase + '/standard_fonts/',
      wasmUrl: pdfAssetBase + '/wasm/'
    }).promise;
    if (loadToken !== state.previewLoadToken) {
      try { void state.pdfDocument.destroy(); } catch (ignore) {}
      state.pdfDocument = null;
      return;
    }
    await renderPdfPage();
  }

  async function loadPdfUrl(url, loadToken) {
    if (loadToken !== state.previewLoadToken) return;
    $('#pdf-preview-controls').classList.remove('hidden');
    const pdfjs = await loadPdfJs();
    if (loadToken !== state.previewLoadToken) return;
    const pdfAssetBase = ['https:', '', 'cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284'].join('/');
    state.pdfDocument = await pdfjs.getDocument({
      url,
      rangeChunkSize:64 * 1024,
      disableRange:false,
      disableStream:false,
      disableAutoFetch:false,
      cMapUrl:pdfAssetBase + '/cmaps/',
      cMapPacked:true,
      standardFontDataUrl:pdfAssetBase + '/standard_fonts/',
      wasmUrl:pdfAssetBase + '/wasm/'
    }).promise;
    if (loadToken !== state.previewLoadToken) {
      try { void state.pdfDocument.destroy(); } catch (ignore) {}
      state.pdfDocument = null;
      return;
    }
    await renderPdfPage();
  }

  async function openPreviewDocument(options) {
    const loadToken = preparePreviewShell(options);
    if (String(options.mimeType).startsWith('image/')) {
      $('#preview-content').innerHTML = `<img class="rotatable-preview-image" src="${esc(options.url)}" alt="Prévia de ${esc(options.fileName)}" style="transform:rotate(${state.previewRotation}deg)">`;
      return;
    }
    try {
      const bytes = options.bytes || new Uint8Array(await options.file.arrayBuffer());
      await loadPdfBytes(bytes, loadToken);
    } catch (error) {
      if (loadToken === state.previewLoadToken) renderPdfFailure(error);
    }
  }

  async function previewLocalDocument(key, fileId = '') {
    const items = state.pendingDocumentFiles.get(key) || [];
    const item = items.find(candidate => candidate.id === fileId) || items[0];
    if (!item) return toast('Selecione o arquivo novamente para visualizar a prévia.', 'error');
    if (!previewSupported(item.mimeType)) return toast('A pré-visualização de PDF está temporariamente desativada.', 'error');
    const previewUrl = URL.createObjectURL(item.file);
    await openPreviewDocument({url:previewUrl, owned:true, file:item.file, mimeType:item.mimeType, fileName:item.file.name, documentName:item.documentName, uploadedBy:state.bootstrap?.user?.name, returnModal:activeModalId()});
  }

  async function previewStoredDocument(id, button) {
    const returnModal = activeModalId();
    const metadata = state.currentProcess?.documents?.find(doc => doc.id === id) || {};
    if (!previewSupported(metadata.mimeType)) return toast('A pré-visualização deste PDF está temporariamente desativada.', 'error');
    const loadToken = preparePreviewShell({
      mimeType: metadata.mimeType,
      fileName: metadata.fileName || 'Documento',
      documentName: metadata.name,
      uploadedBy: metadata.uploadedBy,
      createdAt: metadata.createdAt,
      documentId: id,
      returnModal,
      returnFocus: button
    });
    const busyButton = button instanceof HTMLButtonElement ? button : null;
    const busyMedia = button?.classList?.contains('visual-doc-media') ? button : null;
    setBusy(busyButton, true, 'Abrindo...');
    if (busyMedia) {
      busyMedia.classList.add('preview-opening');
      busyMedia.setAttribute('aria-busy', 'true');
    }
    let fullFileReady = false;
    try {
      void (async () => {
        try {
        const thumbnail = await getVisualThumbnail(id);
        if (loadToken !== state.previewLoadToken || fullFileReady) return;
        if (thumbnail.available && thumbnail.blob) {
          const thumbnailUrl = URL.createObjectURL(thumbnail.blob);
          setPreviewObjectUrl(thumbnailUrl, true, true);
          $('#preview-content').innerHTML = `<div class="pdf-fallback-preview loading"><img src="${esc(thumbnailUrl)}" alt="Prévia rápida de ${esc(metadata.fileName || thumbnail.fileName)}"><div class="pdf-preview-fallback-note"><span>Miniatura carregada. Preparando arquivo completo…</span></div></div>`;
        }
        } catch (ignoreThumbnail) {}
      })();

      let cloudAttempted = false;
      if (cloudDocumentMetadata(id) && !cloudPreviewCircuitOpen()) {
        cloudAttempted = true;
        try {
          const access = await requestCloudAccess(id, 'VIEW', 'document', CLOUD_DOCUMENT_TIMEOUT_MS);
          if (loadToken !== state.previewLoadToken) return;
          setPreviewObjectUrl(access.accessUrl, false, false);
          if (String(access.mimeType || metadata.mimeType || '').startsWith('image/')) {
            $('#preview-content').innerHTML = `<img class="rotatable-preview-image" src="${esc(access.accessUrl)}" alt="Prévia de ${esc(metadata.fileName || 'documento')}" style="transform:rotate(${state.previewRotation}deg)">`;
          } else {
            await loadPdfUrl(access.accessUrl, loadToken);
          }
          fullFileReady = true;
          cloudPreviewSucceeded();
          return;
        } catch (cloudError) {
          cloudPreviewFailed(cloudError);
          if (loadToken === state.previewLoadToken) {
            const note = $('.pdf-preview-fallback-note span', $('#preview-content'));
            if (note) note.textContent = 'Nuvem rápida indisponível. Abrindo a cópia segura do Drive…';
          }
        }
      }

      const file = await fetchStoredDocument(id, (completed, total) => {
        if (loadToken !== state.previewLoadToken) return;
        const note = $('.pdf-preview-fallback-note span', $('#preview-content'));
        if (note) note.textContent = `Carregando arquivo completo… ${completed}/${total}`;
        else $('#preview-content').innerHTML = `<div class="pdf-preview-loading"><span class="spinner"></span><strong>Carregando documento… ${completed}/${total}</strong></div>`;
      }, 'PREVIEW', {skipCloud:cloudAttempted || cloudPreviewCircuitOpen()});
      if (loadToken !== state.previewLoadToken) return;
      fullFileReady = true;
      const isImage = String(file.mimeType || '').startsWith('image/');
      if (isImage) {
        const url = URL.createObjectURL(new Blob([file.bytes], {type:file.mimeType}));
        setPreviewObjectUrl(url, true, false);
        $('#preview-content').innerHTML = `<img class="rotatable-preview-image" src="${esc(url)}" alt="Prévia de ${esc(file.fileName)}" style="transform:rotate(${state.previewRotation}deg)">`;
      } else {
        const url = URL.createObjectURL(new Blob([file.bytes], {type:file.mimeType || 'application/pdf'}));
        setPreviewObjectUrl(url, true, false);
        try { await loadPdfBytes(file.bytes, loadToken); }
        catch (pdfError) { if (loadToken === state.previewLoadToken) renderPdfFailure(pdfError); }
      }
    } catch (error) {
      if (loadToken === state.previewLoadToken) {
        if (state.previewFallbackIsImage) renderPdfFailure(error);
        else {
          $('#pdf-preview-controls').classList.add('hidden');
          $('#preview-content').innerHTML = `<div class="pdf-preview-error"><strong>O documento está registrado, mas não pôde ser aberto.</strong><p>${esc(error.message)}</p><button type="button" class="btn secondary compact" data-retry-preview-doc="${esc(id)}">Tentar novamente</button></div>`;
          toast(error.message, 'error');
        }
      }
    }
    finally {
      setBusy(busyButton, false);
      if (busyMedia?.isConnected) {
        busyMedia.classList.remove('preview-opening');
        busyMedia.removeAttribute('aria-busy');
      }
    }
  }

  function restoreVisualThumbnailsAfterPreview() {
    if (state.processDetailTab !== 'documents' || !state.currentProcess) return;
    const pane = $('[data-process-detail-pane="documents"]', $('#detail-content'));
    if (!pane) return;
    const cards = $$('[data-visual-document]', pane);
    const corrupted = cards.some(card => !card.querySelector('[data-visual-thumbnail]'));
    if (corrupted) {
      renderProcessPane('documents', state.currentProcess);
      return;
    }
    cards.forEach(card => {
      const image = card.querySelector('[data-visual-thumbnail] img');
      const brokenImage = image?.complete && Number(image.naturalWidth || 0) === 0;
      if (card.dataset.thumbnailState === 'loaded' && (!image || brokenImage)) {
        delete card.dataset.thumbnailState;
      }
    });
    scheduleVisualThumbnails();
  }

  function closePreview() {
    const returnModal = state.previewReturnModal;
    const returnFocus = state.previewReturnFocus;
    state.previewReturnModal = '';
    state.previewReturnFocus = null;
    resetPreviewState();
    if (returnModal && $('#' + returnModal)) openModal(returnModal);
    else closeModal();
    requestAnimationFrame(() => {
      restoreVisualThumbnailsAfterPreview();
      if (returnFocus?.isConnected && typeof returnFocus.focus === 'function') returnFocus.focus();
    });
  }

  function openPreviewInNewTab() {
    if (!state.previewObjectUrl) return toast('Aguarde o documento terminar de carregar.', 'error');
    const opened = window.open(state.previewObjectUrl, '_blank', 'noopener,noreferrer');
    if (!opened) toast('O navegador bloqueou a nova guia. Autorize pop-ups para este site.', 'error');

  function togglePreviewSize(button) {
    const expanded = $('#preview-modal').classList.toggle('expanded');
    button.textContent = expanded ? 'Reduzir' : 'Ampliar';

  async function changePdfPage(delta) {
    if (!state.pdfDocument || state.pdfRenderTask) return;
    const next = Math.min(Math.max(state.pdfPage + delta, 1), state.pdfDocument.numPages);
    if (next === state.pdfPage) return;
    state.pdfPage = next;
    try { await renderPdfPage(); } catch (error) { renderPdfFailure(error); }
  }

  async function changePdfZoom(delta) {
    if (!state.pdfDocument || state.pdfRenderTask) return;
    state.pdfScale = Math.min(Math.max(state.pdfScale + delta, 0.6), 2.5);
    try { await renderPdfPage(); } catch (error) { renderPdfFailure(error); }
  }

  async function rotatePreview(delta) {
    state.previewRotation = (state.previewRotation + Number(delta || 0) + 360) % 360;
    $('#preview-rotation-label').textContent = `${state.previewRotation}°`;
    if (state.pdfDocument) {
      if (state.pdfRenderTask) {
        try { state.pdfRenderTask.cancel(); } catch (ignore) {}
        state.pdfRenderTask = null;
      }
      try { await renderPdfPage(); } catch (error) { renderPdfFailure(error); }
      return;
    }
    const image = $('.rotatable-preview-image', $('#preview-content'));
    if (image) {
      image.style.transform = `rotate(${state.previewRotation}deg)`;
      image.classList.toggle('quarter-turn', state.previewRotation === 90 || state.previewRotation === 270);
    }
  }

  async function refreshDocumentSurface(surface) {
    const processId = state.currentProcess?.process?.id;
    if (!processId) return;
    if (surface === 'document-upload-modal') {
      const [base, documents] = await Promise.all([
        api('apiAbrirProcesso', state.token, processId),
        api('apiCarregarAbaProcesso', state.token, processId, 'DOCUMENTOS')
      ]);
      state.currentProcess = {...state.currentProcess, ...base, ...documents};

  function mediaCloudEnabled() {
    const configured = state.bootstrap?.config?.MEDIA_CLOUD_ENABLED;
    return configured === true || ['SIM','TRUE'].includes(String(configured || '').toUpperCase());
  }

  function mediaLargeUploadConfigured() {
    const config = state.bootstrap?.config || {};
    const enabled = config.MEDIA_LARGE_UPLOAD_ENABLED === true ||
      ['SIM','TRUE'].includes(String(config.MEDIA_LARGE_UPLOAD_ENABLED || '').toUpperCase());
    const workerReady = config.MEDIA_DRIVE_SYNC_WORKER_READY === true ||
      ['SIM','TRUE'].includes(String(config.MEDIA_DRIVE_SYNC_WORKER_READY || '').toUpperCase());
    return mediaCloudEnabled() && enabled && workerReady;
  }

  function effectiveUploadLimitMb(mimeType, catalogLimitMb = 0) {
    if (mediaLargeUploadConfigured()) return cloudUploadLimitMb(mimeType, catalogLimitMb);
    const catalog = Number(catalogLimitMb || 6);
    return Math.min(Number.isFinite(catalog) && catalog > 0 ? catalog : 6, 6);
  }

  function cloudUploadLimitMb(mimeType, catalogLimitMb = 0) {
    const isPdf = String(mimeType || '').toLowerCase() === 'application/pdf';
    const configured = isPdf
      ? Number(state.bootstrap?.config?.MEDIA_MAX_PDF_SOURCE_MB || 100)
      : Number(state.bootstrap?.config?.MEDIA_MAX_UPLOAD_MB || 25);
    const absoluteMaximum = isPdf ? 100 : 25;
    let limit = Math.min(Math.max(configured, 1), absoluteMaximum);
    const catalogLimit = Number(catalogLimitMb || 0);
    const legacyDirectLimit = 6;
    if (Number.isFinite(catalogLimit) && catalogLimit > 0 && catalogLimit !== legacyDirectLimit) {
      limit = Math.min(limit, catalogLimit);
    }
    return limit;
  }

  async function mediaApiRequest(baseUrl, path, options = {}) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), Number(options.timeoutMs || 60000));
    try {
      const response = await fetch(`${String(baseUrl || '').replace(/\/+$/, '')}${path}`, {
        method: options.method || 'POST',
        headers: {'Content-Type':'application/json', ...(options.headers || {})},
        body: options.body === undefined ? undefined : JSON.stringify(options.body),
        cache: 'no-store',
        credentials: 'omit',
        signal: controller.signal
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload?.ok) {
        const error = new Error(payload?.message || `A nuvem documental respondeu ${response.status}.`);
        error.code = payload?.code || 'MEDIA_API_ERROR';
        throw error;
      }
      return payload.data;
    } catch (error) {
      if (error?.name === 'AbortError') throw new Error('A nuvem documental demorou para responder. O envio pode ser retomado.');
      throw error;
    } finally {
      clearTimeout(timer);
    }
  }

  async function requestCloudAccess(documentId, usage = 'VIEW', role = 'document', timeoutMs = CLOUD_DOCUMENT_TIMEOUT_MS) {
    const action = String(usage || 'VIEW').toUpperCase() === 'DOWNLOAD' ? 'DOWNLOAD' : 'VIEW';
    const accessKey = `${documentCacheIdentity(documentId)}|${action}|${role}`;
    const cached = state.cloudAccessCache.get(accessKey);
    if (cached && Number(cached.expiresAt || 0) > Date.now() + 5000) return cached.value;
    if (cached) state.cloudAccessCache.delete(accessKey);
    const ticket = await api('apiCriarTicketMidia', state.token, documentId, action, requestId());
    const result = await mediaApiRequest(ticket.apiBaseUrl, '/api/v1/media/access-url', {
      body: {
        ticket: ticket.ticket,
        preferOptimized: action === 'VIEW',
        role
      },
      timeoutMs
    });
    const lifetime = Math.max(5, Math.min(Number(result.expiresIn || 60), 60));
    state.cloudAccessCache.set(accessKey, {value:result, expiresAt:Date.now() + lifetime * 1000});
    return result;
  }

  async function loadTusClient() {
    if (globalThis.tus?.Upload) return globalThis.tus;
    if (state.tusClientPromise) return state.tusClientPromise;
    state.tusClientPromise = new Promise((resolve, reject) => {
      const existing = document.querySelector('script[data-autentiko-tus]');
      if (existing) {
        existing.addEventListener('load', () => globalThis.tus?.Upload ? resolve(globalThis.tus) : reject(new Error('Cliente de upload indisponível.')), {once:true});
        existing.addEventListener('error', () => reject(new Error('Não foi possível carregar o cliente de upload.')), {once:true});
        return;
      }
      const script = document.createElement('script');
      script.src = ['https:', '', 'cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js'].join('/');
      script.async = true;
      script.dataset.autentikoTus = 'true';
      script.onload = () => globalThis.tus?.Upload ? resolve(globalThis.tus) : reject(new Error('Cliente de upload indisponível.'));
      script.onerror = () => reject(new Error('Não foi possível carregar o cliente de upload.'));
      document.head.appendChild(script);
    }).finally(() => {
      if (!globalThis.tus?.Upload) state.tusClientPromise = null;
    });
    return state.tusClientPromise;
  }

  async function createThumbnailFromLocalFile(file, bytes) {
    const mimeType = String(file?.type || '').toLowerCase();
    const maxWidth = 360;
    const maxHeight = 270;
    let canvas = document.createElement('canvas');
    let dispose = () => {};
    try {
      if (mimeType === 'application/pdf') {
        if (!bytes || Number(file.size || 0) > 12 * 1024 * 1024) return null;
        const pdfjs = await loadPdfJs();
        const assetBase = ['https:', '', 'cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284'].join('/');
        const pdf = await pdfjs.getDocument({
          data:bytes,
          cMapUrl:assetBase + '/cmaps/',
          cMapPacked:true,
          standardFontDataUrl:assetBase + '/standard_fonts/',
          wasmUrl:assetBase + '/wasm/'
        }).promise;
        dispose = () => { try { void pdf.destroy(); } catch (ignore) {} };
        const page = await pdf.getPage(1);
        const original = page.getViewport({scale:1});
        const scale = Math.min(maxWidth / original.width, maxHeight / original.height, 1.5);
        const viewport = page.getViewport({scale});
        canvas.width = Math.max(1, Math.floor(viewport.width));
        canvas.height = Math.max(1, Math.floor(viewport.height));
        await page.render({canvasContext:canvas.getContext('2d', {alpha:false}), viewport}).promise;
      } else if (mimeType.startsWith('image/')) {
        const bitmap = await createImageBitmap(file);
        dispose = () => { try { bitmap.close(); } catch (ignore) {} };
        const scale = Math.min(maxWidth / bitmap.width, maxHeight / bitmap.height, 1);
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        const context = canvas.getContext('2d', {alpha:false});
        context.fillStyle = '#fff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      } else {
        return null;
      }
      const preferred = canvas.toDataURL('image/webp').startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg';
      return await canvasToBoundedThumbnailBlob(canvas, preferred, 80 * 1024);
    } finally {
      dispose();
      canvas.width = 1;
      canvas.height = 1;
      canvas = null;
    }
  }

  async function uploadTusObject(file, target, job) {
    const client = await loadTusClient();
    await new Promise((resolve, reject) => {
      let lastPaint = 0;
      const upload = new client.Upload(file, {
        endpoint: target.tusEndpoint || target.tusUrl,
        headers: {'x-signature': target.uploadToken},
        chunkSize: 6 * 1024 * 1024,
        uploadDataDuringCreation: true,
        uploadSize: file.size,
        retryDelays: [0, 1000, 3000, 5000, 10000],
        removeFingerprintOnSuccess: true,
        metadata: {
          bucketName: target.bucket,
          objectName: target.objectPath,
          contentType: file.type || 'application/octet-stream',
          cacheControl: target.role === 'thumbnail' ? '604800' : '3600'
        },
        onError: reject,
        onProgress: (uploaded, total) => {
          job.progress = total ? Math.min(Math.round((uploaded / total) * 100), 100) : 0;
          if (performance.now() - lastPaint > 120) {
            lastPaint = performance.now();
            renderUploadQueue();
          }
        },
        onSuccess: resolve
      });
      upload.findPreviousUploads().then(previous => {
        if (previous.length) upload.resumeFromPreviousUpload(previous[0]);
        upload.start();
      }).catch(reject);
    });
  }

  async function runCloudUploadJob(job, options = {}) {
    if (!job.cloudSession) {
      job.progress = 1;
      renderUploadQueue();
      const sha256 = await sha256FileInWorker(job.file);
      if (!sha256) throw new Error('Este navegador não conseguiu calcular o hash seguro do documento.');
      let thumbnail = null;
      try {
        const previewBytes = job.file.type === 'application/pdf' && job.file.size <= 12 * 1024 * 1024
          ? new Uint8Array(await job.file.arrayBuffer()) : null;
        thumbnail = await createThumbnailFromLocalFile(job.file, previewBytes);
        if (!thumbnail && job.file.type === 'application/pdf') job.thumbnailWarning = 'Miniatura será gerada na nuvem sem bloquear o envio.';
      }
      catch (error) { job.thumbnailWarning = error.message || 'Miniatura pendente de processamento.'; }
      const cloudRequestId = options.requestId || `${job.attemptRequestId || job.id}:cloud`;
      const reservation = await api('apiReservarUploadNuvem', state.token, {
        processId: job.processId,
        documentId: options.documentId || '',
        typeId: job.typeId,
        fileName: job.fileName,
        mimeType: job.file.type,
        size: job.file.size,
        sha256,
        expectedVersion: job.expectedVersion,
        requestId: cloudRequestId,
        context: {...state.context, requestId:cloudRequestId}
      });
      if (reservation.alreadyReady) {
        job.documentId = reservation.documentId;
        job.driveSyncPending = false;
        return {...reservation, finalization:{driveSyncPending:false, driveReady:true, syncState:'SINCRONIZADO'}};
      }
      const objectInputs = [{
        role:'original',
        mimeType:job.file.type,
        size:job.file.size,
        sha256
      }];
      if (thumbnail) {
        objectInputs.push({
          role:'thumbnail',
          mimeType:thumbnail.type,
          size:thumbnail.size,
          sha256:await sha256FileInWorker(thumbnail)
        });
      }
      const session = await mediaApiRequest(reservation.apiBaseUrl, '/api/v1/media/uploads', {
        body:{ticket:reservation.ticket, objects:objectInputs}
      });
      job.cloudSession = {reservation, session, sha256, thumbnail, requestId:cloudRequestId};
    }
    const {reservation, session, sha256, thumbnail, requestId:cloudRequestId} = job.cloudSession;
    for (const target of session.objects) {
      const source = target.role === 'thumbnail' ? thumbnail : job.file;
      if (source) await uploadTusObject(source, target, job);
    }
    const completed = await mediaApiRequest(reservation.apiBaseUrl, '/api/v1/media/uploads/complete', {
      body:{completionToken:session.completionToken},
      timeoutMs:120000
    });
    let finalization;
    try {
      finalization = await api('apiFinalizarUploadNuvem', state.token, completed.receipt, cloudRequestId);
    } catch (error) {
      if (error?.code !== 'DUPLICATE_REQUEST') throw error;
      const status = await api('apiConsultarEstadoMidia', state.token, reservation.documentId);
      if (status.status !== 'READY') throw error;
      finalization = {
        driveSyncPending:status.driveSupabaseSync !== 'SINCRONIZADO',
        driveReady:status.driveSupabaseSync === 'SINCRONIZADO',
        syncState:status.driveSupabaseSync
      };
    }
    job.documentId = reservation.documentId;
    job.driveSyncPending = Boolean(finalization?.driveSyncPending);
    if (thumbnail) {
      const identity = documentCacheIdentity(reservation.documentId, {
        hash:sha256,
        version:reservation.mediaVersion,
        recordVersion:1
      });
      await browserCachePut('thumbnail', identity, thumbnail, {
        mimeType:thumbnail.type,
        fileName:job.fileName,
        hash:sha256
      });
    }
    return {...reservation, finalization};
  }

  function createUploadJobForm(job, uploadRequestId) {
    const form = document.createElement('form');
    form.className = 'hidden background-upload-form';
    form.dataset.apiKey = uploadRequestId;
    const fields = {
      token:state.token,
      processId:job.processId,
      typeId:job.typeId,
      expectedVersion:job.expectedVersion,
      contextJson:JSON.stringify({...state.context, requestId:uploadRequestId})
    };
    Object.entries(fields).forEach(([name,value]) => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = name;
      input.value = value;
      form.appendChild(input);
    });
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.name = 'file';
    const transfer = new DataTransfer();
    transfer.items.add(job.file);
    fileInput.files = transfer.files;
    form.appendChild(fileInput);
    document.body.appendChild(form);
    return form;
  }

  function renderUploadQueue() {
    const widget = $('#upload-queue-widget');
    const jobs = [...state.uploadJobs.values()].slice(-30).reverse();
    if (!jobs.length) {
      widget.classList.add('hidden');
      return;
    }
    widget.classList.remove('hidden');
    const active = jobs.filter(job => ['queued','uploading'].includes(job.status)).length;
    const replicating = jobs.filter(job => job.replicaInProgress).length;
    const failed = jobs.filter(job => job.status === 'failed').length;
    const complete = jobs.filter(job => job.status === 'complete').length;
    const warnings = jobs.filter(job => job.status === 'complete' && job.warning).length;
    $('#upload-queue-summary').textContent = active
      ? `${active} em andamento · ${complete} concluído(s)`
      : replicating
        ? `${complete} salvo(s) · ${replicating} sincronizando na nuvem rápida`
      : failed
        ? `${failed} com falha · ${complete} concluído(s)`
        : warnings
          ? `${complete} armazenado(s) · ${warnings} redundância(s) pendente(s)`
          : `${complete} concluído(s)`;
    $('#upload-queue-items').innerHTML = jobs.map(job => {
      const message = job.status === 'queued'
        ? 'Na fila segura'
        : job.status === 'uploading'
          ? `Enviando sem bloquear a tela… ${esc(job.progress || 0)}%`
          : job.status === 'complete'
            ? esc(job.replicaInProgress ? 'Original salvo no Drive. Criando a cópia rápida sem bloquear a tela…' : job.warning || job.syncMessage || 'Enviado com sucesso')
            : esc(job.error || 'Falha no envio');
      const extraClass = job.status === 'complete' && job.warning ? ' has-warning' : '';
      const trailing = job.status === 'uploading' || job.replicaInProgress
        ? '<span class="mini-spinner"></span>'
        : job.status === 'complete'
          ? `<b title="${job.protectionPending ? 'Original no Supabase; cópia de segurança no Drive pendente' : job.warning ? 'Original no Drive; réplica rápida pendente' : 'Envio e redundância concluídos'}">${job.warning ? '!' : '✓'}</b>`
          : job.status === 'failed'
            ? `<button type="button" class="link-btn" data-retry-upload-job="${esc(job.id)}">Tentar novamente</button>`
            : '';
      return `<article class="upload-queue-item status-${esc(job.status)}${extraClass}"><span class="upload-job-light"></span><div><strong title="${esc(job.fileName)}">${esc(job.fileName)}</strong><small>${esc(job.documentName)} · ${esc(fileSizeText(job.size))}</small><p>${message}</p></div>${trailing}</article>`;
    }).join('');
  }

  function enqueueDocumentUploads(typeId, items, documentName) {
    const processId = state.currentProcess?.process?.id;
    if (!processId) return;
    items.forEach(item => {
      const id = requestId();
      state.uploadJobs.set(id, {
        id, processId, typeId, documentName, file:item.file, fileName:item.file.name,
        size:item.file.size, expectedVersion:state.currentProcess?.process?.version || 1,
        status:'queued', error:'', createdAt:Date.now()
      });
      state.uploadQueue.push(id);
    });
    renderUploadQueue();
    processUploadQueue();
  }

  function processUploadQueue() {
    while (state.uploadWorkers < state.uploadConcurrency && state.uploadQueue.length) {
      const id = state.uploadQueue.shift();
      const job = state.uploadJobs.get(id);
      if (!job || job.status !== 'queued') continue;
      state.uploadWorkers += 1;
      void runUploadJob(job);
    }
  }

  async function replicateDriveUploadInBackground(job, documentId) {
    if (!mediaCloudEnabled() || !job.file || !documentId) {
      job.file = null;
      return;
    }
    job.replicaInProgress = true;
    job.warning = '';
    job.syncMessage = 'Original salvo no Drive. Criando a cópia rápida sem bloquear a tela…';
    renderUploadQueue();
    try {
      job.cloudSession = null;
      const cloudResult = await runCloudUploadJob(job, {
        documentId,
        requestId:`${job.attemptRequestId}:replica`
      });
      job.driveSyncPending = Boolean(cloudResult?.finalization?.driveSyncPending);
      job.warning = job.driveSyncPending
        ? 'Original protegido no Drive. A réplica rápida continua pendente e será retomada sem afetar o documento.'
        : '';
      job.syncMessage = job.driveSyncPending
        ? job.warning
        : 'Salvo no Google Drive e sincronizado com a nuvem rápida.';
    } catch (cloudError) {
      let synchronized = false;
      try {
        const status = await api('apiConsultarEstadoMidia', state.token, documentId);
        synchronized = status?.status === 'READY' && status?.driveSupabaseSync === 'SINCRONIZADO';
      } catch (ignoreStatusFailure) {}
      if (synchronized) {
        job.warning = '';
        job.syncMessage = 'Salvo no Google Drive e sincronizado com a nuvem rápida.';
      } else {
        job.warning = 'Salvo com segurança no Google Drive. O Supabase oscilou; a réplica rápida ficou pendente sem bloquear o arquivo.';
        job.syncMessage = job.warning;
        job.cloudError = cloudError?.code || cloudError?.message || 'MEDIA_REPLICA_PENDING';
      }
    } finally {
      job.replicaInProgress = false;
      job.file = null;
      job.cloudSession = null;
      renderUploadQueue();
      invalidateProcessTabCache(job.processId, ['documents']);
    }
  }

  async function runUploadJob(job) {
    job.status = 'uploading';
    job.error = '';
    job.warning = '';
    job.syncMessage = '';
    job.protectionPending = false;
    job.attempt = Number(job.attempt || 0) + 1;
    job.attemptRequestId = `${job.id}:a${job.attempt}:${requestId()}`;
    renderUploadQueue();
    let form;
    try {
      let result;
      const directDriveLimit = 6 * 1024 * 1024;
      if (job.size <= directDriveLimit) {
        const driveRequestId = `${job.attemptRequestId}:drive`;
        form = createUploadJobForm(job, driveRequestId);
        result = await api('apiUploadDocumentoForm', form);
        form.remove();
        form = null;
        job.documentId = result.id;
        job.syncMessage = 'Salvo com segurança no Google Drive.';

        if (mediaCloudEnabled()) {
          job.replicaScheduled = true;
          job.syncMessage = 'Salvo no Google Drive. A cópia rápida será criada em segundo plano.';
        }
      } else if (mediaCloudEnabled()) {
        if (!mediaLargeUploadConfigured()) {
          throw new Error('Uploads acima de 6 MB estão temporariamente bloqueados até a cópia automática no Google Drive ser validada. Nenhum arquivo foi alterado.');
        }
        const readiness = await api('apiVerificarProntidaoUploadGrande', state.token, true);
        if (!readiness?.ready) {
          const hold = new Error(readiness?.message || 'A cópia automática no Google Drive ainda não está saudável. Nenhum arquivo foi alterado.');
          hold.code = readiness?.code || 'LARGE_UPLOAD_SAFETY_HOLD';
          throw hold;
        }
        result = await runCloudUploadJob(job, {requestId:`${job.attemptRequestId}:cloud`});
        job.protectionPending = Boolean(result?.finalization?.driveSyncPending);
        if (job.protectionPending) {
          job.warning = 'Original armazenado no Supabase. A cópia de segurança no Google Drive ainda está pendente; a redundância não foi concluída.';
          job.syncMessage = job.warning;
        } else {
          job.syncMessage = 'Documento sincronizado no Supabase e no Google Drive.';
        }
      } else {
        throw new Error('Arquivos acima de 6 MB exigem a nuvem documental ativa. O arquivo não foi alterado.');
      }
      job.status = 'complete';
      job.progress = 100;
      if (!job.replicaScheduled) job.file = null;
      job.cloudSession = null;
    } catch (error) {
      job.status = 'failed';
      job.error = error.message || 'Não foi possível enviar.';
    } finally {
      form?.remove();
      state.uploadWorkers = Math.max(state.uploadWorkers - 1, 0);
      renderUploadQueue();
      processUploadQueue();
      scheduleUploadRefresh(job.processId);
      if (job.status === 'complete' && job.replicaScheduled && job.documentId) {
        job.replicaScheduled = false;
        setTimeout(() => void replicateDriveUploadInBackground(job, job.documentId), 0);
      }
    }
  }

  function scheduleUploadRefresh(processId) {
    clearTimeout(state.uploadRefreshTimer);
    state.uploadRefreshTimer = setTimeout(async () => {
      const active = [...state.uploadJobs.values()].some(job => job.processId === processId && ['queued','uploading'].includes(job.status));
      if (active) return scheduleUploadRefresh(processId);
      try {
        if (state.currentProcess?.process?.id === processId) {
          const surface = activeModalId();
          if (surface === 'document-upload-modal') await refreshDocumentSurface(surface);
          else if (surface === 'detail-modal') await syncProcessAfterMutation(['documents','review']);
        }
        scheduleProcessListRefresh();
      } catch (error) {
        toast('Os arquivos foram enviados, mas a lista não pôde ser atualizada agora.', 'error');
      }
    }, 700);
  }

  function hasPendingUploads(processId) {
    return [...state.uploadJobs.values()].some(job => job.processId === processId && ['queued','uploading'].includes(job.status));
  }

  function retryUploadJob(id) {
    const job = state.uploadJobs.get(id);
    if (!job || job.status !== 'failed' || !job.file) return;
    job.status = 'queued';
    job.error = '';
    job.warning = '';
    job.attemptRequestId = '';
    state.uploadQueue.push(id);
    renderUploadQueue();
    processUploadQueue();
  }

  function clearCompletedUploadJobs() {
    [...state.uploadJobs.entries()].forEach(([id,job]) => {
      if (job.status === 'complete' && !job.replicaInProgress) state.uploadJobs.delete(id);
    });
    renderUploadQueue();
  }

  function uploadDocument(typeId, button) {
    const form = button.closest('[data-document-upload]');
    const key = documentFileKey(form);
    const items = [...(state.pendingDocumentFiles.get(key) || [])];
    if (!items.length) return toast('Selecione pelo menos um arquivo.', 'error');
    const documentName = $('.document-card-head strong', form)?.textContent || typeId;
    enqueueDocumentUploads(typeId, items, documentName);
    clearDocumentFile(form);
    toast(`${items.length} arquivo(s) colocado(s) na fila segura. Você pode continuar usando o sistema.`, 'success');
  }

  async function downloadDocument(id, button) {
    setBusy(button,true,'Preparando...');
    try {
      const cloudMetadata = cloudDocumentMetadata(id);
      let cloudAttempted = false;
      if (cloudMetadata && !cloudPreviewCircuitOpen()) {
        cloudAttempted = true;
        try {
          const access = await requestCloudAccess(id, 'DOWNLOAD', 'document', CLOUD_DOCUMENT_TIMEOUT_MS);
          const anchor = document.createElement('a');
          anchor.href = access.accessUrl;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          anchor.download = cloudMetadata.fileName || 'documento';
          anchor.click();
          cloudPreviewSucceeded();
          return;
        } catch (cloudError) {
          cloudPreviewFailed(cloudError);
        }
      }
      const file = await fetchStoredDocument(id, (completed, total) => {
        if (button?.isConnected) button.textContent = `Baixando ${completed}/${total}`;
      }, 'DOWNLOAD', {skipCloud:cloudAttempted || cloudPreviewCircuitOpen()});
      const url = URL.createObjectURL(new Blob([file.bytes], {type:file.mimeType}));
      const a = document.createElement('a'); a.href=url; a.download=file.fileName; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    } catch(error) { toast(error.message,'error'); }
    finally { setBusy(button,false); }
  }

  async function removeStoredDocument(id, button) {
    if (!confirm('Remover este documento do processo? O arquivo será excluído logicamente e a ação ficará registrada na auditoria.')) return;
    setBusy(button, true, 'Removendo...');
    try {
      const identity = documentCacheIdentity(id);
      await api('apiExcluirDocumento', state.token, id, state.context);
      await Promise.all([
        browserCacheDelete('document', identity),
        browserCacheDelete('thumbnail', identity)
      ]);
      [...state.cloudAccessCache.keys()].filter(key => key.startsWith(`${identity}|`))
        .forEach(key => state.cloudAccessCache.delete(key));
      const visualUrl = state.visualObjectUrls.get(id);
      if (visualUrl) revokeObjectUrl(visualUrl);
      state.visualObjectUrls.delete(id);
      toast('Documento removido logicamente com sucesso.', 'success');
      await refreshDetail(['documents','review']);
    } catch (error) {
      toast(error.message, 'error');
    } finally {
      if (button?.isConnected) setBusy(button, false);
    }
  }

  async function submitForward(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const button = $('button[type=submit]', form);
    const sector = form.querySelector('[name=sector]:checked')?.value || '';
    const userId = form.querySelector('[name=userId]:checked')?.value || '';
    const message = $('#forward-message');
    if (!sector || !userId) {
      message.textContent = 'Escolha o setor e o responsável.';
      return;
    }
    message.textContent = '';
    setBusy(button, true, 'Encaminhando...');
    try {
      const processId = state.currentProcess.process.id;
      const result = await api('apiEncaminharProcesso', state.token, processId, {
        sector,
        userId,
        observation: formControl(form, 'observation').value
      }, state.context);
      toast(`Processo encaminhado para ${result.responsible.name}.`, 'success');

      openModal('detail-modal');
      await syncProcessAfterMutation(['review']);

      message.textContent = error.message;
    } finally { setBusy(button, false); }

  async function loadAdmin(tab = '', force = false) {
    const targetTab = tab || activeAdminTab();
    const loadedAt = Number(state.adminLoadedAt.get(targetTab) || 0);
    if (!force && state.admin && Date.now() - loadedAt < 60000) {
      renderAdminNavigation();
      renderAdminSection(targetTab);
      return;
    }
    const contentIds={users:'users-table',documents:'documents-table',fields:'fields-table',models:'contract-models-table',settings:'settings-table',security:'security-health'};
    const target = $(`#${contentIds[targetTab] || ''}`);
    if (target) target.innerHTML = `<div class="empty-state">Carregando ${esc(targetTab)}...</div>`;
    try {
      const result = await api('apiAdminBootstrap', state.token, targetTab);
      state.admin = Object.assign(state.admin || {}, result);
      state.adminLoadedAt.set(targetTab, Date.now());
      renderAdminNavigation();
      renderAdminSection(targetTab);
    } catch(error) { if(target)target.innerHTML = `<div class="empty-state">${esc(error.message)}</div>`; }
  }

  function renderAdminNavigation() {
    const allowed = new Set(state.admin?.availableTabs || []);
    const available = Object.fromEntries(['users','documents','fields','models','settings','security'].map(tab=>[tab,allowed.has(tab)]));
    $$('.subtab').forEach(button => button.classList.toggle('hidden', !available[button.dataset.adminTab]));
    $$('.admin-tab').forEach(tab => tab.classList.toggle('hidden', !available[tab.id.replace('admin-', '')]));
    const active = $$('.subtab').find(button => button.classList.contains('active') && available[button.dataset.adminTab])
      || $$('.subtab').find(button => available[button.dataset.adminTab]);
    $$('.subtab').forEach(button => button.classList.toggle('active', button === active));
    $$('.admin-tab').forEach(tab => tab.classList.toggle('active', Boolean(active) && tab.id === `admin-${active.dataset.adminTab}`));
  }

  function dateInputValue(value) {
    const text = String(value || '');
    const br = text.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return br ? `${br[3]}-${br[2]}-${br[1]}` : (/^\d{4}-\d{2}-\d{2}$/.test(text) ? text : '');
  }

  function renderConfigControl(config) {
    const disabled = config.editable ? '' : 'disabled';
    const type = String(config.type || 'TEXT').toUpperCase();
    if (type === 'BOOLEAN') return `<select name="value" ${disabled}><option value="SIM" ${String(config.value).toUpperCase()==='SIM'?'selected':''}>Sim</option><option value="NAO" ${String(config.value).toUpperCase()!=='SIM'?'selected':''}>Não</option></select>`;
    if (type === 'JSON') return `<textarea name="value" maxlength="45000" spellcheck="false" ${disabled}>${esc(config.value)}</textarea>`;
    if (type === 'SENSITIVE') return `<input name="value" type="password" maxlength="5000" autocomplete="new-password" placeholder="${config.hasValue?'Valor protegido — deixe em branco para manter':'Informe o valor secreto'}" ${disabled}>`;
    if (type === 'NUMBER') return `<input name="value" type="number" value="${esc(config.value)}" ${disabled}>`;
    if (type === 'DATE') return `<input name="value" type="date" value="${esc(dateInputValue(config.value))}" ${disabled}>`;
    if (type === 'URL') return `<input name="value" type="url" maxlength="5000" value="${esc(config.value)}" placeholder="URL segura iniciada por https" ${disabled}>`;
    if (type === 'COLOR') return `<div class="config-color-control"><input name="value" type="color" value="${esc(/^#[0-9A-F]{6}$/i.test(config.value)?config.value:'#155eef')}" ${disabled}><code>${esc(config.value || '#155EEF')}</code></div>`;
    const longText = String(config.value || '').length > 120 || /MENSAGEM|ENDERECO/i.test(config.key);
    return longText ? `<textarea name="value" maxlength="5000" ${disabled}>${esc(config.value)}</textarea>` : `<input name="value" maxlength="5000" value="${esc(config.value)}" ${disabled}>`;
  }

  function renderConfigCard(config) {
    return `<form class="config-card" data-config-form data-config-key="${esc(config.key)}"><div class="config-card-head"><div><strong>${esc(config.key)}</strong><span>${esc(config.type)}</span></div>${config.type==='SENSITIVE'&&config.hasValue?'<span class="config-protected">Protegido</span>':''}</div><p>${esc(config.description || 'Sem descrição.')}</p>${renderConfigControl(config)}<div class="config-card-footer"><small data-config-message>${config.editable?'Pronto para editar.':'Somente leitura.'}</small>${config.editable?'<button type="submit" class="btn primary compact">Salvar</button>':''}</div></form>`;
  }
