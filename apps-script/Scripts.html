    document.addEventListener('drop',event=>{const zone=event.target.closest?.('[data-document-dropzone]');if(zone){event.preventDefault();zone.classList.remove('drag-active');const files=Array.from(event.dataTransfer?.files||[]);selectDocumentFiles(zone.closest('[data-document-upload]'),files,true);}});
    document.addEventListener('dblclick',event=>{const row=event.target.closest?.('[data-process-id]');if(row&&!event.target.closest('button')){event.preventDefault();openProcess(row.dataset.processId,'visual');}});
    $('#refresh-admin-btn').addEventListener('click',()=>loadAdmin(activeAdminTab(),true));$$('.subtab').forEach(btn=>btn.addEventListener('click',()=>{$$('.subtab').forEach(b=>b.classList.toggle('active',b===btn));$$('.admin-tab').forEach(tab=>tab.classList.toggle('active',tab.id===`admin-${btn.dataset.adminTab}`));loadAdmin(btn.dataset.adminTab);}));
    $('#refresh-contracts-btn').addEventListener('click',loadContracts);
    $('#add-user-btn').addEventListener('click',()=>openUserModal());$('#add-doc-btn').addEventListener('click',()=>openDocModal());$('#add-field-btn').addEventListener('click',()=>openFieldModal());$('#field-type-filter').addEventListener('change',renderAdminFields);
    $('#user-form').addEventListener('submit',submitUser);$('#doc-form').addEventListener('submit',submitDoc);$('#field-form').addEventListener('submit',submitField);$('#contract-model-form').addEventListener('submit',submitContractModel);$('#password-form').addEventListener('submit',submitPassword);$('#forward-form').addEventListener('submit',submitForward);$('#participant-form').addEventListener('submit',submitParticipant);$('#proposal-form').addEventListener('submit',submitProposal);$('#proposal-accept-form').addEventListener('submit',submitProposalAcceptance);$('#workflow-form').addEventListener('submit',submitWorkflow);$('#customer-record-form').addEventListener('submit',submitCustomerRecord);$('#property-record-form').addEventListener('submit',submitPropertyRecord);
    document.addEventListener('click',async event=>{
      const databaseTab=event.target.closest('[data-database-tab]');if(databaseTab){setDatabaseTab(databaseTab.dataset.databaseTab);return loadDatabase();}
      const databasePage=event.target.closest('[data-database-page]');if(databasePage){const page=Number(databasePage.dataset.databasePage||1);return databasePage.dataset.databasePageKind==='properties'?loadPropertyDatabase(page):loadCustomerDatabase(page);}
      const customerRecord=event.target.closest('[data-customer-record]');if(customerRecord)return openCustomerRecord(customerRecord.dataset.customerRecord);
      const propertyRecord=event.target.closest('[data-property-record]');if(propertyRecord)return openPropertyRecord(propertyRecord.dataset.propertyRecord);
      if(event.target.closest('[data-decline-database-match]'))return closeDatabaseMatch();
      if(event.target.closest('[data-apply-database-match]'))return applyDatabaseMatch();
      const openFlow=event.target.closest('[data-open-process-flow]');if(openFlow)return openProcess(openFlow.dataset.openProcessFlow,'flow');
      const open=event.target.closest('[data-open-process]');if(open)return openProcess(open.dataset.openProcess);
      const openContractProcess=event.target.closest('[data-open-contract-process]');if(openContractProcess)return openProcess(openContractProcess.dataset.openContractProcess,'details');
      const contractQueue=event.target.closest('[data-contract-queue]');if(contractQueue){state.contractQueue=contractQueue.dataset.contractQueue;return loadContracts();}
      const processTab=event.target.closest('[data-process-detail-tab]');if(processTab){activateProcessTab(processTab.dataset.processDetailTab);return;}
      const retryProcessTab=event.target.closest('[data-retry-process-tab]');if(retryProcessTab){ensureProcessTab(retryProcessTab.dataset.retryProcessTab,true);return;}
      const moreAudit=event.target.closest('[data-load-more-audit]');if(moreAudit){loadMoreProcessAudit(moreAudit);return;}
      const detailJump=event.target.closest('[data-jump-detail-section]');if(detailJump){jumpToDetailSection(detailJump.dataset.jumpDetailSection);return;}
      const loadThumb=event.target.closest('[data-load-visual-thumb]');if(loadThumb){setBusy(loadThumb,true,'Gerando...');await loadVisualThumbnail(loadThumb.dataset.loadVisualThumb,{force:true,allowSourceFallback:true,manual:true});if(loadThumb.isConnected)setBusy(loadThumb,false);return;}
      const dropzone=event.target.closest('[data-document-dropzone]');if(dropzone&&!event.target.matches('.document-file-input')){dropzone.querySelector('.document-file-input')?.click();return;}
      const clearFile=event.target.closest('[data-clear-document-file]');if(clearFile){clearDocumentFile(clearFile.closest('[data-document-upload]'));return;}
      const removeSelected=event.target.closest('[data-remove-selected-file]');if(removeSelected){removeSelectedDocumentFile(removeSelected.closest('[data-document-upload]'),removeSelected.dataset.removeSelectedFile);return;}
      const previewLocal=event.target.closest('[data-preview-local]');if(previewLocal)return previewLocalDocument(previewLocal.dataset.previewLocal,previewLocal.dataset.previewFileId);
      const previewStored=event.target.closest('[data-preview-doc]');if(previewStored)return previewStoredDocument(previewStored.dataset.previewDoc,previewStored);
      const retryPreview=event.target.closest('[data-retry-preview-doc]');if(retryPreview)return previewStoredDocument(retryPreview.dataset.retryPreviewDoc,retryPreview);
      const closePreviewButton=event.target.closest('[data-close-preview]');if(closePreviewButton)return closePreview();
      const togglePreview=event.target.closest('[data-toggle-preview]');if(togglePreview)return togglePreviewSize(togglePreview);
      if(event.target.closest('[data-pdf-previous]'))return changePdfPage(-1);
      if(event.target.closest('[data-pdf-next]'))return changePdfPage(1);
      if(event.target.closest('[data-pdf-zoom-out]'))return changePdfZoom(-0.15);
      if(event.target.closest('[data-pdf-zoom-in]'))return changePdfZoom(0.15);
      const rotate=event.target.closest('[data-rotate-preview]');if(rotate)return rotatePreview(Number(rotate.dataset.rotatePreview));
      if(event.target.closest('[data-preview-open-tab]'))return openPreviewInNewTab();
      const previewDownload=event.target.closest('[data-preview-download]');if(previewDownload&&state.previewDocumentId)return downloadDocument(state.previewDocumentId,previewDownload);
      const deleteDocument=event.target.closest('[data-delete-doc]');if(deleteDocument)return removeStoredDocument(deleteDocument.dataset.deleteDoc,deleteDocument);
      if(event.target.closest('[data-download-registration-sheet]')){if(!state.processLoadedTabs.has('registration'))await ensureProcessTab('registration');return downloadRegistrationSheet();}
      if(event.target.closest('[data-edit-process]'))return openEditProcess();
      const retryUpload=event.target.closest('[data-retry-upload-job]');if(retryUpload)return retryUploadJob(retryUpload.dataset.retryUploadJob);
      if(event.target.closest('[data-clear-upload-history]'))return clearCompletedUploadJobs();
      if(event.target.closest('[data-toggle-upload-queue]')){$('#upload-queue-widget').classList.toggle('collapsed');return;}
      if(event.target.closest('[data-close-forward]'))return closeForward();
      const finishRegistration=event.target.closest('[data-finish-registration]');if(finishRegistration)return finishDocumentRegistration(finishRegistration);
      const finishLater=event.target.closest('[data-finish-document-step]');if(finishLater)return finishDocumentRegistration(finishLater,'later');
      if(event.target.closest('[data-open-uploaded-process]')){const processId=state.documentUploadProcessId||state.currentProcess?.process?.id;clearPendingDocumentFiles();if(processId)return openProcess(processId);return;}
      const upload=event.target.closest('[data-upload-type]');if(upload)return uploadDocument(upload.dataset.uploadType,upload);
      const download=event.target.closest('[data-download-doc]');if(download)return downloadDocument(download.dataset.downloadDoc,download);
      const workflowAction=event.target.closest('[data-workflow-action]');if(workflowAction)return openWorkflowAction(workflowAction.dataset.workflowAction);
      const workflowDirect=event.target.closest('[data-workflow-direct]');if(workflowDirect)return runWorkflowDirect(workflowDirect.dataset.workflowDirect,workflowDirect);
      const checkDoc=event.target.closest('[data-check-document]');if(checkDoc)return checkDocument(checkDoc.dataset.checkDocument,checkDoc);
      const pendDoc=event.target.closest('[data-pend-document]');if(pendDoc)return openWorkflowAction('pend',{scope:'DOCUMENTO',documentId:pendDoc.dataset.pendDocument});
      const checkAll=event.target.closest('[data-check-all-documents]');if(checkAll)return checkAllDocuments(checkAll);
      const categoryDecision=event.target.closest('[data-category-decision]');if(categoryDecision)return decideCategory(categoryDecision.dataset.category,categoryDecision.dataset.categoryDecision,categoryDecision);
      const approveAll=event.target.closest('[data-approve-all-categories]');if(approveAll)return approveAllCategories(approveAll);
      if(event.target.closest('[data-create-addendum]'))return createAddendum();
      const integrity=event.target.closest('[data-verify-integrity]');if(integrity)return verifyIntegrity(integrity);
      if(event.target.closest('[data-add-participant]'))return openParticipantModal();
      const editParticipant=event.target.closest('[data-edit-participant]');if(editParticipant)return openParticipantModal(editParticipant.dataset.editParticipant);
      const disableParticipant=event.target.closest('[data-disable-participant]');if(disableParticipant&&confirm('Remover este participante do processo?')){try{await api('apiDesativarParticipante',state.token,processMutationPayload({participantId:disableParticipant.dataset.disableParticipant}),state.context);toast('Participante removido.','success');await refreshDetail(['registration','review']);}catch(error){toast(error.message,'error');}return;}
      if(event.target.closest('[data-add-proposal]')){if(!state.processLoadedTabs.has('registration'))await ensureProcessTab('registration');return openProposalModal();}
      const proposalAction=event.target.closest('[data-proposal-action]');if(proposalAction)return runProposalAction(proposalAction.dataset.proposalAction,proposalAction.dataset.proposalId,proposalAction);
      const previewContractButton=event.target.closest('[data-preview-contract]');if(previewContractButton)return previewContract(previewContractButton.dataset.proposalId,previewContractButton);
      const issueContractButton=event.target.closest('[data-issue-contract]');if(issueContractButton)return issueContract(issueContractButton.dataset.proposalId,issueContractButton);
      const viewContractButton=event.target.closest('[data-view-contract]');if(viewContractButton)return viewContract(viewContractButton.dataset.viewContract,false,viewContractButton);
      const viewSignedContractButton=event.target.closest('[data-view-signed-contract]');if(viewSignedContractButton)return viewContract(viewSignedContractButton.dataset.viewSignedContract,true,viewSignedContractButton);
      const uploadSigned=event.target.closest('[data-upload-signed-contract]');if(uploadSigned)return uploadSignedContract(uploadSigned.dataset.uploadSignedContract);
      const forwardProcess=event.target.closest('[data-forward-process]');if(forwardProcess)return openForwardProcess(forwardProcess);
      if(event.target.closest('[data-reserve-process]')){try{await api('apiReservarProcesso',state.token,state.currentProcess.process.id,30,state.context);toast('Processo reservado.','success');await syncProcessAfterMutation([]);}catch(error){toast(error.message,'error');}return;}
      if(event.target.closest('[data-delete-process]')){const reason=prompt('Informe o motivo da exclusão lógica:');if(reason){try{await api('apiExcluirProcesso',state.token,state.currentProcess.process.id,reason,state.context);closeModal();toast('Processo excluído logicamente.','success');await loadProcesses('dashboard');}catch(error){toast(error.message,'error');}}return;}
      if(event.target.closest('[data-add-activity]')){try{await api('apiAdicionarAtuacao',state.token,state.currentProcess.process.id,{type:$('#activity-type').value,description:$('#activity-description').value,expectedVersion:state.currentProcess.process.version},state.context);toast('Atuação registrada.','success');await refreshDetail(['review']);}catch(error){toast(error.message,'error');}return;}
      if(event.target.closest('[data-add-pending]')){try{await api('apiCriarPendencia',state.token,state.currentProcess.process.id,{title:$('#pending-title').value,description:$('#pending-description').value,dueDate:$('#pending-date').value,expectedVersion:state.currentProcess.process.version},state.context);toast('Pendência criada.','success');await refreshDetail(['review']);}catch(error){toast(error.message,'error');}return;}
      const complete=event.target.closest('[data-complete-pending]');if(complete){if(!confirm('Confirma que analisou a correção e que esta pendência foi resolvida com sucesso?'))return;try{await api('apiConcluirPendencia',state.token,complete.dataset.completePending,{...state.context,expectedVersion:state.currentProcess.process.version});toast('OK da pendência registrado com aceite eletrônico.','success');await refreshDetail(['review']);}catch(error){toast(error.message,'error');}return;}
      const editUser=event.target.closest('[data-edit-user]');if(editUser)return openUserModal(editUser.dataset.editUser);
      const userAction=event.target.closest('[data-user-action]');if(userAction&&confirm(`Confirma a ação ${userAction.dataset.userAction.toLowerCase()}?`)){try{await api('apiAcaoUsuario',state.token,userAction.dataset.userId,userAction.dataset.userAction,state.context);toast('Usuário atualizado.','success');await loadAdmin('users',true);}catch(error){toast(error.message,'error');}return;}
      const setPassword=event.target.closest('[data-set-password]');if(setPassword){const password=prompt('Nova senha temporária (mínimo 10 caracteres):');if(password){try{await api('apiDefinirSenhaUsuario',state.token,setPassword.dataset.setPassword,password,state.context);toast('Senha definida.','success');}catch(error){toast(error.message,'error');}}return;}
      const editDoc=event.target.closest('[data-edit-doc]');if(editDoc)return openDocModal(editDoc.dataset.editDoc);
      const editField=event.target.closest('[data-edit-field]');if(editField)return openFieldModal(editField.dataset.editField);
      const editModel=event.target.closest('[data-edit-contract-model]');if(editModel)return editContractModel(editModel.dataset.editContractModel);
      if(event.target.closest('[data-add-contract-clause]'))return addContractClause();
      const removeClause=event.target.closest('[data-remove-contract-clause]');if(removeClause){const rows=$$('[data-contract-clause-row]');if(rows.length<=1)return toast('O modelo deve possuir ao menos uma cláusula.','error');removeClause.closest('[data-contract-clause-row]')?.remove();return;}
      const cloudHealth=event.target.closest('[data-test-cloud-health]');if(cloudHealth)return refreshAdminSecurityRemote(cloudHealth);
      const auditHealth=event.target.closest('[data-verify-audit-health]');if(auditHealth){setBusy(auditHealth,true,'Verificando...');try{const result=await api('apiVerificarIntegridadeAuditoria',state.token);toast(result.valid?'Cadeia de auditoria íntegra.':'Falha na cadeia de auditoria.',result.valid?'success':'error');await loadAdmin('security',true);}catch(error){toast(error.message,'error');}finally{if(auditHealth.isConnected)setBusy(auditHealth,false);}return;}
      const anchorAudit=event.target.closest('[data-anchor-audit]');if(anchorAudit){setBusy(anchorAudit,true,'Ancorando...');try{await api('apiAncorarAuditoria',state.token,requestId());toast('Raiz da auditoria fixada na nuvem.','success');await loadAdmin('security',true);}catch(error){toast(error.message,'error');}finally{if(anchorAudit.isConnected)setBusy(anchorAudit,false);}return;}
    });
    window.addEventListener('beforeunload',event=>{
      if(!state.processDraftDirty&&state.uploadWorkers===0)return;
      saveShortProcessDraft();
      event.preventDefault();
      event.returnValue='';
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
